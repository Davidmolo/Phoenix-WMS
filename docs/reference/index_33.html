    --text-muted:#667085;
    --text-faint:#98a2b3;
    --accent:#3454d1;
    --accent-dark:#2740a8;
    --accent-bg:#eaf0fe;
    --green:#0f7a45;
    --green-bg:#e5f6ec;
    --amber:#9a6700;
    --amber-bg:#fff4d9;
    --red:#b42318;
    --red-bg:#fde8e7;
    --gray:#52606d;
    --gray-bg:#eef1f4;
    --blue:#175cd3;
    --blue-bg:#eaf1fd;
    --radius:10px;
    --shadow:0 1px 2px rgba(16,24,40,0.06), 0 1px 3px rgba(16,24,40,0.06);
    font-size:15px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- Layout ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column;}

  header.topbar{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:16px;
    padding:8px 20px;
    min-height:112px;
    position:sticky;top:0;z-index:50;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap;}
  .brand .mark{width:96px;height:96px;display:block;flex:none;object-fit:contain;}
  /* Wraps onto extra rows (rather than clipping/relying on a hidden horizontal scrollbar) as
     more tabs get added than fit on one line — every tab stays visible and clickable. */
  nav.tabs{display:flex;gap:2px;flex:1;flex-wrap:wrap;row-gap:4px;min-width:0;}
  nav.tabs button{
    border:none;background:transparent;color:var(--text-muted);
    padding:10px 14px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  nav.tabs button:hover{background:var(--surface-2);color:var(--text);}
  nav.tabs button.active{background:var(--accent-bg);color:var(--accent-dark);}

  /* Grouped tabs (e.g. "Warehouse" folding Inventory/Locations/LPNs together) — a native
     <details>/<summary> dropdown so several related destinations sit under one nav button
     instead of each claiming its own slot. */
  nav.tabs details{position:relative;}
  nav.tabs details summary{
    list-style:none;cursor:pointer;display:flex;align-items:center;gap:3px;
    color:var(--text-muted);padding:10px 14px;border-radius:8px;font-size:13.5px;font-weight:600;white-space:nowrap;
  }
  nav.tabs details summary::-webkit-details-marker{display:none;}
  nav.tabs details summary .caret{font-size:10px;opacity:.7;}
  nav.tabs details summary:hover{background:var(--surface-2);color:var(--text);}
  nav.tabs details summary.active,
  nav.tabs details[open] summary{background:var(--accent-bg);color:var(--accent-dark);}
  nav.tabs .tab-group-menu{
    position:absolute;top:100%;left:0;margin-top:2px;z-index:60;min-width:170px;
    background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);
    padding:4px;display:flex;flex-direction:column;gap:1px;
  }
  nav.tabs .tab-group-menu button{
    text-align:left;border:none;background:transparent;color:var(--text-muted);
    padding:8px 10px;border-radius:6px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  nav.tabs .tab-group-menu button:hover{background:var(--surface-2);color:var(--text);}
  nav.tabs .tab-group-menu button.active{background:var(--accent-bg);color:var(--accent-dark);}

  .mode-toggle{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .mode-toggle .seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .mode-toggle .seg button{border:none;background:var(--surface);color:var(--text-muted);padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .mode-toggle .seg button.active{background:var(--accent);color:#fff;}

  main{flex:1;padding:22px;max-width:1320px;width:100%;margin:0 auto;}

  @media (max-width:700px){
    header.topbar{flex-wrap:wrap;height:auto;padding:10px 14px;gap:8px 10px;row-gap:8px;}
    .brand{order:1;}
    .mode-toggle{order:2;margin-left:auto;}
    /* With tabs grouped into fewer top-level buttons, they now comfortably wrap onto a couple
       of rows at phone widths instead of needing horizontal scrolling to see them all. */
    nav.tabs{order:3;flex-basis:100%;}
    nav.tabs button{padding:8px 12px;font-size:13px;}
    nav.tabs details summary{padding:8px 12px;font-size:13px;}
    main{padding:14px;}
    .mode-toggle .seg button{padding:6px 9px;font-size:11.5px;}
  }

  .demo-banner{
    background:var(--amber-bg);color:#7a5200;border:1px solid #f2dfa3;border-radius:8px;
    padding:9px 14px;font-size:12.5px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .demo-banner button{background:#fff;border:1px solid #e6cf8e;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;color:#7a5200;}

  h1.page-title{font-size:20px;margin:0 0 4px 0;}
  p.page-sub{color:var(--text-muted);margin:0 0 18px 0;font-size:13.5px;}

  /* ---------- KPI cards ---------- */
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
  .kpi .label{font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .kpi .value{font-size:26px;font-weight:700;margin-top:6px;}
  .kpi .sub{font-size:12px;color:var(--text-faint);margin-top:4px;}
  .kpi-click{cursor:pointer;transition:border-color .12s ease, box-shadow .12s ease, transform .12s ease;}
  .kpi-click:hover{border-color:var(--accent);box-shadow:0 4px 14px -6px rgba(0,0,0,.18);transform:translateY(-1px);}
  .kpi-click:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .kpi-click:active{transform:translateY(0);}

  /* ---------- Dashboard charts ---------- */
  :root{
    --viz-1:#2a78d6; --viz-2:#eb6834; --viz-3:#1baf7a; --viz-4:#eda100;
  }
  .viz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:20px;}
  .viz-card{padding:16px 18px;height:100%;box-sizing:border-box;}
  .viz-card-meter{display:flex;flex-direction:column;justify-content:center;}
  .viz-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:2px;}
  .viz-card-title{font-size:13px;font-weight:700;margin:0;}
  .viz-card-sub{font-size:12px;color:var(--text-faint);margin-top:8px;}
  .viz-toggle-btn{background:none;border:none;padding:0;font-size:11.5px;font-weight:600;color:var(--text-muted);cursor:pointer;text-decoration:underline;text-underline-offset:2px;white-space:nowrap;flex:none;}
  .viz-toggle-btn:hover{color:var(--accent);}
  .viz-card.clickable{cursor:pointer;transition:border-color .12s ease, box-shadow .12s ease, transform .12s ease;}
  .viz-card.clickable:hover{border-color:var(--accent);box-shadow:0 4px 14px -6px rgba(0,0,0,.18);transform:translateY(-1px);}
  .viz-card.clickable:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* Meter */
  .viz-meter-value{font-size:28px;font-weight:700;margin:6px 0 10px;}
  .viz-meter-track{height:18px;border-radius:9px;background:var(--accent-bg);overflow:hidden;}
  .viz-meter-fill{height:100%;background:var(--accent);border-radius:9px;transition:width .3s ease;}

  /* Horizontal bar rows */
  .viz-bars{margin-top:10px;display:flex;flex-direction:column;gap:2px;}
  .viz-bar-row{display:flex;align-items:center;gap:10px;padding:6px 6px;border-radius:6px;cursor:pointer;}
  .viz-bar-row:hover, .viz-bar-row:focus-visible{background:var(--bg);}
  .viz-bar-row:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--accent);}
  .viz-bar-label{width:112px;flex:none;font-size:12.5px;color:var(--text-muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .viz-bar-track{flex:1;height:20px;position:relative;}
  .viz-bar-fill{position:absolute;left:0;top:0;height:100%;border-radius:0 4px 4px 0;min-width:3px;transition:width .3s ease;}
  .viz-bar-value{width:30px;flex:none;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}

  /* Donut */
  .viz-donut-wrap{display:flex;align-items:center;gap:18px;margin-top:8px;flex-wrap:wrap;}
  .viz-donut-svg{flex:none;overflow:visible;}
  .viz-donut-seg{cursor:pointer;transition:opacity .12s ease;}
  .viz-donut-seg:hover, .viz-donut-seg:focus-visible{opacity:.82;}
  .viz-donut-seg:focus-visible{outline:none;}
  .viz-donut-center-value{font-size:15px;font-weight:700;fill:var(--text);}
  .viz-donut-center-label{font-size:9.5px;fill:var(--text-faint);font-weight:600;letter-spacing:.02em;}
  .viz-donut-pct-label{font-size:10px;font-weight:700;fill:var(--text-muted);}
  .viz-legend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:7px;}
  .viz-legend-row{display:flex;align-items:center;gap:8px;cursor:pointer;border-radius:6px;padding:3px 4px;}
  .viz-legend-row:hover, .viz-legend-row:focus-visible{background:var(--bg);}
  .viz-legend-row:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--accent);}
  .viz-swatch{width:10px;height:10px;border-radius:3px;flex:none;}
  .viz-legend-label{font-size:12.5px;color:var(--text-muted);font-weight:600;flex:1;}
  .viz-legend-value{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;}
  .viz-legend-pct{font-size:11px;color:var(--text-faint);width:34px;text-align:right;font-variant-numeric:tabular-nums;}

  /* Shared table-view twin */
  .viz-table{display:none;margin-top:10px;}
  .viz-wrap.show-table .viz-visual{display:none;}
  .viz-wrap.show-table .viz-table{display:block;}
  .viz-table table{font-size:12.5px;}
  .viz-table td, .viz-table th{padding:6px 8px;}

  .viz-empty{margin-top:10px;padding:18px 4px;text-align:center;color:var(--text-faint);font-size:13px;}

  /* Shared hover tooltip for chart marks */
  .viz-tip{position:fixed;pointer-events:none;background:var(--text);color:#fff;font-size:12px;padding:6px 10px;border-radius:6px;z-index:999;opacity:0;transform:translate(-50%,-100%) translateY(-10px);transition:opacity .1s ease;white-space:nowrap;box-shadow:0 4px 12px rgba(16,24,40,.22);}
  .viz-tip.show{opacity:1;}
  .viz-tip b{font-weight:700;}
  .viz-tip .sub{opacity:.78;font-weight:500;margin-left:5px;}

  /* ---------- Cards / panels ---------- */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;}
  .panel .panel-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .panel .panel-head h2{font-size:15px;margin:0;}
  .panel .panel-head p{font-size:12.5px;color:var(--text-muted);margin:2px 0 0 0;}
  .panel .panel-body{padding:16px 18px;}
  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
  @media (max-width:900px){.two-col{grid-template-columns:1fr;}}

  /* ---------- Tables ---------- */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);
    border-bottom:1px solid var(--border);padding:8px 10px;font-weight:700;white-space:nowrap;
  }
  tbody td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tfoot td{padding:9px 10px;border-top:2px solid var(--border);}
  tbody tr:hover{background:var(--surface-2);}
  .table-wrap{overflow-x:auto;}
  .row-click{cursor:pointer;}

  /* ---------- Badges ---------- */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .badge.green{background:var(--green-bg);color:var(--green);}
  .badge.amber{background:var(--amber-bg);color:var(--amber);}
  .badge.red{background:var(--red-bg);color:var(--red);}
  .badge.gray{background:var(--gray-bg);color:var(--gray);}
  .badge.blue{background:var(--blue-bg);color:var(--blue);}
  .badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);
    padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .btn:hover{background:var(--surface-2);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);}
  .btn.danger{background:var(--red-bg);border-color:#f3c6c2;color:var(--red);}
  .btn.sm{padding:5px 10px;font-size:12px;}
  .btn.lg{padding:16px 20px;font-size:15px;border-radius:12px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  /* ---------- Forms ---------- */
  label{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.02em;}
  input,select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;
    font-family:inherit;background:#fff;color:var(--text);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}
  .field{margin-bottom:12px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .loc-picker{position:relative;}
  .loc-picker-list{
    position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:20;background:#fff;border:1px solid var(--border);
    border-radius:8px;box-shadow:var(--shadow);max-height:220px;overflow-y:auto;
  }
  .loc-picker-item{padding:8px 11px;cursor:pointer;font-size:13.5px;display:flex;justify-content:space-between;gap:8px;align-items:center;}
  .loc-picker-item:hover,.loc-picker-item.hl{background:var(--accent-bg);}
  .loc-picker-item .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600;}
  .loc-picker-item .meta{color:var(--text-muted);font-size:11.5px;}
  .loc-picker-empty{padding:10px 11px;font-size:13px;color:var(--text-muted);}
  .setup-input{width:64px;padding:7px 8px;}
  @media (max-width:640px){.field-row{grid-template-columns:1fr;}}

  /* ---------- Scan / mobile mode ---------- */
  .scan-shell{max-width:480px;margin:0 auto;}
  .scan-mode-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:18px;}
  .scan-mode-btn{
    background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:16px 8px;text-align:center;cursor:pointer;
  }
  .scan-mode-btn .ic{font-size:24px;margin-bottom:6px;}
  .scan-mode-btn .lbl{font-weight:700;font-size:13px;}
  .scan-mode-btn.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent-dark);}
  .scan-input-big{font-size:20px;padding:16px 14px;letter-spacing:.02em;text-align:center;font-weight:700;}
  .scan-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow);}
  .pallet-preview{background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:13.5px;}
  .pallet-preview .pv-row{display:flex;justify-content:space-between;padding:3px 0;}
  .pallet-preview .pv-row .k{color:var(--text-muted);}

  /* ---------- Locations grid (rack elevation view) ---------- */
  .zone-block{margin-bottom:22px;}
  .zone-title{font-weight:700;font-size:13.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .aisle-group{margin-bottom:16px;}
  .aisle-heading{font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.03em;}
  .rack-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;}
  .aisle-tower{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;
    display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow);
  }
  .bay-label{
    text-align:center;font-size:11px;font-weight:700;color:var(--text-muted);padding-top:4px;
    border-top:1px solid var(--border);margin-top:2px;text-transform:uppercase;letter-spacing:.03em;
  }
  .level-row{display:flex;align-items:center;gap:6px;}
  .level-label{
    font-size:10px;font-weight:700;color:var(--text-faint);width:16px;text-align:center;flex-shrink:0;
  }
  .level-bins{display:flex;gap:5px;}
  .bin{
    width:58px;height:38px;border-radius:6px;border:1px solid var(--border);display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-size:9.5px;font-weight:700;cursor:pointer;background:var(--gray-bg);color:var(--gray);
    text-align:center;line-height:1.25;padding:2px;flex-shrink:0;
  }
  .bin.occupied{background:var(--accent-bg);color:var(--accent-dark);border-color:#c3d0fb;}
  .bin.pending{background:var(--amber-bg);color:var(--amber);border-color:#f2dfa3;}
  .bin.empty-outside{background:#fdf3e4;border:1px dashed #d9b876;color:#8a6a2c;}
  .bin.occupied.outside{background:#f7deb0;color:#7a5200;border-color:#e3bd76;}
  .bin:hover{filter:brightness(0.96);transform:translateY(-1px);}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--text-muted);margin-top:10px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend .sw{width:11px;height:11px;border-radius:3px;display:inline-block;}

  /* ---------- Floor plan grid (top-down spatial map) ---------- */
  .floor-grid{display:grid;gap:3px;margin:10px 0 14px;overflow-x:auto;user-select:none;}
  .floor-grid .floor-cell{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:5px;border:1px solid var(--border);cursor:pointer;line-height:1.1;
  }
  .floor-grid.edit-mode .floor-cell{width:34px;height:34px;font-size:10px;font-weight:700;background:#fff;color:var(--text-faint);}
  .floor-grid.edit-mode .floor-cell.painted.inside{background:var(--accent-bg);border-color:#c3d0fb;color:var(--accent-dark);}
  .floor-grid.edit-mode .floor-cell.painted.outside{background:#f7deb0;border-color:#e3bd76;color:#7a5200;}
  .floor-grid.edit-mode .floor-cell:hover{filter:brightness(0.95);}
  .floor-grid.view-mode .floor-cell{width:42px;height:42px;font-size:9.5px;background:var(--gray-bg);color:var(--gray);}
  .floor-grid.view-mode .floor-cell.floor-outside{background:#fdf3e4;border:1px dashed #d9b876;color:#8a6a2c;}
  .floor-grid.view-mode .floor-cell.floor-inside.partial{background:var(--amber-bg);border-color:#f2dfa3;color:var(--amber);}
  .floor-grid.view-mode .floor-cell.floor-inside.full{background:var(--accent-bg);border-color:#c3d0fb;color:var(--accent-dark);}
  .floor-grid.view-mode .floor-cell.floor-outside.partial{background:#f5e6bd;color:#8a6a2c;}
  .floor-grid.view-mode .floor-cell.floor-outside.full{background:#f7deb0;color:#7a5200;}
  .floor-grid.view-mode .floor-cell:hover{filter:brightness(0.96);transform:translateY(-1px);}
  .floor-grid .fc-aisle{font-weight:700;}
  .floor-grid .fc-label{font-size:8.5px;opacity:.85;}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(16,24,40,0.45);display:flex;align-items:center;justify-content:center;
    z-index:200;padding:20px;
  }
  .modal{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(16,24,40,0.3);}
  .modal .modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .modal .modal-head h3{margin:0;font-size:16px;}
  .modal .modal-body{padding:18px 20px;}
  .modal .modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
  .close-x{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-muted);padding:2px 6px;}

  .empty-state{text-align:center;padding:36px 20px;color:var(--text-muted);}
  .empty-state .ic{font-size:30px;margin-bottom:8px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1d23;color:#fff;
    padding:11px 18px;border-radius:9px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,0.25);z-index:300;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .search-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .search-bar input,.search-bar select{width:auto;min-width:160px;}
  .search-bar input{flex:1;min-width:200px;}

  .muted{color:var(--text-muted);}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  .link-btn{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:13px;}
  .stat-mini{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;}
  .stat-mini div{font-size:12.5px;color:var(--text-muted);}
  .stat-mini b{color:var(--text);}

  footer.foot{padding:18px 22px;text-align:center;color:var(--text-faint);font-size:11.5px;}

  /* ---------- Pallet label / BOL print preview ---------- */
  /* #printArea doubles as (1) an offscreen scratch buffer used briefly to render a barcode's SVG
     markup via JsBarcode, and (2) — once populated by showPrintPreview() — a full-screen on-page
     preview the person prints with their browser's own Print command (Ctrl/Cmd+P). We deliberately
     do NOT rely on window.open()/window.print() to drive this automatically: this app usually runs
     inside a sandboxed iframe (e.g. published as a Claude Artifact), and that sandbox can block
     popups and script-triggered print dialogs outright — a restriction no "allow pop-ups" browser
     setting can override, since the block happens at the iframe level, not the browser's own popup
     blocker. Showing the document on-page and letting the person's browser handle printing natively
     sidesteps that entirely. */
  #printArea{display:none;position:fixed;inset:0;background:#f4f3ee;z-index:9999;overflow:auto;}
  .print-preview-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#141413;color:#fff;padding:10px 16px;font-size:12.5px;}
  .print-preview-bar button{background:#fff;color:#141413;border:none;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;}
  .print-preview-doc{padding:28px 16px;display:flex;justify-content:center;}
  .label-sheet{
    width:4in;padding:0.2in;border:1px solid #000;box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .label-co{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-align:center;margin-bottom:4px;}
  .label-sheet svg{display:block;width:100%;height:auto;}
  .label-id{text-align:center;font-size:20px;font-weight:800;letter-spacing:.03em;margin:2px 0 8px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  .label-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:11px;border-top:1px solid #000;padding-top:6px;}
  .label-grid div{display:flex;flex-direction:column;}
  .label-grid span{font-size:8.5px;text-transform:uppercase;letter-spacing:.03em;color:#555;}
  .label-grid b{font-size:12px;}

  /* ---------- Bill of Lading (print) ---------- */
  .bol-sheet{
    width:7.5in;padding:0.35in;border:1px solid #000;box-sizing:border-box;color:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .bol-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px;}
  .bol-title{font-size:19px;font-weight:800;letter-spacing:.03em;}
  .bol-sub{font-size:11.5px;color:#333;margin-top:2px;}
  .bol-num{text-align:right;}
  .bol-num .k{font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:#555;}
  .bol-num .v{font-size:16px;font-weight:800;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  .bol-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;}
  .bol-box{border:1px solid #000;padding:8px 10px;}
  .bol-box-label{font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:#555;margin-bottom:3px;}
  .bol-box-name{font-size:13.5px;font-weight:700;}
  .bol-box-sub{font-size:11px;color:#333;margin-top:1px;}
  .bol-fields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 12px;border-top:1px solid #000;border-bottom:1px solid #000;padding:8px 0;margin-bottom:10px;}
  .bol-fields div{display:flex;flex-direction:column;}
  .bol-fields span{font-size:8.5px;text-transform:uppercase;letter-spacing:.03em;color:#555;}
  .bol-fields b{font-size:12px;}
  .bol-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:10px;}
  .bol-table th,.bol-table td{border:1px solid #000;padding:4px 8px;text-align:left;}
  .bol-table th{background:#eee;font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;}
  .bol-table tfoot td{border-top:2px solid #000;background:#f7f7f5;}
  .bol-notes{font-size:11.5px;margin-bottom:14px;}
  .bol-notes span{font-weight:700;text-transform:uppercase;font-size:9px;letter-spacing:.03em;color:#555;margin-right:6px;}
  .bol-sign-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:20px;}
  .bol-sign .line{border-bottom:1px solid #000;height:28px;}
  .bol-sign .cap{font-size:9px;text-transform:uppercase;letter-spacing:.03em;color:#555;margin-top:3px;}
  .bol-hazmat{border:2px solid #b91c1c;background:#fef2f2;padding:8px 10px;font-size:11px;font-weight:600;margin-bottom:10px;color:#7f1d1d;line-height:1.4;}
  .bol-hazmat .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.03em;font-weight:800;display:block;margin-bottom:3px;}
  .bol-cert{font-size:9.5px;color:#333;line-height:1.4;border-top:1px solid #000;padding-top:8px;margin-top:2px;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block;position:absolute;top:0;left:0;background:#fff;}
    .print-preview-bar{display:none;}
  }
</style>
</head>

<script>
/* =========================================================================
   Phoenix Cross Dock WMS — single-file prototype
   In-memory data model only (no backend). Built to demonstrate workflows:
   customers, inventory, warehouse locations, receive/move/ship scanning,
   billing/invoicing, and a customer request portal.
   ========================================================================= */

/* ---------------------------- Utilities ---------------------------- */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
function uid(prefix){ return prefix + Math.random().toString(36).slice(2,8).toUpperCase(); }
function fmtMoney(n){ return '$' + (Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d){ if(!d) return '—'; const dt = (d instanceof Date)?d:new Date(d); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, n){ const d = new Date(dateStr); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysInMonth(period){ const [y,m] = period.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function clampOverlapDays(startA, endA, startB, endB){
  const s = new Date(Math.max(new Date(startA), new Date(startB)));
  const e = new Date(Math.min(new Date(endA), new Date(endB)));
  const diff = Math.round((e-s)/86400000)+1;
  return Math.max(0, diff);
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Shows a printable document (pallet label or Bill of Lading) full-screen, on-page, and asks the
// person to use their own browser's Print command. We deliberately do NOT drive this via
// window.open()/window.print() — this app usually runs inside a sandboxed iframe (e.g. published
// as a Claude Artifact), and that sandbox can silently block popups and script-triggered print
// dialogs outright, a restriction the browser's own "allow pop-ups" site setting has no power
// over (the block happens at the iframe boundary, before the browser's popup blocker is even
// consulted). Rendering the document on-page sidesteps that: it always displays, and the person's
// own Ctrl/Cmd+P (or their browser's Print menu) handles the rest — the @media print rules above
// make sure only this document prints, not the rest of the app.
function showPrintPreview(title, innerHtml){
  const area = document.getElementById('printArea');
  area.innerHTML = `
    <div class="print-preview-bar">
      <span>🖨 ${escapeHtml(title)} — press <b>Ctrl+P</b> (Windows/Linux) or <b>⌘P</b> (Mac) to print or save as PDF</span>
      <button type="button" onclick="closePrintPreview()">Close</button>
    </div>
    <div class="print-preview-doc">${innerHtml}</div>
  `;
  area.style.display = 'block';
  // Best-effort only: works in environments that don't sandbox it away, does nothing harmful
  // (silently no-ops) where it's blocked — the on-page preview above is what actually guarantees
  // the document is visible and printable either way.
  setTimeout(()=>{ try{ window.print(); }catch(e){} }, 150);
}
function closePrintPreview(){
  const area = document.getElementById('printArea');
  area.style.display = 'none';
  area.innerHTML = '';
}

// Renders a printable pallet label (Code128 barcode + key fields) as an on-page print preview.
// Sized for a standard ~4" pallet/shipping label — works with a label printer or a regular
// printer + adhesive label sheet.
function printLabel(palletId){
  const p = palletById(palletId);
  if(!p){ toast('Pallet not found'); return; }
  const cust = customerById(p.customerId);
  const html = `
    <div class="label-sheet">
      <div class="label-co">${escapeHtml(currentCompany().name)}</div>
      <svg id="labelBarcodeSvg"></svg>
      <div class="label-id">${escapeHtml(p.id)}</div>
      <div class="label-grid">
        <div><span>Customer</span><b>${escapeHtml(cust ? cust.name : '—')}</b></div>
        <div><span>Location</span><b>${escapeHtml(palletLocationLabel(p) || 'Unassigned')}</b></div>
        <div><span>Description</span><b>${escapeHtml(p.sku)}</b></div>
        ${p.jobName ? `<div><span>Job</span><b>${escapeHtml(p.jobName)}</b></div>` : ''}
        <div><span>Qty</span><b>${p.qty} ${escapeHtml(p.uom)}</b></div>
        <div><span>Received</span><b>${fmtDate(p.receivedDate)}</b></div>
        <div><span>Storage</span><b>${p.locationCode ? storageTypeLabel(locationByCode(p.locationCode, p.warehouseId).type) : '—'}</b></div>
      </div>
    </div>
  `;
  // Show the preview first so #labelBarcodeSvg is actually in the live DOM, then render the
  // barcode into it — JsBarcode needs a real element to measure/draw into, not a string.
  showPrintPreview(`Pallet label — ${p.id}`, html);
  if(window.JsBarcode){
    try{ JsBarcode('#labelBarcodeSvg', p.id, { format:'CODE128', displayValue:false, height:60, margin:0 }); }
    catch(e){ /* barcode lib unavailable offline — label still prints with the readable ID */ }
  }
}

// Renders and prints a Bill of Lading document for a shipment, formatted after the standard
// Uniform Straight Bill of Lading used industry-wide so it holds up as real shipping paperwork —
// this is what covers ACD legally and gives the carrier something to sign even if they didn't
// bring their own. Works for either direction: inbound shipments list the customer as shipper
// (goods coming into the warehouse), outbound shipments list the warehouse as shipper (goods
// leaving for the customer). A BOL number is always assigned by createShipment(), so this never
// prints with a blank BOL # even if staff entered nothing else.
function printBOL(shipmentId){
  const s = shipmentById(shipmentId);
  if(!s){ toast('Shipment not found'); return; }
  const cust = customerById(s.customerId);
  const co = currentCompany();
  const wh = warehouseById(s.warehouseId);
  const pallets = s.palletIds.map(id=>palletById(id)).filter(Boolean);
  const isInbound = s.direction === 'Inbound';
  const whAddress = wh ? [wh.address, wh.city].filter(Boolean).join(', ') : '';
  const whParty = { name: co.name, sub: wh ? wh.name : '', address: whAddress };
  const custParty = { name: cust ? cust.name : '—', sub: cust && cust.contact ? cust.contact : '', address: s.bolAddress || '' };
  const shipper = isInbound ? custParty : whParty;
  const consignee = isInbound ? whParty : custParty;
  const freightTerms = s.freightTerms || 'Prepaid';
  const freightTermsNote = freightTerms === 'Collect'
    ? 'Freight charges are to be collected from the consignee.'
    : freightTerms === 'Third Party'
      ? `Freight charges are to be billed to the third party named below${s.billTo ? ' (' + escapeHtml(s.billTo) + ')' : ''}.`
      : 'Freight charges are prepaid by the shipper.';
  // Weight and pallet count live in the commodity table's totals row below (where a Bill of
  // Lading conventionally shows them, tied to the actual freight) rather than up here — keeping
  // this grid to fields that describe the MOVEMENT (who's hauling it, terms, dates) so it fills
  // its 4-column layout evenly instead of trailing off with one or two orphaned cells.
  const fieldItems = [
    ['Carrier', s.carrier || '—'],
    ['SCAC', s.scac || '—'],
    ['Driver', s.driverName || '—'],
    ['Truck / trailer #', s.truckNumber || '—'],
    ['PO / reference #', s.poNumber || '—'],
    ['Freight charge terms', freightTerms],
    ['Date', fmtDate(s.createdDate)],
    ['Type of load', s.equipment || '—'],
  ];
  if(freightTerms === 'Third Party' && s.billTo) fieldItems.push(['Bill freight charges to', s.billTo]);
  if(s.jobName) fieldItems.push(['Job name', s.jobName]);
  const hazmatBlock = s.hazmat ? `
    <div class="bol-hazmat">
      <span class="lbl">⚠ Hazardous materials — DOT regulated shipment</span>
      This shipment contains hazardous materials as defined by 49 CFR. 24-hour emergency contact (49 CFR 172.604): <u>${escapeHtml(s.hazmatPhone || 'NOT PROVIDED')}</u>. Vehicle must be placarded per 49 CFR Part 172, Subpart F before departure.
    </div>
  ` : '';
  const html = `
    <div class="bol-sheet">
      <div class="bol-head">
        <div>
          <div class="bol-title">BILL OF LADING</div>
          <div class="bol-sub">${escapeHtml(co.name)} · ${s.direction} shipment ${escapeHtml(s.id)}</div>
        </div>
        <div class="bol-num">
          <div class="k">BOL #</div>
          <div class="v">${escapeHtml(s.bolNumber || '—')}</div>
        </div>
      </div>
      <div class="bol-grid">
        <div class="bol-box">
          <div class="bol-box-label">Shipper / From</div>
          <div class="bol-box-name">${escapeHtml(shipper.name)}</div>
          ${shipper.sub ? `<div class="bol-box-sub">${escapeHtml(shipper.sub)}</div>` : ''}
          <div class="bol-box-sub">${shipper.address ? escapeHtml(shipper.address) : 'Address not on file'}</div>
        </div>
        <div class="bol-box">
          <div class="bol-box-label">Consignee / To</div>
          <div class="bol-box-name">${escapeHtml(consignee.name)}</div>
          ${consignee.sub ? `<div class="bol-box-sub">${escapeHtml(consignee.sub)}</div>` : ''}
          <div class="bol-box-sub">${consignee.address ? escapeHtml(consignee.address) : 'Address not on file'}</div>
        </div>
      </div>
      <div class="bol-fields">
        ${fieldItems.map(([k,v])=>`<div><span>${escapeHtml(k)}</span><b>${escapeHtml(v)}</b></div>`).join('')}
      </div>
      ${hazmatBlock}
      ${(()=>{
        // Per-pallet weight is only known when it was recorded at receiving (#recvWeight). Most
        // shipments instead only ever get ONE weight figure — entered on the shipment itself when
        // it goes out — which used to show only as a shipment-level stat, leaving every line item
        // blank even though a real weight exists. Now: a pallet's own recorded weight wins where
        // we have it; the shipment's weight (minus whatever's already accounted for) is split
        // evenly across the remaining pallets so every line shows a number, marked with * to be
        // upfront that it's a split rather than an individually measured weight.
        const knownWeightSum = pallets.reduce((sum,p)=>sum+(p.weightLbs||0),0);
        const unweighed = pallets.filter(p=>!p.weightLbs);
        const remaining = s.weightLbs!=null ? Math.max(0, s.weightLbs - knownWeightSum) : null;
        const splitWeight = (remaining!=null && unweighed.length) ? Math.round(remaining/unweighed.length) : null;
        let anySplit = false;
        const rows = pallets.map(p=>{
          const rowWeight = p.weightLbs || splitWeight;
          let weightCell = '—';
          if(rowWeight){
            const isSplit = !p.weightLbs && splitWeight;
            if(isSplit) anySplit = true;
            weightCell = `${rowWeight} lbs${isSplit ? '*' : ''}`;
          }
          return `<tr><td>${escapeHtml(p.id)}</td><td>${escapeHtml(p.sku)}</td><td>${p.qty} ${escapeHtml(p.uom)}</td><td>${weightCell}</td><td>${s.freightClass ? 'Class '+escapeHtml(s.freightClass) : '—'}</td><td>${s.hazmat?'X':'—'}</td></tr>`;
        }).join('') || `<tr><td colspan="6">No pallets attached</td></tr>`;
        return `
      <table class="bol-table">
        <thead><tr><th>Pallet</th><th>Description</th><th>Qty</th><th>Weight</th><th>Class</th><th>HM</th></tr></thead>
        <tbody>
          ${rows}
        </tbody>
        <tfoot>
          <tr>
            <td colspan="2"><b>Total — ${pallets.length} pallet${pallets.length===1?'':'s'}</b></td>
            <td>${pallets.reduce((sum,p)=>sum+(p.qty||0),0)}</td>
            <td>${s.weightLbs ? s.weightLbs+' lbs' : '—'}</td>
            <td>${s.freightClass ? 'Class '+escapeHtml(s.freightClass) : '—'}</td>
            <td>${s.hazmat?'X':'—'}</td>
          </tr>
        </tfoot>
      </table>
      ${anySplit ? `<div class="muted" style="font-size:10px;margin:-6px 0 10px;">* Weight split evenly across pallets without an individually recorded weight — shipment total above reflects the entered/measured figure.</div>` : ''}
        `;
      })()}
      ${s.bolNotes ? `<div class="bol-notes"><span>Notes</span>${escapeHtml(s.bolNotes)}</div>` : ''}
      <div class="bol-cert">
        <b>Shipper certification:</b> This is to certify that the above-named materials are properly classified, described, packaged, marked and labeled, and are in proper condition for transportation according to the applicable regulations of the U.S. Department of Transportation. ${freightTermsNote}
      </div>
      <div class="bol-sign-row">
        <div class="bol-sign"><div class="line"></div><div class="cap">Shipper signature / date</div></div>
        <div class="bol-sign"><div class="line"></div><div class="cap">Carrier signature / date</div></div>
        <div class="bol-sign"><div class="line"></div><div class="cap">Consignee signature / date</div></div>
      </div>
    </div>
  `;
  showPrintPreview(`Bill of Lading — ${s.bolNumber || s.id}`, html);
}

/* ---------------------------- Seed data ---------------------------- */
let state = null;

/* ---------------------------- Persistence (Artifact db capability) ---------------------------- */
// This app used to be purely in-memory (reseeded from scratch on every page load). It now
// persists its actual working data — companies, customers, warehouses, pallets, billing, etc. —
// to the artifact's built-in database, when that capability is available in the current view.
// If it's not available (older cached view, capability failed to load, etc.) the app quietly
// falls back to the original in-memory-only behavior rather than breaking.
let dbNS = null;           // resolved `db` capability namespace, or null if unavailable
let dbLoadAttempted = false; // true once we've tried (successfully or not) to load persisted state
let persistTimer = null;
let suppressPersist = false; // true while we're applying a just-loaded snapshot, to avoid an immediate redundant write
const PERSISTED_KEYS = ['companies','warehouses','customers','locations','pallets','movements','requests','invoices','accessorials','lpns','shipments','currentCompanyId','currentWarehouseId','view','viewArg','mode','portalCustomerId'];

function snapshotForPersist(){
  const out = {};
  PERSISTED_KEYS.forEach(k=>{ if(state[k] !== undefined) out[k] = state[k]; });
  return out;
}
// Debounced so a burst of edits (typing in a field, several quick clicks) collapses into one
// write instead of one per keystroke/click.
function persistState(){
  if(!dbNS || suppressPersist) return;
  if(persistTimer) clearTimeout(persistTimer);
  persistTimer = setTimeout(()=>{
    persistTimer = null;
    dbNS.doc('app/state').set(snapshotForPersist()).catch(()=>{ /* best-effort; a transient failure just means this write is skipped, not that the app breaks */ });
  }, 800);
}
// Writes immediately (no debounce) — used right after a deliberate, one-off action like
// "Reset demo data" where the user should see the reset take effect right away.
function persistNow(){
  if(!dbNS) return;
  if(persistTimer){ clearTimeout(persistTimer); persistTimer = null; }
  dbNS.doc('app/state').set(snapshotForPersist()).catch(()=>{});
}
async function initPersistence(){
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      dbNS = await window.claude.use('db');
    } else {
      dbNS = null;
    }
  } catch(e){ dbNS = null; }
  if(!dbNS){ dbLoadAttempted = true; render(); return; }
  try{
    const snap = await dbNS.doc('app/state').get();
    if(snap.exists && snap.data() && Array.isArray(snap.data().companies) && snap.data().companies.length){
      // The platform delivers db documents (and everything nested inside them) FROZEN — see the
      // db capability's own docs: "Delivered snapshots and their data() are frozen ... clone a
      // body before editing it." We assign this data straight onto `state` and then mutate it
      // constantly (pushing new customers/pallets/shipments, patching fee schedules, etc.), so
      // loading it as-is left every array/object that came from a previous save permanently
      // frozen — array pushes threw silently-swallowed exceptions and plain field writes just
      // no-opped. That's what made every "create something and move on" action across the whole
      // app (add customer, receive, ship, ...) look like it simply did nothing once real data had
      // round-tripped through the db even once. Deep-cloning here breaks that link so everything
      // loaded from storage is ordinary, mutable, plain-JS data from this point on.
      const saved = JSON.parse(JSON.stringify(snap.data()));
      suppressPersist = true;
      PERSISTED_KEYS.forEach(k=>{ if(saved[k] !== undefined) state[k] = saved[k]; });
      // Guard against a saved pointer (warehouse/company) that no longer exists in case the
      // seed data itself ever changes shape — fall back to sane defaults rather than crash.
      if(!state.companies.find(c=>c.id===state.currentCompanyId)) state.currentCompanyId = state.companies[0].id;
      if(!state.warehouses.find(w=>w.id===state.currentWarehouseId)){
        const firstWh = state.warehouses.find(w=>w.companyId===state.currentCompanyId);
        state.currentWarehouseId = firstWh ? firstWh.id : null;
      }
      if(!state.customers.find(c=>c.id===state.portalCustomerId)){
        const firstCust = state.customers.find(c=>c.companyId===state.currentCompanyId);
        state.portalCustomerId = firstCust ? firstCust.id : null;
      }
      suppressPersist = false;
    } else {
      // Nothing saved yet — persist the freshly seeded data as the starting point so there's
      // a baseline document to read (and merge into) on the next load.
      persistNow();
    }
  } catch(e){ /* best-effort — keep working from the in-memory seed */ }
  dbLoadAttempted = true;
  render();
}

/* ---------------------------- Warehouse layout ---------------------------- */
// The floor plan for a warehouse is configurable from the Locations tab ("Edit floor plan").
// A warehouse is made of zones (lettered A-Z, e.g. "A", "B", optionally suffixed with a
// number for more than 26 zones — "A1", "A2"). Each zone is a storage type (inside/outside —
// this drives storage billing rates) and either floor storage (one location per painted tile)
// or racking (multiple stacked levels per tile). Location codes are simply "Zone-Number",
// e.g. "A-12" = Zone A, Location 12 — easy to say over a radio and easy to find on the map.
// Codes only need to be unique WITHIN a warehouse — two different warehouses (even under the
// same company) freely reuse the same zone letters, same as real buildings do.

// 1-indexed letter code: 1->A, 26->Z, 27->AA (spreadsheet-column style, for bay/aisle codes).
function letterFromIndex(n){
  let s = '';
  while(n > 0){
    const rem = (n-1) % 26;
    s = String.fromCharCode(65+rem) + s;
    n = Math.floor((n-1)/26);
  }
  return s;
}

// Legacy flat-array layout generator — still used to seed demo data. Assigns each aisle its
// own row and lays its bays out left-to-right, so the spatial floor-plan view and the
// Warehouse Setup grid editor have a sensible starting arrangement even before anyone has
// used the visual painter. Codes are simple "Zone-Number" (e.g. "A-7"), numbered in reading
// order across that aisle's bays/levels/spots.
function generateLocations(layout){
  const locations = [];
  layout.forEach((a, aIdx)=>{
    let n = 0;
    for(let bayNum=1; bayNum<=a.bays; bayNum++){
      for(let lvl=1; lvl<=a.levels; lvl++){
        for(let sp=1; sp<=a.spots; sp++){
          n++;
          const code = `${a.code}-${n}`;
          locations.push({ code, aisle:a.code, type:a.type, level:lvl, spot:sp, locNum:n, palletId:null, row:aIdx, col:bayNum-1 });
        }
      }
    }
  });
  return locations;
}

// Converts a 0-indexed number into spreadsheet-style letters (0->A, 1->B, ..., 25->Z,
// 26->AA, ...) — used to letter racks and spots within a zone.
function toLetters(n){
  let s = '', num = n + 1;
  while(num > 0){
    const rem = (num - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    num = Math.floor((num - 1) / 26);
  }
  return s;
}

// Strips a trailing run of digits off a zone code to get its rack letter, e.g. "W6"->"W",
// "C7"->"C", "A"->"A". Every zone that shares a rack letter (e.g. the wall zones for bay 6
// and bay 7, both "W6"/"W7") is lettered as one continuous run of tile positions rather than
// each zone restarting at "A" — so the rack letter alone tells you what you're looking at
// (the wall, the center) while the section letter still picks out one unique physical tile
// warehouse-wide.
function zoneRack(code){
  const m = /^(.*?)(\d+)$/.exec(code);
  return m ? m[1] : code;
}

// Builds locations from the visual grid painter's zones — each zone is a set of painted
// (row,col) tiles, and each tile holds `spots` pallets side by side per level (a standard
// rack bay normally opens for 2). Codes read as "RackSectionLevelSpot", e.g. "WA1A" = the
// Wall rack, section A (the first tile position walking down the aisle), level 1, spot A (the
// first of that tile's side-by-side pallets); the next tile over is section B ("WB1A"/"WB1B"),
// and so on A-through-Z then AA, AB... if the aisle runs past 26 tiles. Climbing a level
// changes only the number — the same physical tile is "WA1A" on level 1 and "WA2A" on level
// 2 — while walking the aisle changes only the section letter, and the trailing spot letter
// (A or B) only ever distinguishes the tile's own side-by-side pallets. Every zone that shares
// a rack letter (e.g. the wall zones for bay 6 and bay 7, "W6"/"W7") is one continuous aisle
// for this purpose, so bay 7's lettering picks up right where bay 6's left off.
// Seed-data helpers for a "perimeter first, center as overflow" bay layout — used for
// warehouses where the plan is to rack the walls first and only build out the middle of the
// floor if space is needed beyond that. `rowOffset` is the top row of a 3-row-tall bay within
// the shared warehouse grid; `cols` is that bay's width in tiles. Cells are listed walking the
// ring clockwise starting at the top-left corner (top row left-to-right, down the right side,
// bottom row right-to-left, up the left side) so that, paired with `walkOrder` on the zone,
// section lettering reads WA, WB, WC... continuously around the wall instead of jumping
// between rows.
function perimeterZoneCells(rowOffset, cols){
  const cells = [];
  for(let c=0;c<cols;c++) cells.push({row:rowOffset, col:c});
  cells.push({row:rowOffset+1, col:cols-1});
  for(let c=cols-1;c>=0;c--) cells.push({row:rowOffset+2, col:c});
  cells.push({row:rowOffset+1, col:0});
  return cells;
}
function centerZoneCells(rowOffset, cols){
  const cells = [];
  for(let c=1;c<cols-1;c++) cells.push({row:rowOffset+1, col:c});
  return cells;
}

function generateLocationsFromZones(zones){
  const locations = [];
  const racks = new Map(); // rack letter -> zones sharing it, in original order
  zones.forEach(zone=>{
    const rack = zoneRack(zone.code);
    if(!racks.has(rack)) racks.set(rack, []);
    racks.get(rack).push(zone);
  });
  racks.forEach((zoneGroup, rack)=>{
    let tileIdx = 0; // running count of physical tile positions across every zone in this rack
    zoneGroup.forEach(zone=>{
      const levels = zone.floorOnly ? 1 : (parseInt(zone.levels)||1);
      const spots = parseInt(zone.spots)||1;
      // A zone marked `walkOrder` already lists its cells in the order they should be
      // lettered (e.g. a ring walked clockwise around a wall) — sorting by row/col would
      // scramble that back into raster order. Everything else (freehand-painted zones) sorts
      // top-to-bottom, left-to-right so lettering is predictable no matter the click order.
      const orderedCells = zone.walkOrder ? zone.cells.slice() : zone.cells.slice().sort((a,b)=> a.row-b.row || a.col-b.col);
      orderedCells.forEach(cell=>{
        const section = toLetters(tileIdx);
        tileIdx++;
        for(let lvl=1; lvl<=levels; lvl++){
          for(let sp=1; sp<=spots; sp++){
            const spotLetter = toLetters(sp-1);
            const code = `${rack}${section}${lvl}${spotLetter}`;
            locations.push({ code, aisle:zone.code, rack, section, type:zone.type, level:lvl, spot:sp, spotLetter, locNum:tileIdx, palletId:null, row:cell.row, col:cell.col });
          }
        }
      });
    });
  });
  return locations;
}

// Converts a legacy flat-array warehouse layout (pre-visual-editor) into the grid+zones
// format, using the same row-per-aisle/col-per-bay arrangement generateLocations() uses —
// so opening the visual editor for a never-yet-edited warehouse matches its existing bins.
function migrateLegacyLayoutToGrid(layoutConfig){
  const rows = Math.max(1, layoutConfig.length);
  const cols = Math.max(1, ...layoutConfig.map(a=>parseInt(a.bays)||1));
  const zones = layoutConfig.map((a, ri)=>{
    const bays = parseInt(a.bays)||1;
    const cells = [];
    for(let c=0;c<bays;c++) cells.push({ row:ri, col:c });
    const levels = parseInt(a.levels)||1;
    return { code:a.code, type:a.type, floorOnly: levels<=1, levels, spots: parseInt(a.spots)||1, cells };
  });
  return { rows, cols, zones };
}

function shuffleArr(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }

/* ---------------------------- Multi-tenant seed data ---------------------------- */
// This prototype simulates the "shared database, tenant-isolated by ID" multi-tenancy
// pattern: one app instance, every record (customers, warehouses, locations, pallets,
// movements, invoices, requests, LPNs) is tagged with companyId, and the UI only ever
// reads/writes data for state.currentCompanyId. Two demo companies are seeded so you can
// switch the "Viewing" selector in the header and see the isolation live — Company B's
// data is never visible while Company A is selected, and vice versa.
// Within a company, a warehouseId further scopes locations/inventory to one physical site
// (this client has 4 — Phoenix Central/North, Tempe, Chandler).

// Builds one company's full dataset (customers, warehouses, locations, pallets, history).
function buildCompanyData(companyId, customerDefs, warehouseDefs, palletSeqStart){
  const customers = customerDefs.map((c,i)=>({
    id: `${companyId}-CUST-${i+1}`, companyId,
    name:c[0], contact:c[1], email:c[2], phone:c[3],
    rateInside:c[4], rateOutside:c[5], unloadFee:c[6], loadFee:c[7], address: c[8] || null,
    shipmentOffloadFee: 75, shipmentReloadFee: 75,
    // First customer in each company gets the transportation add-on turned on, for demo purposes.
    transportEnabled: i===0, transportInboundFee: 150, transportOutboundFee: 150,
    // billingMethod left unset (defaults to per-pallet display/logic everywhere) — 'sqft',
    // 'contract' (fixed monthly fee for a reserved sqft commitment, see contractSqft/contractFee
    // — a contract is a company-wide space commitment, not tied to one warehouse, since pallets
    // of varying sizes aren't pinned to a specific site in advance), and 'crossdock' (bills off
    // the company fee schedule) are opted into from Add/Edit customer.
    contractSqft: c[0]==='SBA Communications' ? 2500 : 0,
    contractFee: 0, // TODO: SBA's actual monthly contract rate hasn't been provided yet — update from Edit customer.
    billingMethod: c[0]==='SBA Communications' ? 'contract' : undefined,
    since: addDays(todayISO(), -(180 + i*37))
  }));

  const warehouses = warehouseDefs.map(w=>({
    id:w.id, companyId, name:w.name, city:w.city, address:w.address||null, sqft:w.sqft||null,
    grid: w.grid || null, storageMode: w.storageMode || 'mixed',
    layoutConfig: w.layout.map(z=>({...z}))
  }));

  let locations = [];
  warehouses.forEach(w=>{
    // Zones painted with explicit tiles (the visual grid format, e.g. a perimeter/center
    // layout) carry a `cells` array; older flat aisle/bay definitions don't and use the
    // legacy row-per-aisle generator instead.
    const isGridFormat = w.layoutConfig.length && !!w.layoutConfig[0].cells;
    const locs = isGridFormat ? generateLocationsFromZones(w.layoutConfig) : generateLocations(w.layoutConfig);
    locs.forEach(l=>{ locations.push({ ...l, companyId, warehouseId:w.id }); });
  });

  const freeLocsByWh = {};
  warehouses.forEach(w=>{
    let locs = shuffleArr(locations.filter(l=>l.warehouseId===w.id));
    if(locs.some(l=>l.rack==='W') && locs.some(l=>l.rack==='C')){
      // Any warehouse built with a Wall rack + a Center rack fills the wall first (it's the
      // primary, eventually-racked storage) and treats the center as overflow-only, used once
      // the wall is full. freeLocs are consumed via .pop(), so the rack that should fill first
      // needs to end up at the array's tail.
      locs = locs.sort((a,b)=> (a.rack==='C'?0:1) - (b.rack==='C'?0:1));
    }
    freeLocsByWh[w.id] = locs;
  });

  const pallets = [], movements = [], accessorials = [];
  let palletSeq = palletSeqStart;

  customers.forEach((cust, ci)=>{
    const count = 6 + (ci%3)*3; // varied pallet counts per customer
    for(let i=0;i<count;i++){
      const wh = warehouses[(ci+i) % warehouses.length]; // spread across this company's warehouses
      const freeLocs = freeLocsByWh[wh.id];
      const id = 'PLT-' + (palletSeq++);
      const sku = SKUS[(ci+i)%SKUS.length];
      const receivedDaysAgo = 3 + Math.floor(Math.random()*70);
      const receivedDate = addDays(todayISO(), -receivedDaysAgo);
      let status = 'in_storage';
      let locationCode = null;
      let shippedDate = null;

      const roll = Math.random();
      if(roll < 0.08 && freeLocs.length){ status = 'pending_putaway'; }
      else if(roll < 0.14){ status = 'pending_pickup'; }
      else if(freeLocs.length){
        const loc = freeLocs.pop();
        loc.palletId = id;
        locationCode = loc.code;
      } else {
        status = 'pending_putaway';
      }

      const pallet = {
        id, companyId, warehouseId: wh.id, customerId: cust.id, sku: sku[0], uom: sku[1],
        qty: 20 + Math.floor(Math.random()*180),
        receivedDate, status, locationCode, shippedDate,
        lpnId: null, notes: ''
      };
      pallets.push(pallet);
      movements.push({ id: uid('MV-'), companyId, palletId:id, type:'Receive', ts: receivedDate+'T09:00:00', from:null, to: locationCode||'Dock', user:'system-seed' });
      accessorials.push({ id: uid('ACC-'), companyId, customerId: cust.id, palletId:id, type:'Unload', amount: cust.unloadFee, date: receivedDate, invoiceId:null });
      if(locationCode){
        movements.push({ id: uid('MV-'), companyId, palletId:id, type:'Putaway', ts: receivedDate+'T09:20:00', from:'Dock', to: locationCode, user:'system-seed' });
      }
    }
  });

  // A few already-shipped pallets for history/billing realism
  const shippedCount = Math.min(5, customers.length*2);
  for(let i=0;i<shippedCount;i++){
    const cust = customers[i % customers.length];
    const wh = warehouses[i % warehouses.length];
    const id = 'PLT-' + (palletSeq++);
    const receivedDate = addDays(todayISO(), -(50+i*4));
    const shippedDate = addDays(receivedDate, 12+i*3);
    pallets.push({
      id, companyId, warehouseId: wh.id, customerId: cust.id, sku:'Master carton', uom:'ea', qty: 60,
      receivedDate, status:'shipped', locationCode:null, shippedDate, lpnId: null, notes:''
    });
    movements.push({ id: uid('MV-'), companyId, palletId:id, type:'Receive', ts: receivedDate+'T10:00:00', from:null, to:'Dock', user:'system-seed' });
    accessorials.push({ id: uid('ACC-'), companyId, customerId: cust.id, palletId:id, type:'Unload', amount: cust.unloadFee, date: receivedDate, invoiceId:null });
    movements.push({ id: uid('MV-'), companyId, palletId:id, type:'Ship', ts: shippedDate+'T14:00:00', from:'—', to:'Outbound', user:'system-seed' });
    accessorials.push({ id: uid('ACC-'), companyId, customerId: cust.id, palletId:id, type:'Load', amount: cust.loadFee, date: shippedDate, invoiceId:null });
  }

  const requests = [];
  const c0 = customers[0], c2 = customers[Math.min(2,customers.length-1)], c4 = customers[Math.min(4,customers.length-1)], c1 = customers[Math.min(1,customers.length-1)], c3 = customers[Math.min(3,customers.length-1)];
  const c2OutboundPallet = pallets.find(p=>p.customerId===c2?.id && p.status==='in_storage');
  const c4OutboundPallet = pallets.find(p=>p.customerId===c4?.id && p.status==='in_storage');
  if(c0) requests.push({ id: uid('REQ-'), companyId, customerId: c0.id, type:'Inbound', ref:'Case pack 24ct, ETA this week', qty:2, notes:'Delivery via Swift Freight, dock appt needed.', jobName:null, palletSizeType:'standard', palletCount:2, dimLength:48, dimWidth:48, sqft:calcSqft(48,48), receivedPalletIds:[], palletId:null, linkedPalletId:null, status:'Pending', dateRequested: addDays(todayISO(),-1) });
  if(c1) requests.push({ id: uid('REQ-'), companyId, customerId: c1.id, type:'Inbound', ref:'Retail display kit, ETA tomorrow AM', qty:1, notes:'Curbside, no dock needed.', jobName:'Fall reset - Store 214', palletSizeType:'nonstandard', palletCount:1, dimLength:48, dimWidth:40, sqft:calcSqft(48,40), receivedPalletIds:[], palletId:null, linkedPalletId:null, status:'Approved', dateRequested: addDays(todayISO(),-1) });
  if(c3) requests.push({ id: uid('REQ-'), companyId, customerId: c3.id, type:'Inbound', ref:'Retail fixtures, one truckload', qty:1, notes:'Appointment set for Monday 8am, ask for dock 3.', jobName:'Q3 store refresh', palletSizeType:'standard', palletCount:3, dimLength:48, dimWidth:48, sqft:calcSqft(48,48), receivedPalletIds:[], palletId:null, linkedPalletId:null, status:'Approved', dateRequested: addDays(todayISO(),-2) });
  if(c2) requests.push({ id: uid('REQ-'), companyId, customerId: c2.id, type:'Outbound', ref:'', qty:1, notes:'Will call/pickup Friday morning.', dimLength:null, dimWidth:null, sqft:null, receivedPalletIds:[], palletId: c2OutboundPallet?.id || null, linkedPalletId:null, status:'Pending', dateRequested: addDays(todayISO(),-2) });
  if(c4) requests.push({ id: uid('REQ-'), companyId, customerId: c4.id, type:'Outbound', ref:'', qty:1, notes:'Ship via customer\'s LTL account #883-21.', dimLength:null, dimWidth:null, sqft:null, receivedPalletIds:[], palletId: c4OutboundPallet?.id || null, linkedPalletId:null, status:'Approved', dateRequested: addDays(todayISO(),-4) });
  if(c1) requests.push({ id: uid('REQ-'), companyId, customerId: c1.id, type:'Inbound', ref:'Drum 55gal, hazmat placard attached', qty:1, notes:'', palletSizeType:'standard', palletCount:1, dimLength:48, dimWidth:48, sqft:calcSqft(48,48), receivedPalletIds:[], palletId:null, linkedPalletId:null, status:'Completed', dateRequested: addDays(todayISO(),-9) });

  return { customers, warehouses, locations, pallets, movements, accessorials, requests, palletSeqEnd: palletSeq };
}

  COMPANY_DEFS.forEach(def=>{
    companies.push({ id: def.id, name: def.name, city: def.city, feeSchedule: def.feeSchedule ? {...def.feeSchedule} : null });
    const data = buildCompanyData(def.id, def.customers, def.warehouses, palletSeq);

  return {

    currentCompanyId: companies[0].id,

}

/* ---------------------------- Derived helpers ---------------------------- */
// Every lookup below is scoped to state.currentCompanyId (and, for locations, usually
// state.currentWarehouseId too) — this is the tenant-isolation boundary: no matter what
// view is rendering, these helpers can only ever see the active company's own data.
function currentCompany(){ return state.companies.find(c=>c.id===state.currentCompanyId); }
function currentWarehouse(){ return state.warehouses.find(w=>w.id===state.currentWarehouseId); }
function companyCustomers(){ return state.customers.filter(c=>c.companyId===state.currentCompanyId); }
function companyPallets(){ return state.pallets.filter(p=>p.companyId===state.currentCompanyId); }
function companyWarehouses(){ return state.warehouses.filter(w=>w.companyId===state.currentCompanyId); }
function companyLocations(){ return state.locations.filter(l=>l.companyId===state.currentCompanyId); }
function companyMovements(){ return state.movements.filter(m=>m.companyId===state.currentCompanyId); }
function companyAccessorials(){ return state.accessorials.filter(a=>a.companyId===state.currentCompanyId); }
function companyInvoices(){ return state.invoices.filter(i=>i.companyId===state.currentCompanyId); }
function companyRequests(){ return state.requests.filter(r=>r.companyId===state.currentCompanyId); }
function companyLpns(){ return state.lpns.filter(l=>l.companyId===state.currentCompanyId); }
function companyShipments(){ return state.shipments.filter(s=>s.companyId===state.currentCompanyId); }
function warehouseById(id){ return state.warehouses.find(w=>w.id===id && w.companyId===state.currentCompanyId); }
// Locations only need to be unique within one warehouse, so lookups take an explicit
// warehouseId when known (e.g. a specific pallet's own warehouse); otherwise they default
// to whichever warehouse is currently selected in the header.
function locationsForWarehouse(warehouseId){
  const wid = warehouseId || state.currentWarehouseId;
  return state.locations.filter(l=>l.companyId===state.currentCompanyId && l.warehouseId===wid);
}

function customerById(id){ return companyCustomers().find(c=>c.id===id); }
// The first time staff type a real address on a BOL for a customer who doesn't have one on file
// yet, remember it on the customer record — so every later shipment to/from that same customer
// defaults to it automatically instead of starting from a blank field again. Never overwrites an
// address staff already saved (or already edited) on the customer — that stays the source of
// truth; this only fills the gap the first time.
function learnCustomerAddress(customerId, address){
  const trimmed = (address || '').trim();
  if(!trimmed) return;
  const c = customerById(customerId);
  if(c && !c.address) c.address = trimmed;
}
function palletById(id){ return companyPallets().find(p=>p.id===id); }
function locationByCode(code, warehouseId){ return locationsForWarehouse(warehouseId).find(l=>l.code===code); }
function pallets_for(customerId){ return companyPallets().filter(p=>p.customerId===customerId); }
function activePalletsFor(customerId){ return pallets_for(customerId).filter(p=>p.status!=='shipped'); }
function occupiedCount(locs){ return (locs || companyLocations()).filter(l=>l.palletId).length; }
function firstFreeLocation(type){ return locationsForWarehouse().find(l=>!l.palletId && (!type || l.type===type)); }
function lpnById(id){ return companyLpns().find(l=>l.id===id); }
function shipmentById(id){ return companyShipments().find(s=>s.id===id); }
function storageTypeLabel(type){ return type==='outside' ? 'Outside' : 'Inside'; }

// Floor square footage from a pallet footprint's length x width (inches) -> sqft, rounded to 1 decimal.
function calcSqft(lengthIn, widthIn){
  const l = Number(lengthIn), w = Number(widthIn);
  if(!l || !w) return null;
  return Math.round((l * w / 144) * 10) / 10;
}

// Every location "spot" is a 48x48in footprint (one standard pallet). A pallet whose longer
// side is over 48in doesn't fit in one — it needs 2 spots side by side (96x48). Returns how
// many spots a pallet needs from its entered dimensions: 1 (fits one spot, or no dims given —
// assume standard), 2 (needs a paired double), or null (over 96in on its long side — bigger
// than any bin this app models).
const SPOT_SIZE_IN = 48;
function spotsNeededForDims(lengthIn, widthIn){
  const l = Number(lengthIn) || 0, w = Number(widthIn) || 0;
  if(!l && !w) return 1;
  const longSide = Math.max(l, w);
  if(longSide <= SPOT_SIZE_IN + 0.01) return 1;
  if(longSide <= SPOT_SIZE_IN*2 + 0.01) return 2;
  return null;
}

// The other spot in the same physical tile/bay/level as `loc` — e.g. spot B of the same rack
// bay as spot A — if this zone has more than one. Used to pair up 2 adjacent 48x48 spots into
// one 96x48 opening for an oversized pallet. `aisle`+row+col+level together pin down one
// physical bay position across both the legacy (bays/levels/spots) and visual-grid warehouse
// formats; `spot` is what tells the two seats in it apart.
function partnerSpotLocation(loc, warehouseId){
  if(!loc) return null;
  return locationsForWarehouse(warehouseId || loc.warehouseId).find(l=>
    l!==loc && l.aisle===loc.aisle && l.row===loc.row && l.col===loc.col && l.level===loc.level && l.spot!==loc.spot
  );
}

// Assigns a pallet into a location — and, for an oversized pallet, its paired partner spot too.
// Centralizing this (rather than setting loc.palletId directly at each call site) is what lets
// putaway/move/shipping reliably free BOTH spots of a double-spot pallet together, instead of
// just the one spot a call site happens to know about.
function occupyPalletLocation(pallet, loc, partnerLoc){
  loc.palletId = pallet.id;
  pallet.locationCode = loc.code;
  if(partnerLoc){
    partnerLoc.palletId = pallet.id;
    pallet.locationCode2 = partnerLoc.code;
  } else {
    pallet.locationCode2 = null;
  }
}

// Frees whatever location(s) a pallet currently occupies — both spots, for a double-spot
// pallet — and clears the pallet's own location fields.
function releasePalletLocation(pallet, warehouseId){
  const wid = warehouseId || pallet.warehouseId;
  [pallet.locationCode, pallet.locationCode2].forEach(code=>{
    if(!code) return;
    const loc = locationByCode(code, wid);
    if(loc && loc.palletId===pallet.id) loc.palletId = null;
  });
  pallet.locationCode = null;
  pallet.locationCode2 = null;
}

// Combined "where is this pallet" label for display — a single code, or "WA1A + WA1B" for a
// double-spot pallet occupying two adjacent spots.
function palletLocationLabel(p){
  if(!p.locationCode) return null;
  return p.locationCode2 ? `${p.locationCode} + ${p.locationCode2}` : p.locationCode;
}
// Effective billing rates for a pallet: a per-pallet ("per receipt") override if set, else the customer's
// blanket rate — which itself is either a flat per-pallet monthly rate or, for customers billed by square
// footage, that customer's $/sqft rate multiplied by this pallet's recorded floor square footage.
function effRateInside(p){
  const c = customerById(p.customerId);
  if(p.customRateInside!=null) return Number(p.customRateInside);
  if(c.billingMethod==='sqft' && p.sqft) return p.sqft * (c.rateInsideSqft!=null ? c.rateInsideSqft : 0.6);
  return c.rateInside;
}
function effRateOutside(p){
  const c = customerById(p.customerId);
  if(p.customRateOutside!=null) return Number(p.customRateOutside);
  if(c.billingMethod==='sqft' && p.sqft) return p.sqft * (c.rateOutsideSqft!=null ? c.rateOutsideSqft : 0.4);
  return c.rateOutside;
}

// Human-readable "what is this request about" summary, shared by the staff Requests table and
// the customer portal's request history. An Outbound request's authoritative reference is the
// linked pallet record (r.palletId) rather than free text, since Expected Outbound acts on it
// directly — so that takes priority over the freeform "details" field when present. An Inbound
// request can cover several same-size pallets on one shipment (r.palletCount), so it shows the
// count, the size (standard 48x48 vs a customer-specified footprint), and how many of those
// pallets have actually been received so far.
function requestDetailLabel(r){
  if(r.type === 'Outbound' && r.palletId){
    const p = palletById(r.palletId);
    const palletBit = p
      ? `<span class="mono">${escapeHtml(p.id)}</span> — ${escapeHtml(p.sku)}`
      : `<span class="mono">${escapeHtml(r.palletId)}</span> <span class="muted">(pallet no longer on file)</span>`;
    return `${palletBit}${r.ref?`<br><span class="muted">${escapeHtml(r.ref)}</span>`:''}${r.poNumber?`<br><span class="muted">PO ${escapeHtml(r.poNumber)}</span>`:''}${r.deliveryAddress?`<br><span class="muted">Ship to: ${escapeHtml(r.deliveryAddress)}</span>`:''}${r.notes?`<br><span class="muted">${escapeHtml(r.notes)}</span>`:''}`;
  }
  if(r.type === 'Inbound'){
    const count = r.palletCount || 1;
    const received = (r.receivedPalletIds||[]).length;
    const hasDims = r.dimLength && r.dimWidth;
    const sizeLabel = hasDims ? (r.palletSizeType === 'nonstandard' ? `${r.dimLength}in × ${r.dimWidth}in` : `Standard ${r.dimLength}in × ${r.dimWidth}in`) : '';
    const countLabel = count > 1 ? `${count} pallets` : '1 pallet';
    const totalSqft = r.sqft!=null ? Math.round(r.sqft*count*10)/10 : null;
    const sqftBit = r.sqft ? ` · <b>${r.sqft} sqft</b>${count>1 && totalSqft!=null?` each (${totalSqft} sqft total)`:''}` : '';
    const progressBit = count > 1 ? ` · <b>${received} of ${count} received</b>` : '';
    return `${escapeHtml(r.ref||'')}${r.jobName?` <span class="muted">(${escapeHtml(r.jobName)})</span>`:''}<br><span class="muted">${countLabel}${sizeLabel?' · '+sizeLabel:''}${sqftBit}${progressBit}</span>${r.poNumber?`<br><span class="muted">PO ${escapeHtml(r.poNumber)}</span>`:''}${r.notes?`<br><span class="muted">${escapeHtml(r.notes)}</span>`:''}`;
  }

// outstanding until that pallet is linked. Inbound can cover multiple same-size pallets on one
// shipment, so it's outstanding until every one of them has actually been received.
function requestOutstanding(r){
  if(r.type === 'Outbound') return !r.linkedPalletId;

/* ---------------------------- Cross-dock fee schedule — ad hoc charges ----------------------------
   The recurring monthly storage rate and the per-pallet unload/load fee (both above) are already
   fully automatic. Everything else on a company's fee schedule — a per-trailer cross-dock fee, an
   appointment minimum, hand-stack labor, sort/relabel, an after-hours surcharge, a no-show fee, and
   detention — is transaction-specific (it depends on what actually happened on a given job), so
   these are staff-triggered "Add fee" actions instead of something the app can silently infer.
   Each type here knows how to read its own rate off a company's feeSchedule and, where relevant,
   how a quantity (hours, days, cases, or a base amount to surcharge) turns into a dollar amount. */
const CROSSDOCK_FEE_TYPES = [
  { key:'CrossDockPallet', label:'Cross-dock fee (per pallet)', scopes:['pallet'], unit:'flat',
    rate: fs=>fs.crossDockPerPallet },
  // Note: the after-free-dwell per diem is NOT a manual option here — for any customer with
  // "Cross-dock billing" turned on (Add/Edit customer), it's computed and billed automatically
  // once a pallet passes the free dwell window (see computeCrossDockDwellLines). This list is
  // for genuinely one-off, staff-triggered charges only.
  { key:'CrossDockTrailer', label:'Cross-dock fee (per trailer)', scopes:['shipment'], unit:'flat',
    rate: fs=>fs.crossDockPerTrailer },
  { key:'UnloadLoadTrailer', label:'Unload/load only (per trailer)', scopes:['shipment'], unit:'flat',
    rate: fs=>fs.unloadLoadPerTrailer },
  { key:'ApptMinimum', label:'Appointment / minimum charge', scopes:['shipment','pallet'], unit:'flat',
    rate: fs=>fs.crossDockMinimum },
  { key:'HandStack', label:'Floor-load / hand-stack (hourly + materials)', scopes:['shipment','pallet'], unit:'hours',
    rate: fs=>fs.handStackPerHour },
  { key:'SortRelabelHr', label:'Sort / relabel / rewrap (hourly)', scopes:['shipment','pallet'], unit:'hours',
    rate: fs=>fs.sortRelabelPerHour },
  { key:'SortRelabelCase', label:'Sort / relabel / rewrap (per case)', scopes:['shipment','pallet'], unit:'cases',
    rate: fs=>fs.sortRelabelPerCase },
  { key:'AfterHours', label:'After-hours / weekend surcharge', scopes:['shipment','pallet'], unit:'surcharge',
    rate: fs=>fs.afterHoursSurchargePct },
  { key:'NoShow', label:'No-show / late fee', scopes:['shipment','pallet'], unit:'flat',
    rate: fs=>fs.noShowFee },
  { key:'Detention', label:'Detention (after free hours)', scopes:['shipment','pallet'], unit:'detentionHours',
    rate: fs=>fs.detentionPerHour },
];
function feeUnitSuffix(unit){
  switch(unit){
    case 'hours': return '/hr';
    case 'days': return '/pallet/day';
    case 'cases': return '/case';
    case 'surcharge': return '%';
    case 'detentionHours': return '/hr';
    default: return '';
  }
}
// The fee schedule belongs to the CURRENT company (not a customer) — that's the whole point of
// the "for crossdock, not for SBA" distinction: it's Phoenix Cross Dock's own rate card, usable
// for any customer under that company, rather than something baked into one customer's record.
// The fee-schedule shape has grown over time (e.g. unloadLoadMinimum was added after some
// companies already had a saved fee schedule on file) — backfill any missing field in place with
// a sane default so older saved data doesn't break pricing math with an undefined minimum/rate.
// Both feeScheduleFor() and feeScheduleOrNull() route through this so every caller is covered.
function normalizeFeeSchedule(fs){
  if(!fs) return fs;
  if(fs.unloadLoadMinimum == null) fs.unloadLoadMinimum = 125;
  return fs;
}
function feeScheduleOrNull(){ return normalizeFeeSchedule(currentCompany().feeSchedule) || null; }
function addFeeModalOptionsHtml(scope, fs){
  return CROSSDOCK_FEE_TYPES.filter(f=>f.scopes.includes(scope)).map(f=>
    `<option value="${f.key}">${escapeHtml(f.label)} — ${fmtMoney(f.rate(fs))}${feeUnitSuffix(f.unit)}</option>`
  ).join('');
}
function feeModalRecalc(){
  const fs = feeScheduleOrNull();
  const typeSel = document.getElementById('feeType');
  if(!fs || !typeSel) return;
  const cfg = CROSSDOCK_FEE_TYPES.find(f=>f.key===typeSel.value);
  if(!cfg) return;
  const qtyBox = document.getElementById('feeQtyBox');
  const qtyLabel = document.getElementById('feeQtyLabel');
  const qtyInput = document.getElementById('feeQty');
  const amountInput = document.getElementById('feeAmount');
  const hint = document.getElementById('feeHint');
  const rate = cfg.rate(fs);
  const qty = parseFloat(qtyInput.value) || 0;
  let amount = rate, showQty = true, qtyLabelText = '';
  switch(cfg.unit){
    case 'flat':
      showQty = false; amount = rate;
      hint.textContent = `Flat fee: ${fmtMoney(rate)}.`;
      break;
    case 'hours':
      qtyLabelText = 'Hours'; amount = rate * qty;
      hint.textContent = `${fmtMoney(rate)}/hr × ${qty} hr.`;
      break;
    case 'days':
      qtyLabelText = 'Days beyond free dwell'; amount = rate * qty;
      hint.textContent = `${fmtMoney(rate)}/pallet/day × ${qty} day(s). First ${fs.crossDockFreeDwellHours}h of dwell is free.`;
      break;
    case 'cases':
      qtyLabelText = 'Cases'; amount = rate * qty;
      hint.textContent = `${fmtMoney(rate)}/case × ${qty} case(s).`;
      break;
    case 'surcharge':
      qtyLabelText = 'Base amount to surcharge ($)'; amount = qty * (rate/100);
      hint.textContent = `${rate}% of the ${fmtMoney(qty)} base amount entered.`;
      break;
    case 'detentionHours': {
      qtyLabelText = `Hours on-site (first ${fs.detentionFreeHours}h free)`;
      const billable = Math.max(0, qty - fs.detentionFreeHours);
      amount = rate * billable;
      hint.textContent = `${qty} hr on-site − ${fs.detentionFreeHours}h free = ${billable} billable hr × ${fmtMoney(rate)}/hr.`;
      break;
    }
  }
  qtyBox.style.display = showQty ? 'block' : 'none';
  if(qtyLabel) qtyLabel.textContent = qtyLabelText;
  amountInput.value = (Math.round(amount*100)/100).toFixed(2);
}
function feeDescription(cfg, fs, qty, note){
  let base;
  switch(cfg.unit){
    case 'hours': base = `${cfg.label} — ${qty||0} hr`; break;
    case 'days': base = `${cfg.label} — ${qty||0} day(s)`; break;
    case 'cases': base = `${cfg.label} — ${qty||0} case(s)`; break;
    case 'surcharge': base = `${cfg.label} — ${fs.afterHoursSurchargePct}% of ${fmtMoney(parseFloat(qty)||0)}`; break;
    case 'detentionHours': base = `${cfg.label} — ${qty||0} hr on-site`; break;
    default: base = cfg.label;
  }
  return note ? `${base} (${note})` : base;
}
// scope is 'pallet' or 'shipment'; id is that record's id. Pulls the current company's fee
// schedule (not any one customer's rates) as the source of default rates.
