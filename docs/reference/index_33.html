/* ---------------------------- Billing ---------------------------- */
function periodRange(period){
  const dim = daysInMonth(period);
  return [ period+'-01', period+'-'+String(dim).padStart(2,'0') ];
}

// Reconstructs, from the movement log, which location (and therefore which
// storage type — inside vs outside) a pallet occupied on any given day.
function buildLocationBreakpoints(p){
  const evs = companyMovements()
    .filter(m=>m.palletId===p.id && ['Receive','Putaway','Move','Ship'].includes(m.type))
    .slice().sort((a,b)=> a.ts.localeCompare(b.ts));
  const bps = [];
  evs.forEach(m=>{
    const date = m.ts.slice(0,10);
    let code = null;
    if(m.type==='Receive') code = (m.to && m.to!=='Dock') ? m.to : null;
    else if(m.type==='Putaway' || m.type==='Move') code = (m.to && m.to!=='Dock') ? m.to : null;
    else if(m.type==='Ship') code = null;
    bps.push({ date, code });
  });
  if(bps.length===0) bps.push({ date:p.receivedDate, code:p.locationCode });
  return bps;
}
function palletLocationSegments(p){
  const bps = buildLocationBreakpoints(p);
  const palletEnd = p.shippedDate || todayISO();
  const segments = [];
  for(let i=0;i<bps.length;i++){
    const start = bps[i].date;
    const end = (i+1<bps.length) ? addDays(bps[i+1].date, -1) : palletEnd;
    segments.push({ code: bps[i].code, start, end });
  }
  return segments;
}

// A customer's pallet count "on hand" at any point during the period — used only to test the
// Monthly Storage account minimum below (not to charge anything by itself).
function palletCountInPeriod(customerId, start, end){
  return pallets_for(customerId).filter(p=>{
    const palletEnd = p.shippedDate || todayISO();
    return clampOverlapDays(p.receivedDate, palletEnd, start, end) > 0;
  }).length;
}

function computeStorageLines(customerId, period){
  const cust = customerById(customerId);
  const [start,end] = periodRange(period);
  const dim = daysInMonth(period);
  const lines = [];
  // Cross-dock billing customers don't accrue the standard monthly per-pallet/sqft storage charge
  // — they pay the flat cross-dock fee (at receiving) plus, automatically, the after-free-dwell
  // per diem computed in computeCrossDockDwellLines below. The one exception: a pallet the
  // customer has proactively asked to convert to Monthly Storage (see convertPalletsToStorage)
  // bills the company's standard published Monthly Storage rate from its conversion date forward.
  if(cust && cust.billingMethod==='crossdock'){
    const fs = feeScheduleFor(cust.companyId);
    if(!fs) return [];
    pallets_for(customerId).forEach(p=>{
      if(p.workflowOverride !== 'storage' || !p.workflowConvertedDate) return;
      const rate = (fs.floorStoragePerPalletMo||0) / dim;
      const palletEnd = p.shippedDate || todayISO();
      const days = clampOverlapDays(p.workflowConvertedDate, palletEnd, start, end);
      if(days <= 0) return;
      lines.push({ palletId:p.id, description:`${p.sku} — ${days}d Monthly Storage (converted from Cross-Dock ${fmtDate(p.workflowConvertedDate)})`, kind:'Storage', amount: days*rate });
    });
    return lines;
  }
  // Storage contract customers pay one flat fee for their reserved space every period,
  // regardless of how many pallets they actually have on hand — a reserved-capacity
  // commitment, not usage-based billing, so none of the per-pallet proration below applies.
  if(cust && cust.billingMethod==='contract'){
    const fee = cust.contractFee || 0;
    if(fee <= 0) return [];
    return [{ palletId:null, description:`Storage contract — ${(cust.contractSqft||0).toLocaleString()} sqft reserved (flat fee)`, kind:'Contract', amount: fee }];
  }
  pallets_for(customerId).forEach(p=>{
    const inRate = effRateInside(p) / dim, outRate = effRateOutside(p) / dim;
    let inDays = 0, outDays = 0;
    palletLocationSegments(p).forEach(seg=>{
      if(!seg.code) return;
      const loc = locationByCode(seg.code, p.warehouseId);
      if(!loc) return;
      const days = clampOverlapDays(seg.start, seg.end, start, end);
      if(days <= 0) return;
      if(loc.type === 'outside') outDays += days; else inDays += days;
    });
    if(inDays<=0 && outDays<=0) return;
    const amount = inDays*inRate + outDays*outRate;
    const parts = [];
    if(inDays) parts.push(`${inDays}d inside`);
    if(outDays) parts.push(`${outDays}d outside`);
    lines.push({ palletId:p.id, description:`${p.sku} — ${parts.join(', ')}${hasCustomRate(p)?' (custom rate)':''}`, kind:'Storage', amount });
  });
  // Monthly Storage (non-contract) account minimum: $300/mo or 15 pallets, whichever the account
  // doesn't meet — applies only to customers whose primary billing method IS Monthly Storage
  // ('pallet' or 'sqft'), not to a Cross-Dock customer just because one pallet got converted above.
  if(cust && (cust.billingMethod==='pallet' || cust.billingMethod==='sqft')){
    const fs = feeScheduleFor(cust.companyId);
    if(fs && fs.accountMinimumMonthlyFee){
      const activeCount = palletCountInPeriod(customerId, start, end);
      const computedTotal = lines.reduce((s,l)=>s+l.amount, 0);
      if(activeCount > 0 && activeCount < (fs.accountMinimumPallets||0) && computedTotal < fs.accountMinimumMonthlyFee){
        lines.push({ palletId:null, description:`Account minimum top-up — below ${fs.accountMinimumPallets}-pallet / ${fmtMoney(fs.accountMinimumMonthlyFee)} threshold`, kind:'AccountMinimum', amount: fs.accountMinimumMonthlyFee - computedTotal });
      }
    }
  }
  return lines;
}

// Automatic after-free-dwell billing for cross-dock customers — this is what replaces having
// to notice "it's been over 48 hours" by hand: once a pallet has been on hand longer than the
// company fee schedule's free dwell window, every day beyond that accrues automatically here,
// the same way ordinary storage accrues day-by-day in computeStorageLines above. No "Add fee"
// click required; the manual "Add fee" action still exists for one-off adjustments/corrections.
function computeCrossDockDwellLines(customerId, period){
  const cust = customerById(customerId);
  if(!cust || cust.billingMethod!=='crossdock') return [];
  const [start,end] = periodRange(period);
  const lines = [];
  pallets_for(customerId).forEach(p=>{
    const fs = feeScheduleFor(p.companyId);
    if(!fs) return;
    const freeDays = Math.ceil((fs.crossDockFreeDwellHours||48) / 24);
    const freeEnd = addDays(p.receivedDate, freeDays); // first day billable at the per-diem rate
    // Once converted to Monthly Storage, overage stops accruing the day it converts — everything
    // from that date forward bills as Storage instead (see computeStorageLines above).
    let palletEnd = p.shippedDate || todayISO();
    if(p.workflowOverride==='storage' && p.workflowConvertedDate){
      palletEnd = addDays(p.workflowConvertedDate, -1);
    }
    const days = clampOverlapDays(freeEnd, palletEnd, start, end);
    if(days <= 0) return;
    const amount = days * fs.afterFreeDwellPerPalletDay;
    lines.push({ palletId:p.id, description:`${p.sku} — ${days}d beyond ${fs.crossDockFreeDwellHours}h free dwell (auto)`, kind:'AfterFreeDwell', amount });
  });
  return lines;
}

function computeAccessorialLines(customerId, period){
  const [start,end] = periodRange(period);
  return companyAccessorials()
    .filter(a=>a.customerId===customerId && a.date>=start && a.date<=end)
    .map(a=>({ palletId:a.palletId, shipmentId:a.shipmentId||null, description: a.description || `${a.type} fee`, kind:a.type, amount:a.amount, accId:a.id }));
}

function computeChargeLines(customerId, period){
  return [...computeStorageLines(customerId, period), ...computeCrossDockDwellLines(customerId, period), ...computeAccessorialLines(customerId, period)];
}
// Total estimated charge for the period: storage (prorated, inside/outside) + unload/load accessorials.
function computeStorageCharge(customerId, period){
  return computeChargeLines(customerId, period).reduce((s,l)=>s+l.amount, 0);
}

            </div>

        <div class="table-wrap">
        <table>
          <thead><tr>
            <th><input type="checkbox" ${allSelected?'checked':''} ${eligibleIds.length?'':'disabled'} onchange="toggleBillingSelectAll('${period}')" style="width:auto;" title="Select all eligible customers"></th>
            <th>Customer</th><th>Rate (In / Out)</th><th>Pallets billed</th><th>Storage</th><th>Unload / Load fees</th><th>Est. total</th><th>Invoice status</th>
          </tr></thead>

          ${rows.map(r=>{

            const checked = selected.includes(r.customer.id);

// customerIds is optional — pass a single-item array (individual "Generate" button) or a
// multi-item array (bulk-selected). Omit it (or pass nothing) to generate for every customer.
function generateInvoices(period, customerIds){
  const ids = (customerIds && customerIds.length) ? customerIds : companyCustomers().map(c=>c.id);
  let created = 0, skipped = 0, noCharge = 0;
  ids.forEach(cid=>{
    const c = customerById(cid);
    if(!c) return;
    const lines = computeChargeLines(c.id, period);
    const total = lines.reduce((s,l)=>s+l.amount,0);
    if(total <= 0){ noCharge++; return; }
    const existing = companyInvoices().find(i=>i.customerId===c.id && i.period===period);
    if(existing){ skipped++; return; }
    const inv = { id: uid('INV-'), companyId: state.currentCompanyId, customerId:c.id, period, lines, total, status:'Draft', dateGenerated: todayISO() };
    state.invoices.push(inv);
    lines.forEach(l=>{ if(l.accId){ const acc = companyAccessorials().find(a=>a.id===l.accId); if(acc) acc.invoiceId = inv.id; } });
    created++;
  });
  const parts = [`${created} invoice${created===1?'':'s'} generated`];
  if(skipped) parts.push(`${skipped} already existed`);
  if(customerIds && noCharge) parts.push(`${noCharge} had no charges`);
  toast(parts.join(', '));
  state.billingSelected = [];
  render();
}

function toggleBillingSelect(id){
  state.billingSelected = state.billingSelected || [];
  if(state.billingSelected.includes(id)) state.billingSelected = state.billingSelected.filter(x=>x!==id);
  else state.billingSelected.push(id);
  render();
}

function toggleBillingSelectAll(period){
  const invoicesForPeriod = companyInvoices().filter(i=>i.period===period);
  const eligibleIds = companyCustomers().filter(c=>{
    const total = computeStorageCharge(c.id, period);
    const existing = invoicesForPeriod.find(i=>i.customerId===c.id);
    return total>0 && !existing;
  }).map(c=>c.id);
  const allSelected = eligibleIds.length>0 && eligibleIds.every(id=>(state.billingSelected||[]).includes(id));
  state.billingSelected = allSelected ? [] : eligibleIds;
  render();
}

function bulkGenerateSelected(period){
  const ids = state.billingSelected || [];
  if(!ids.length) return;
  generateInvoices(period, ids);
}

function openInvoiceModal(id){
  const inv = companyInvoices().find(i=>i.id===id);
  if(!inv) return;
  const cust = customerById(inv.customerId);
  const nextStatus = { Draft:'Sent', Sent:'Paid', Paid:null }[inv.status];
  showModal({
    title: `Invoice ${inv.id}`,
    primaryLabel: nextStatus ? `Mark as ${nextStatus}` : 'Close',
    body: `
      <div class="pallet-preview">
        <div class="pv-row"><span class="k">Customer</span><span>${escapeHtml(cust.name)}</span></div>
        <div class="pv-row"><span class="k">Period</span><span>${inv.period}</span></div>
        <div class="pv-row"><span class="k">Status</span><span>${invStatusBadge(inv.status)}</span></div>
        <div class="pv-row"><span class="k">Generated</span><span>${fmtDate(inv.dateGenerated)}</span></div>
      </div>
      <div class="table-wrap" style="margin-top:10px;">
        <table>
          <thead><tr><th>Pallet</th><th>Description</th><th>Type</th><th>Amount</th></tr></thead>
          <tbody>
          ${inv.lines.map(l=>`<tr><td class="mono">${l.palletId || (l.shipmentId ? l.shipmentId : '—')}</td><td>${escapeHtml(l.description)}</td><td>${l.kind}</td><td>${fmtMoney(l.amount)}</td></tr>`).join('')}
          </tbody>
          <tfoot><tr><td colspan="3" style="text-align:right;font-weight:700;">Total</td><td style="font-weight:700;">${fmtMoney(inv.total)}</td></tr></tfoot>
        </table>
      </div>
    `,
    onPrimary: ()=>{
      if(nextStatus){ inv.status = nextStatus; toast(`Invoice marked ${nextStatus}`); render(); openInvoiceModal(inv.id); return false; }
      return true;
    }
  });
}

/* ---------------------------- Requests (staff queue) ---------------------------- */
function renderRequests(){
  const f = state.reqFilter || '';
  let list = companyRequests().slice();
  if(f) list = list.filter(r=>r.status===f);
  list.sort((a,b)=> b.dateRequested.localeCompare(a.dateRequested));
  const pendingCount = companyRequests().filter(r=>r.status==='Pending').length;

  return `
    <h1 class="page-title">Customer Requests</h1>
    <p class="page-sub">${pendingCount} pending · submitted via the customer portal</p>
    <div class="search-bar">
      <select onchange="state.reqFilter=this.value; render();">
        <option value="">All statuses</option>
        <option value="Pending" ${f==='Pending'?'selected':''}>Pending</option>
        <option value="Approved" ${f==='Approved'?'selected':''}>Approved</option>
        <option value="Completed" ${f==='Completed'?'selected':''}>Completed</option>
        <option value="Rejected" ${f==='Rejected'?'selected':''}>Rejected</option>
      </select>
    </div>
    <div class="panel">
      <div class="panel-body table-wrap">
        <table>
          <thead><tr><th>Requested</th><th>Customer</th><th>Type</th><th>Detail</th><th>Status</th><th></th></tr></thead>
          <tbody>
          ${list.map(r=>{
            const cust = customerById(r.customerId);
            let actions = '';
            if(r.status==='Pending') actions = `<button class="btn sm" onclick="setReqStatus('${r.id}','Approved')">Approve</button> <button class="btn sm danger" onclick="setReqStatus('${r.id}','Rejected')">Reject</button>`;
            else if(r.status==='Approved' && requestOutstanding(r)) actions = `<button class="btn sm primary" onclick="showView('${r.type==='Inbound'?'expected-inbound':'expected-outbound'}')">Go to Expected ${r.type}</button><br><button class="link-btn" style="font-size:12px;margin-top:4px;" onclick="setReqStatus('${r.id}','Completed')">Mark completed manually</button>`;
            else actions = `<span class="muted">—</span>`;
            return `<tr>
              <td class="muted">${fmtDate(r.dateRequested)}</td>
              <td><b>${escapeHtml(cust.name)}</b></td>
              <td>${r.type}</td>
              <td>${requestDetailLabel(r)}</td>
              <td>${reqStatusBadge(r.status)}</td>
              <td>${actions}</td>
            </tr>`;
          }).join('') || `<tr><td colspan="6"><div class="empty-state">No requests match this filter.</div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
// Resets the Receive form entirely — used when staff wants to abandon a request-driven prefill
// and start from a blank pallet instead.
function clearRecvPrefill(){
  setScanMode('receive');
}

// Approved Inbound requests that haven't had every expected pallet received yet — the Expected
// Inbound work queue. A single request may cover several same-size pallets on one shipment, so
// it stays in the queue (with a running "received so far" count) until all of them arrive.
function expectedInboundRequests(){
  return companyRequests().filter(r=>r.type==='Inbound' && r.status==='Approved' && requestOutstanding(r))
    .sort((a,b)=>a.dateRequested.localeCompare(b.dateRequested));
}
// Approved Outbound requests that haven't shipped yet — the Expected Outbound work queue.
function expectedOutboundRequests(){
  return companyRequests().filter(r=>r.type==='Outbound' && r.status==='Approved' && requestOutstanding(r))
    .sort((a,b)=>a.dateRequested.localeCompare(b.dateRequested));
}

function renderExpectedInbound(){
  const list = expectedInboundRequests();
  return `
    <h1 class="page-title">Expected Inbound</h1>
    <p class="page-sub">${list.length} approved inbound request${list.length===1?'':'s'} waiting to arrive · approve requests from the Requests tab first</p>
    <div class="panel">
      <div class="panel-body table-wrap">
        <table>
          <thead><tr><th>Approved</th><th>Customer</th><th>Expected</th><th></th></tr></thead>
          <tbody>
          ${list.map(r=>{
            const cust = customerById(r.customerId);
            const count = r.palletCount || 1;
            const received = (r.receivedPalletIds||[]).length;
            const btnLabel = count > 1 ? `Receive pallet ${received+1} of ${count}` : 'Receive now';

              <td class="muted">${fmtDate(r.dateResolved||r.dateRequested)}</td>

}

function renderExpectedOutbound(){
  const list = expectedOutboundRequests();
  return `
    <h1 class="page-title">Expected Outbound</h1>
    <p class="page-sub">${list.length} approved pickup/ship request${list.length===1?'':'s'} waiting to go · approve requests from the Requests tab first</p>
    <div class="panel">
      <div class="panel-body table-wrap">
        <table>
          <thead><tr><th>Approved</th><th>Customer</th><th>Pallet</th><th></th></tr></thead>
          <tbody>
          ${list.map(r=>{
            const cust = customerById(r.customerId);
            const p = r.palletId ? palletById(r.palletId) : null;
            const unavailable = !p || p.status==='shipped' || p.status==='pending_putaway';
            let issue = '';
            if(!p) issue = 'Pallet no longer on file';
            else if(p.status==='shipped') issue = 'Already shipped';
            else if(p.status==='pending_putaway') issue = "Hasn't been put away yet";
            return `<tr>
              <td class="muted">${fmtDate(r.dateResolved||r.dateRequested)}</td>
              <td><b>${escapeHtml(cust.name)}</b></td>
              <td>${requestDetailLabel(r)}${issue?`<br><span class="muted" style="color:#b45309;">⚠️ ${issue}</span>`:''}</td>
              <td>${unavailable ? `<span class="muted">—</span>` : `<button class="btn sm primary" onclick="shipFromRequest('${r.id}')">Add to ship queue</button>`}</td>
            </tr>`;
          }).join('') || `<tr><td colspan="4"><div class="empty-state">Nothing waiting to ship right now — approved outbound requests show up here until they're queued.</div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// Jumps to Receive with the request's details pre-filled and a fresh barcode already generated
// (an approved request is a legitimate expected pallet, so there's no reason to make staff type
// a barcode by hand) — completing the receive links the new pallet back to this request.
function receiveFromRequest(reqId){
  const r = companyRequests().find(x=>x.id===reqId);
  if(!r){ toast('Request not found'); return; }
  const cust = customerById(r.customerId);
  const count = r.palletCount || 1;
  const received = (r.receivedPalletIds||[]).length;
  state.recvPrefill = {
    requestId: r.id,
    customerId: r.customerId,
    sku: r.ref || r.notes || 'Requested goods',
    qty: r.qty || 1,
    dimLength: r.dimLength!=null ? r.dimLength : '',
    dimWidth: r.dimWidth!=null ? r.dimWidth : '',
    jobName: r.jobName || '',
    poNumber: r.poNumber || '',
  };
  state.scanBarcodeVal = uid('PLT-');
  state.scanMode = 'receive';
  showView('scan');
  const progressMsg = count > 1 ? ` — pallet ${received+1} of ${count}` : '';
  toast(`Receiving against request from ${cust ? cust.name : 'customer'}${progressMsg} — fields pre-filled below`);
}

// Queues the request's linked pallet for shipping and closes out the request immediately — the
// office has now acted on it, the same way manually clicking "Mark completed" in Requests would.
function shipFromRequest(reqId){
  const r = companyRequests().find(x=>x.id===reqId);
  if(!r){ toast('Request not found'); return; }
  const p = r.palletId ? palletById(r.palletId) : null;
  if(!p){ toast('The pallet on this request is no longer on file'); return; }
  if(p.status === 'shipped'){ toast(`${p.id} has already shipped`); return; }
  if(p.status === 'pending_putaway'){ toast(`${p.id} hasn't been put away yet — can't ship from the dock`); return; }
  state.shipQueue = state.shipQueue || [];
  if(!state.shipQueue.includes(p.id)) state.shipQueue.push(p.id);
  r.linkedPalletId = p.id;
  r.status = 'Completed';
  r.dateResolved = todayISO();
  state.scanMode = 'ship';
  showView('scan');
  toast(`${p.id} added to the ship queue — request marked completed`);
}

function setReqStatus(id, status){
  const r = companyRequests().find(x=>x.id===id);
  if(!r) return;
  r.status = status;
  r.dateResolved = todayISO();
  toast(`Request marked ${status}`);
  render();
}

// Toggles the portal request form's fields based on request type: Inbound shows the
// pallet-dimensions box (floor footprint for pallets that haven't arrived yet); Outbound shows
// a dropdown of the customer's own in-storage pallets instead, since an outbound request needs
// to reliably reference a real pallet record — not a freeform description staff would have to
// parse — so Expected Outbound can act on it directly.
function togglePortalTypeFields(){
  const sel = document.getElementById('portalType');
  const dimsBox = document.getElementById('portalDimsBox');
  const hint = document.getElementById('portalDimsHint');
  const outboundBox = document.getElementById('portalOutboundBox');
  const refLabel = document.getElementById('portalRefLabel');
  const refInput = document.getElementById('portalRef');
  if(!sel) return;
  const isInbound = sel.value === 'Inbound';
  if(dimsBox) dimsBox.style.display = isInbound ? 'block' : 'none';
  if(hint) hint.style.display = isInbound ? 'block' : 'none';
  if(outboundBox) outboundBox.style.display = isInbound ? 'none' : 'block';
  if(refLabel) refLabel.textContent = isInbound ? 'Details' : 'Additional details (optional)';
  if(refInput) refInput.placeholder = isInbound ? 'e.g. arriving Thursday via ABC Freight, dock appointment needed' : 'e.g. ship to our Tucson store, will-call pickup Friday';
  if(isInbound) updatePortalSqft();
}
// Standard pallets are a fixed 48x48in footprint — only "Non-standard" needs the customer to
// type dimensions in, and clears any leftover dimension values when switching back to Standard
// so a stale non-standard size can't accidentally get submitted alongside "Standard" selected.
function togglePortalSizeFields(){
  const sel = document.getElementById('portalPalletSize');
  const box = document.getElementById('portalCustomDimsBox');
  if(!sel) return;
  const isStandard = sel.value !== 'nonstandard';
  if(box) box.style.display = isStandard ? 'none' : 'flex';
  if(isStandard){
    const lEl = document.getElementById('portalDimLength'), wEl = document.getElementById('portalDimWidth');
    if(lEl) lEl.value = '';
    if(wEl) wEl.value = '';
  }
  updatePortalSqft();
}
function updatePortalSqft(){
  const out = document.getElementById('portalSqftOut');
  const totalOut = document.getElementById('portalSqftTotalOut');
  if(!out) return;
  const sizeSel = document.getElementById('portalPalletSize');
  const isStandard = !sizeSel || sizeSel.value !== 'nonstandard';
  let l, w;
  if(isStandard){ l = 48; w = 48; }
  else {
    const lEl = document.getElementById('portalDimLength'), wEl = document.getElementById('portalDimWidth');
    l = lEl ? lEl.value : ''; w = wEl ? wEl.value : '';
  }
  const sqft = calcSqft(l, w);
  out.textContent = sqft!=null ? `${sqft} sqft` : '—';
  if(totalOut){
    const countEl = document.getElementById('portalPalletCount');
    const count = countEl ? parseInt(countEl.value) : 1;
    totalOut.textContent = (sqft!=null && Number.isFinite(count) && count>1) ? ` · ${Math.round(sqft*count*10)/10} sqft total for ${count} pallets` : '';
  }
}

function submitPortalRequest(custId){
  const type = $('#portalType').value;
  const ref = $('#portalRef').value.trim();
  const notes = $('#portalNotes').value.trim();
  const poEl = document.getElementById('portalPO');
  const poNumber = poEl && poEl.value.trim() ? poEl.value.trim() : null;
  let dimLength = null, dimWidth = null, sqft = null, palletId = null, palletSizeType = null, palletCount = null, jobName = null, deliveryAddress = null;
  if(type === 'Inbound'){
    if(!ref){ toast('Please add some details about the request'); return; }
    const jobNameEl = document.getElementById('portalJobName');
    jobName = jobNameEl && jobNameEl.value.trim() ? jobNameEl.value.trim() : null;
    const sizeSel = document.getElementById('portalPalletSize');
    palletSizeType = (sizeSel && sizeSel.value === 'nonstandard') ? 'nonstandard' : 'standard';
    if(palletSizeType === 'standard'){
      dimLength = 48; dimWidth = 48;
    } else {
      const lEl = document.getElementById('portalDimLength'), wEl = document.getElementById('portalDimWidth');
      dimLength = lEl && lEl.value.trim() ? Number(lEl.value.trim()) : null;
      dimWidth = wEl && wEl.value.trim() ? Number(wEl.value.trim()) : null;
      if(!dimLength || !dimWidth){ toast('Enter both length and width for a non-standard pallet size'); return; }
    }
    sqft = calcSqft(dimLength, dimWidth);
    const countEl = document.getElementById('portalPalletCount');
    palletCount = countEl && countEl.value.trim() ? parseInt(countEl.value.trim()) : 1;
    if(!Number.isFinite(palletCount) || palletCount < 1){ toast('Enter how many pallets are on this shipment'); return; }
  } else {
    palletId = ($('#portalOutboundPallet').value || '').trim();
    if(!palletId){ toast('Select which pallet you\'d like picked up or shipped'); return; }
    const addrEl = document.getElementById('portalDeliveryAddress');
    deliveryAddress = addrEl && addrEl.value.trim() ? addrEl.value.trim() : null;
  }
  state.requests.push({ id: uid('REQ-'), companyId: state.currentCompanyId, customerId:custId, type, ref, qty:1, notes, jobName, poNumber, deliveryAddress, palletSizeType, palletCount, dimLength, dimWidth, sqft, receivedPalletIds:[], palletId, linkedPalletId:null, status:'Pending', dateRequested: todayISO() });
  state.portalForm = { type:'Inbound', qty:1, ref:'', notes:'', jobName:'', poNumber:'', deliveryAddress:'', outboundPalletId:'', palletSizeType:'standard', palletCount:1, dimLength:'', dimWidth:'' };
  toast(type==='Inbound' && palletCount>1 ? `Request submitted for ${palletCount} pallets — the warehouse team has been notified` : 'Request submitted — the warehouse team has been notified');
  render();
}

/* ---------------------------- Init ---------------------------- */
function init(){
  state = seed();
  state.view = 'dashboard';
  state.mode = 'staff';
  state.portalCustomerId = state.customers.find(c=>c.companyId===state.currentCompanyId).id;
  render();
  initPersistence();
}
document.addEventListener('DOMContentLoaded', init);

// Closes any open grouped-tab dropdown (e.g. "Warehouse ▾") when clicking anywhere outside it.
// Navigating to one of its items already closes it naturally (render() rebuilds the nav from
// scratch), so this only matters for "opened it, then clicked away without choosing anything."
document.addEventListener('click', (e)=>{
  document.querySelectorAll('nav.tabs details[open]').forEach(d=>{
    if(!d.contains(e.target)) d.removeAttribute('open');
  });
});
</script>
</body>
</html>
