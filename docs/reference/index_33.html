// Suggests outbound shipment defaults from what was already captured on these pallets at receipt,
// so staff shipping them back out don't have to re-enter the same physical details. Weight sums
// every pallet's recorded weight (a shipment's weight is the whole truckload); equipment uses the
// type of offload they came in on when it's consistent across the group (the most common one when
// it isn't) — either way it's just a prefill, staff can still change it before confirming.
// Picks the single common non-blank value for `getter(pallet)` across a group of pallets, so a
// PO number or job name that was recorded once at receiving can default the outbound BOL for the
// same pallets — without guessing when the group genuinely has more than one different value.
function commonPalletValue(pallets, getter){
  const counts = {};
  pallets.forEach(p=>{ const v = getter(p); if(v) counts[v] = (counts[v]||0) + 1; });
  const keys = Object.keys(counts);
  if(!keys.length) return { value: null, mixed: false };
  if(keys.length === 1) return { value: keys[0], mixed: false };
  return { value: keys.reduce((a,b)=> counts[a] >= counts[b] ? a : b), mixed: true };
}
function deriveOutboundDefaults(palletIds){
  const pallets = (palletIds||[]).map(id=>palletById(id)).filter(Boolean);
  const weights = pallets.map(p=>p.weightLbs).filter(w=>w!=null && !isNaN(w));
  const weightLbs = weights.length ? weights.reduce((a,b)=>a+b,0) : null;
  const equipCounts = {};
  pallets.forEach(p=>{ if(p.equipment) equipCounts[p.equipment] = (equipCounts[p.equipment]||0) + 1; });
  const equipKeys = Object.keys(equipCounts);
  let equipment = null, mixedEquipment = false;
  if(equipKeys.length === 1){
    equipment = equipKeys[0];
  } else if(equipKeys.length > 1){
    mixedEquipment = true;
    equipment = equipKeys.reduce((a,b)=> equipCounts[a] >= equipCounts[b] ? a : b);
  }
  // Job name lives directly on the pallet (captured at receiving). PO number was only ever
  // recorded on the inbound shipment/BOL those pallets were grouped into (or on the outbound
  // pickup request that queued them), so look it up through those links instead.
  const jobNameResult = commonPalletValue(pallets, p=>p.jobName);
  const poResult = commonPalletValue(pallets, p=>{
    const inboundShip = p.shipmentId ? shipmentById(p.shipmentId) : null;
    if(inboundShip && inboundShip.poNumber) return inboundShip.poNumber;
    const outboundReq = companyRequests().find(r=>r.type==='Outbound' && r.linkedPalletId===p.id && r.poNumber);
    return outboundReq ? outboundReq.poNumber : null;
  });
  // A job-site delivery address, when one of these pallets came off an outbound pickup request
  // that named one, takes priority over the customer's on-file address (that's the whole point
  // of recording it — this particular load is going somewhere other than the usual place).
  const addressResult = commonPalletValue(pallets, p=>{
    const outboundReq = companyRequests().find(r=>r.type==='Outbound' && r.linkedPalletId===p.id && r.deliveryAddress);
    return outboundReq ? outboundReq.deliveryAddress : null;
  });
  return {
    weightLbs, equipment, mixedEquipment,
    jobName: jobNameResult.value, mixedJobName: jobNameResult.mixed,
    poNumber: poResult.value, mixedPoNumber: poResult.mixed,
    address: addressResult.value, mixedAddress: addressResult.mixed,
  };
}
// Re-derives the outbound ship-draft's weight/equipment/job-name/PO/address prefill from the
// current queue contents, but only overwrites a field the user hasn't manually edited yet
// (tracked by *Touched flags), so scanning in another pallet never clobbers something staff
// already typed. Address falls back to the customer's on-file address when nothing more specific
// (an outbound request's own delivery address) was found.
function syncShipDraftPrefill(palletIds, custId){
  const draft = state.shipShipmentDraft;
  if(!draft) return;
  const defaults = deriveOutboundDefaults(palletIds);
  if(!draft.weightTouched) draft.weightLbs = defaults.weightLbs!=null ? String(defaults.weightLbs) : '';
  if(!draft.equipmentTouched) draft.equipment = defaults.equipment || '';
  if(!draft.jobNameTouched) draft.jobName = defaults.jobName || '';
  if(!draft.poNumberTouched) draft.poNumber = defaults.poNumber || '';
  if(!draft.addressTouched){
    const cust = custId ? customerById(custId) : null;
    draft.address = defaults.address || (cust && cust.address) || '';
  }
}

function showView(view, arg){
  state.view = view;
  state.viewArg = arg;
  render();
  window.scrollTo({top:0, behavior:'instant'});
}
function setMode(mode){
  state.mode = mode;
  if(mode==='portal') state.view = 'portal';
  else state.view = 'dashboard';
  render();
}

// Switches the active tenant ("company"). Demonstrates data isolation live — every
// company-scoped accessor (companyCustomers, companyPallets, etc.) immediately reflects
// only the newly-selected company's data; nothing from the previous company leaks through.
function switchCompany(companyId){
  if(companyId === state.currentCompanyId) return;
  state.currentCompanyId = companyId;
  const firstWh = state.warehouses.find(w=>w.companyId===companyId);
  state.currentWarehouseId = firstWh ? firstWh.id : null;
  const firstCust = state.customers.find(c=>c.companyId===companyId);
  state.portalCustomerId = firstCust ? firstCust.id : null;
  state.selectedPallets = [];
  state.billingSelected = [];
  state.invFilter = {q:'', status:'', customer:''};
  state.reqFilter = '';
  state.locSetupOpen = false;
  state.view = 'dashboard';
  toast(`Switched to ${currentCompany().name}`);
  render();
}

function renderChrome(){
  const compSwitch = $('#companySwitch');
  if(compSwitch){
    // With a single tenant on file, a "Viewing" picker with one option is just clutter — only
    // show it once there's actually something to switch between.
    compSwitch.innerHTML = state.companies.length > 1 ? `
      <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:1px;">Viewing</label>
      <select onchange="switchCompany(this.value)" style="width:auto;min-width:220px;font-weight:600;">
        ${state.companies.map(co=>`<option value="${co.id}" ${co.id===state.currentCompanyId?'selected':''}>${escapeHtml(co.name)}</option>`).join('')}
      </select>
    ` : '';
  }
  const staffTabs = $('#staffTabs');
  if(state.mode === 'staff'){
    staffTabs.style.display='flex';
    staffTabs.innerHTML = STAFF_TABS.map(entry=>{
      if(Array.isArray(entry)){
        const [k,label] = entry;
        return `<button class="${state.view===k?'active':''}" onclick="showView('${k}')">${label}</button>`;
      }
      const isActive = entry.items.some(([k])=>k===state.view) || (entry.relatedViews||[]).includes(state.view);
      return `<details class="tab-group">
        <summary class="${isActive?'active':''}">${entry.label} <span class="caret">▾</span></summary>
        <div class="tab-group-menu">
          ${entry.items.map(([k,label])=>`<button class="${state.view===k?'active':''}" onclick="showView('${k}')">${label}</button>`).join('')}
        </div>
      </details>`;
    }).join('');
  } else {
    staffTabs.style.display='none';
    staffTabs.innerHTML='';
  }
  $('#modeSeg').innerHTML = `
    <button class="${state.mode==='staff'?'active':''}" onclick="setMode('staff')">Staff View</button>
    <button class="${state.mode==='portal'?'active':''}" onclick="setMode('portal')">Customer Portal</button>
  `;
}

function render(){
  renderChrome();
  const main = $('#main');
  let html = '';
  if(state.mode === 'portal'){
    html = renderPortal();
  } else {
    switch(state.view){
      case 'dashboard': html = renderDashboard(); break;
      case 'customers': html = renderCustomers(); break;
      case 'customerDetail': html = renderCustomerDetail(state.viewArg); break;
      case 'feeSchedule': html = renderFeeSchedule(); break;
      case 'inventory': html = renderInventory(); break;
      case 'locations': html = renderLocations(); break;
      case 'lpns': html = renderLPNs(); break;
      case 'shipments': html = renderShipments(); break;
      case 'scan': html = renderScan(); break;
      case 'requests': html = renderRequests(); break;
      case 'expected-inbound': html = renderExpectedInbound(); break;
      case 'expected-outbound': html = renderExpectedOutbound(); break;
      case 'billing': html = renderBilling(); break;
      default: html = renderDashboard();
    }
  }
  main.innerHTML = `
    <div class="demo-banner">
      <span>${dbNS ? '💾 Changes are saved automatically — closing or reopening this page keeps your data.' : (dbLoadAttempted ? '🧪 Working in memory only — this view can\'t reach saved storage, so changes won\'t survive a page reload.' : '🧪 Working prototype — checking for saved data...')}</span>
      <button onclick="resetDemo()">Reset demo data</button>
    </div>
    ${html}
  `;
  afterRenderHooks();
  persistState();
}

let _afterRenderHook = null;
function afterRenderHooks(){
  if(_afterRenderHook){ const fn = _afterRenderHook; _afterRenderHook=null; fn(); }
}

// Text inputs that filter a list live (oninput -> render()) would otherwise lose focus and
// cursor position on every keystroke, since render() replaces #main's innerHTML wholesale —
// forcing the user to click back into the field after each letter. This wraps the state update
// so focus + cursor position are restored to the same input (matched by id) after the re-render.
function liveFilterInput(el, applyFn){
  const pos = el.selectionStart;
  const id = el.id;
  applyFn();
  if(id){
    _afterRenderHook = ()=>{
      const ne = document.getElementById(id);
      if(ne){ ne.focus(); try{ ne.setSelectionRange(pos, pos); }catch(e){} }
    };
  }
  render();
}

/* ---------------------------- Dashboard chart building blocks ----------------------------
   Small, reusable pieces so the dashboard reads as charts rather than raw numbers: a same-ramp
   meter, a horizontal bar-row list, and a donut with a legend. Every mark keeps a permanent,
   always-visible text label (never color-alone), ships a hover/focus tooltip, and — for the two
   multi-category charts — a "Table view" twin, per the dataviz accessibility pass. */

// One shared floating tooltip, positioned off the hovered/focused mark's own bounding box so it
// works identically for mouse and keyboard.
function vizShowTip(evt, label, value){
  const tip = document.getElementById('vizTip');
  if(!tip) return;
  const rect = evt.currentTarget.getBoundingClientRect();
  tip.innerHTML = `<b>${value}</b><span class="sub">${label}</span>`;
  tip.style.left = (rect.left + rect.width/2) + 'px';
  tip.style.top = rect.top + 'px';
  tip.classList.add('show');
}
function vizHideTip(){
  const tip = document.getElementById('vizTip');
  if(tip) tip.classList.remove('show');
}
function toggleVizView(id){
  const wrap = document.getElementById(id);
  if(!wrap) return;
  const nowTable = wrap.classList.toggle('show-table');
  const btn = document.getElementById(id+'-toggle');
  if(btn) btn.textContent = nowTable ? 'Chart view' : 'Table view';
}

// Aggregates this month's estimated revenue into a small fixed set of categories that already
// exist in the billing model (storage, unload/load, per-shipment offload/reload, transportation).
function dashRevenueComposition(period){
  const buckets = { storage:0, loadUnload:0, shipment:0, transport:0 };
  companyCustomers().forEach(c=>{
    computeChargeLines(c.id, period).forEach(l=>{
      if(l.kind==='Storage') buckets.storage += l.amount;
      else if(l.kind==='Unload' || l.kind==='Load') buckets.loadUnload += l.amount;
      else if(l.kind==='Offload' || l.kind==='Reload') buckets.shipment += l.amount;
      else if(l.kind==='Transport') buckets.transport += l.amount;
    });
  });
  return buckets;
}

// Same-ramp meter: fill in the accent, track in the lighter step of the same blue (accent-bg) —
// state reads across the whole bar, not just the filled portion.
function renderVizMeterCard(opts){
  const pct = opts.max>0 ? Math.round(opts.value/opts.max*100) : 0;
  const fillPct = Math.max(0, Math.min(100, pct)); // clamp the bar itself; an over-committed value (e.g. contracts exceeding usable sqft) can still legitimately show >100% in the number
  return `
    <div class="panel viz-card viz-card-meter clickable" role="button" tabindex="0" onclick="${opts.onClick}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${opts.onClick}}">
      <div class="viz-card-head"><h3 class="viz-card-title">${escapeHtml(opts.title)}</h3></div>
      <div class="viz-meter-value">${pct}%</div>
      <div class="viz-meter-track"><div class="viz-meter-fill" style="width:${fillPct}%;${pct>100?'background:#b91c1c;':''}"></div></div>
      <div class="viz-card-sub">${escapeHtml(opts.sub)}</div>
    </div>`;
}

// Horizontal bar-row list. items: [{key,label,value,color,onClick}]. One hue per row when the
// hue itself carries meaning (status); a single accent hue when the rows are just "more/less".
function renderVizBarCard(id, opts){
  const items = opts.items;
  const domain = Math.max(1, ...items.map(i=>i.value));
  const rows = items.map(i=>{
    const pct = Math.round((i.value/domain)*100);
    return `<div class="viz-bar-row" role="button" tabindex="0"
        onclick="${i.onClick}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${i.onClick}}"
        onmouseenter="vizShowTip(event,'${i.label}','${i.value}')" onmouseleave="vizHideTip()"
        onfocus="vizShowTip(event,'${i.label}','${i.value}')" onblur="vizHideTip()">
        <span class="viz-bar-label">${escapeHtml(i.label)}</span>
        <span class="viz-bar-track"><span class="viz-bar-fill" style="width:${pct}%;background:${i.color};"></span></span>
        <span class="viz-bar-value">${i.value}</span>
      </div>`;
  }).join('');
  const table = `<div class="viz-table"><table><thead><tr><th>${escapeHtml(opts.valueColLabel||'Category')}</th><th>Count</th></tr></thead><tbody>
      ${items.map(i=>`<tr><td>${escapeHtml(i.label)}</td><td>${i.value}</td></tr>`).join('')}
    </tbody></table></div>`;
  return `
    <div class="panel viz-card">
      <div class="viz-card-head">
        <h3 class="viz-card-title">${escapeHtml(opts.title)}</h3>
        <button class="viz-toggle-btn" id="${id}-toggle" onclick="toggleVizView('${id}')">Table view</button>
      </div>
      <div class="viz-wrap" id="${id}">
        <div class="viz-visual viz-bars">${rows}</div>
        ${table}
      </div>
      ${opts.sub ? `<div class="viz-card-sub">${escapeHtml(opts.sub)}</div>` : ''}
    </div>`;
}

// Donut with a center total and a legend that doubles as the direct-label channel — every slice
// is labeled by its legend row even where an outside label wouldn't fit.
function renderVizDonutCard(id, opts){
  const items = opts.items.filter(i=>i.value>0);
  const total = items.reduce((s,i)=>s+i.value,0);
  if(!total){
    return `
    <div class="panel viz-card">
      <div class="viz-card-head"><h3 class="viz-card-title">${escapeHtml(opts.title)}</h3></div>
      <div class="viz-empty">No billable activity yet this period.</div>
    </div>`;
  }
  // Box sized with a generous margin beyond the label radius (not just the ring) — a slice
  // whose midpoint lands near the top would otherwise poke its % label above the card.
  const r = 48, cx = 88, cy = 88, strokeW = 18, box = 176;
  const circumference = 2*Math.PI*r;
  const gapDeg = items.length>1 ? 3 : 0;
  let cursor = -90;
  const segs = items.map(i=>{
    const frac = i.value/total;
    const segDeg = frac*360;
    const mid = cursor + segDeg/2;
    const drawDeg = Math.max(segDeg-gapDeg, 0.001);
    const dashLen = (drawDeg/360)*circumference;
    const seg = { ...i, frac, dashLen, rotate:cursor, mid };
    cursor += segDeg;
    return seg;
  });
  const arcs = segs.map(s=>`<circle class="viz-donut-seg" tabindex="0" role="button"
      cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${strokeW}"
      stroke-dasharray="${s.dashLen} ${circumference-s.dashLen}"
      transform="rotate(${s.rotate} ${cx} ${cy})"
      onclick="${s.onClick}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${s.onClick}}"
      onmouseenter="vizShowTip(event,'${s.label}','${fmtMoney(s.value)}')" onmouseleave="vizHideTip()"
      onfocus="vizShowTip(event,'${s.label}','${fmtMoney(s.value)}')" onblur="vizHideTip()"></circle>`).join('');
  const pctLabels = segs.filter(s=>s.frac>=0.07).map(s=>{
    const rad = s.mid*Math.PI/180;
    const lr = r + strokeW/2 + 13;
    const lx = cx + lr*Math.cos(rad), ly = cy + lr*Math.sin(rad);
    const anchor = Math.cos(rad)>0.25 ? 'start' : (Math.cos(rad)<-0.25 ? 'end' : 'middle');
    return `<text class="viz-donut-pct-label" x="${lx}" y="${ly}" text-anchor="${anchor}" dominant-baseline="middle">${Math.round(s.frac*100)}%</text>`;
  }).join('');
  const legend = items.map(i=>`<div class="viz-legend-row" role="button" tabindex="0"
      onclick="${i.onClick}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${i.onClick}}">
      <span class="viz-swatch" style="background:${i.color};"></span>
      <span class="viz-legend-label">${escapeHtml(i.label)}</span>
      <span class="viz-legend-value">${fmtMoney(i.value)}</span>
      <span class="viz-legend-pct">${Math.round(i.value/total*100)}%</span>
    </div>`).join('');
  const table = `<div class="viz-table"><table><thead><tr><th>Category</th><th>Amount</th><th>Share</th></tr></thead><tbody>
      ${items.map(i=>`<tr><td>${escapeHtml(i.label)}</td><td>${fmtMoney(i.value)}</td><td>${Math.round(i.value/total*100)}%</td></tr>`).join('')}
    </tbody></table></div>`;
  return `
    <div class="panel viz-card">
      <div class="viz-card-head">
        <h3 class="viz-card-title">${escapeHtml(opts.title)}</h3>
        <button class="viz-toggle-btn" id="${id}-toggle" onclick="toggleVizView('${id}')">Table view</button>
      </div>
      <div class="viz-wrap" id="${id}">
        <div class="viz-visual viz-donut-wrap">
          <svg class="viz-donut-svg" width="${box/1.4}" height="${box/1.4}" viewBox="0 0 ${box} ${box}">
            ${arcs}
            ${pctLabels}
            <text class="viz-donut-center-value" x="${cx}" y="${cy-3}" text-anchor="middle">${fmtMoney(total)}</text>
            <text class="viz-donut-center-label" x="${cx}" y="${cy+11}" text-anchor="middle">${escapeHtml(opts.centerLabel||'Total')}</text>
          </svg>
          <div class="viz-legend">${legend}</div>
        </div>
        ${table}
      </div>
    </div>`;
}

      ${(()=>{ const usable = companyUsableContractSqft(); if(!usable) return ''; const contracted = companyContractedSqft(); const available = usable - contracted; return renderVizMeterCard({ title:'SF committed to contracts', value:contracted, max:usable, sub:`${contracted.toLocaleString()} of ${usable.toLocaleString()} usable sqft committed · ${available.toLocaleString()} sqft available (usable = ${Math.round(CONTRACT_USABLE_SQFT_PCT*100)}% of physical)`, onClick:"showView('locations')" }); })()}

// Toggles between per-pallet and per-square-foot rate fields in the Add/Edit customer modal.
// The per-trailer shipment fee a new customer's Shipment offload/reload fee defaults to: the
// cross-dock trailer rate for cross-dock billing, the storage account's trailer rate for pallet
// billing — both only when this company has a fee schedule. Sqft and Contract billing (and any
// billing method when there's no fee schedule at all) fall back to a plain $75, since the fee
// schedule has nothing to say about their shipment pricing (see shipmentFeeForCount).
function shipmentFeeDefaultFor(fs, billingMethod){
  if(!fs) return 75;
  if(billingMethod==='crossdock') return fs.crossDockPerTrailer||75;
  if(billingMethod==='pallet') return fs.unloadLoadPerTrailer||75;
  return 75;
}

function toggleCustomerBillingFields(){
  const sel = document.getElementById('fCustBillMethod');
  if(!sel) return;
  const v = sel.value;
  const palletBox = document.getElementById('fCustPalletRateBox');
  const sqftBox = document.getElementById('fCustSqftRateBox');
  const contractBox = document.getElementById('fCustContractBox');
  const crossdockBox = document.getElementById('fCustCrossDockBox');
  const unloadLoadRow = document.getElementById('fCustUnloadLoadRow');
  const shipFeeEditableBox = document.getElementById('fCustShipFeeEditableBox');
  const shipFeeCrossDockNote = document.getElementById('fCustShipFeeCrossDockNote');
  if(palletBox) palletBox.style.display = v==='pallet' ? 'block' : 'none';
  if(sqftBox) sqftBox.style.display = v==='sqft' ? 'block' : 'none';
  if(contractBox) contractBox.style.display = v==='contract' ? 'block' : 'none';
  if(crossdockBox) crossdockBox.style.display = v==='crossdock' ? 'block' : 'none';
  // Cross-dock billing charges its own flat per-pallet fee instead of the usual unload/load
  // fee, so that row is hidden rather than left sitting there unused.
  if(unloadLoadRow) unloadLoadRow.style.display = v==='crossdock' ? 'none' : 'flex';
  // Once a company has a real fee schedule, Cross-Dock and Pallet (storage) billing both get their
  // shipment fee computed automatically instead of typed in per customer: Cross-Dock via its own
  // combined in+out model, Pallet via the fee schedule's storage-account IN/OUT handling mechanism
  // (Section 2, which per the schedule's own note is "not a customer-facing service choice" and
  // applies only to Section 3 pallet-storage accounts — see shipmentFeeForCount). Sqft and Contract
  // billing aren't covered by the fee schedule at all (Contract is its own negotiated agreement;
  // Sqft isn't a pallet-count metric), so they always keep the plain editable dollar fields.
  const showsDynamicNote = (v==='crossdock' || v==='pallet') && !!feeScheduleOrNull();
  if(shipFeeEditableBox) shipFeeEditableBox.style.display = showsDynamicNote ? 'none' : 'block';
  if(shipFeeCrossDockNote) shipFeeCrossDockNote.style.display = showsDynamicNote ? 'block' : 'none';
  const noteCrossDockText = document.getElementById('fCustShipFeeCrossDockNoteText');
  const noteUnloadLoadText = document.getElementById('fCustShipFeeUnloadLoadNoteText');
  if(noteCrossDockText) noteCrossDockText.style.display = v==='crossdock' ? 'block' : 'none';
  if(noteUnloadLoadText) noteUnloadLoadText.style.display = v==='pallet' ? 'block' : 'none';
  if(v==='contract') updateContractAvailabilityHint(sel.dataset.custId || null);
  // Only on the "Add customer" modal (not Edit, which has an existing customer's own saved fees):
  // re-default the shipment offload/reload fields to match the newly-selected billing method's
  // fee-schedule trailer rate, unless staff already typed their own number in.
  const offloadEl = document.getElementById('fCustShipOffload');
  const reloadEl = document.getElementById('fCustShipReload');
  if(offloadEl && reloadEl && !sel.dataset.custId){
    const fs = feeScheduleOrNull();
    const dflt = shipmentFeeDefaultFor(fs, v).toFixed(2);
    if(offloadEl.dataset.touched!=='1') offloadEl.value = dflt;
    if(reloadEl.dataset.touched!=='1') reloadEl.value = dflt;
  }
}

// A "storage contract" customer reserves a fixed block of square footage and pays the flat
// contract fee for it whether they fill it or not — so what matters for deciding whether to sign
// a NEW contract is AVAILABILITY (total sqft minus what's already promised to other contracts),
// never physical UTILIZATION (how full any warehouse happens to be today). A contract is NOT
// pinned to one specific warehouse: pallets vary in size and where they actually end up sitting
// isn't decided in advance, so contracted sqft is tracked against the company's COMBINED
// warehouse capacity (all of this company's warehouses that have a total sqft on file), not any
// single site. A company can be mostly empty and still have zero sqft available if contracts
// already claim all of it — and a customer's own contracted block doesn't shrink just because
// they aren't using all of it day to day.
// Not all of a warehouse's physical square footage can actually be promised to contracts —
// aisles, dock staging, maneuvering room, and general operating space eat into it, so only a
// share of the gross RSF on file is treated as sellable/contractable. 75% is that share; the
// other 25% is reserved for the building to actually function day to day.
const CONTRACT_USABLE_SQFT_PCT = 0.75;
function companyTotalSqft(){
  return companyWarehouses().filter(w=>w.sqft).reduce((sum,w)=> sum + w.sqft, 0);
}
// The portion of that physical total that's actually available to promise to contracts.
function companyUsableContractSqft(){
  return Math.round(companyTotalSqft() * CONTRACT_USABLE_SQFT_PCT);
}
function companyContractedSqft(excludeCustomerId){
  return companyCustomers()
    .filter(c=>c.billingMethod==='contract' && c.id!==excludeCustomerId)
    .reduce((sum,c)=> sum + (c.contractSqft||0), 0);
}
function companyAvailableSqft(excludeCustomerId){
  const usable = companyUsableContractSqft();
  if(!usable) return null;
  return usable - companyContractedSqft(excludeCustomerId);
}
// Live feedback in the Add/Edit customer modal as staff type a requested contract size, so they
// can see whether there's room BEFORE committing to a number — rather than finding out after the
// fact that the company's combined space is already fully committed.
function updateContractAvailabilityHint(excludeCustomerId){
  const sqftInput = document.getElementById('fCustContractSqft');
  const hint = document.getElementById('fCustContractHint');
  if(!sqftInput || !hint) return;
  const total = companyTotalSqft();
  if(!total){ hint.textContent = 'None of ' + currentCompany().name + '\'s warehouses have a total square footage on file, so availability can\'t be checked.'; hint.style.color=''; return; }
  const usable = companyUsableContractSqft();
  const requested = parseFloat(sqftInput.value) || 0;
  const contracted = companyContractedSqft(excludeCustomerId);
  const available = usable - contracted;
  const afterThis = available - requested;
  let msg = `${usable.toLocaleString()} sqft usable for contracts (${Math.round(CONTRACT_USABLE_SQFT_PCT*100)}% of ${total.toLocaleString()} sqft physical across ${escapeHtml(currentCompany().name)}'s warehouses) · ${contracted.toLocaleString()} sqft already under contract · ${available.toLocaleString()} sqft available`;
  if(requested>0) msg += ` · ${afterThis.toLocaleString()} sqft would remain after this contract`;
  hint.textContent = msg;
  hint.style.color = afterThis < 0 ? '#b91c1c' : '';
}

function openCustomerModal(){
  // New customers under a company that has its own fee schedule (see the Fee Schedule tab) are
  // prefilled from it — this only sets what a brand-new customer starts with; it never touches
  // any customer's already-saved rates (e.g. SBA Communications keeps its own numbers as-is).
  const fs = feeScheduleOrNull();
  const dfltRateIn = fs ? fs.floorStoragePerPalletMo : 15.00;
  const dfltUnload = fs ? fs.inOutHandlingPerPallet : 12.00;
  const dfltLoad = fs ? fs.inOutHandlingPerPallet : 12.00;
  // Shipment (grouped multi-pallet load) fees default to the fee schedule's per-trailer rate —
  // the cross-dock trailer rate for cross-dock customers, otherwise the standard load/unload
  // trailer rate — rather than a flat placeholder unrelated to this company's actual rate card.
  const dfltShipFee = shipmentFeeDefaultFor(fs, 'pallet');
  showModal({
    title:'Add customer',
    body:`
      ${fs ? `<p class="muted" style="font-size:12px;">Storage and unload/load rates below are prefilled from ${escapeHtml(currentCompany().name)}'s fee schedule — edit as needed for this customer.</p>` : ''}

      <div class="field">

        <p class="muted" style="font-size:12px;margin-top:-4px;">Charged once per shipment when transportation is included, on top of the offload/reload fee.</p>

    primaryLabel:'Add customer',
    onMount: ()=>{ toggleCustomerBillingFields(); toggleCustomerTransportFields(); },
    onPrimary: ()=>{
      const name = $('#fCustName').value.trim();
      if(!name){ toast('Enter a company name'); return false; }
      const c = {
        id: `${state.currentCompanyId}-${uid('CUST-')}`, companyId: state.currentCompanyId, name,
        contact: $('#fCustContact').value.trim() || '—',
        phone: $('#fCustPhone').value.trim() || '—',
        email: $('#fCustEmail').value.trim() || '—',
        address: $('#fCustAddress').value.trim() || null,
        billingMethod: $('#fCustBillMethod').value || 'pallet',
        rateInside: parseFloat($('#fCustRateIn').value) || dfltRateIn,
        rateOutside: parseFloat($('#fCustRateOut').value) || 9.5,
        rateInsideSqft: parseFloat($('#fCustRateInSqft').value) || 0.6,
        rateOutsideSqft: parseFloat($('#fCustRateOutSqft').value) || 0.4,
        contractSqft: parseFloat($('#fCustContractSqft').value) || 0,
        contractFee: parseFloat($('#fCustContractFee').value) || 0,
        unloadFee: parseFloat($('#fCustUnload').value) || dfltUnload,
        loadFee: parseFloat($('#fCustLoad').value) || dfltLoad,
        shipmentOffloadFee: parseFloat($('#fCustShipOffload').value) || shipmentFeeDefaultFor(fs, $('#fCustBillMethod').value),
        shipmentReloadFee: parseFloat($('#fCustShipReload').value) || shipmentFeeDefaultFor(fs, $('#fCustBillMethod').value),
        transportEnabled: $('#fCustTransport').checked,
        transportInboundFee: parseFloat($('#fCustTransportIn').value) || 150,
        transportOutboundFee: parseFloat($('#fCustTransportOut').value) || 150,
        since: todayISO()
      };
      state.customers.push(c);
      toast('Customer added');
      showView('customerDetail', c.id);
      return true;
    }
  });
}

/* ---------------------------- Inventory ---------------------------- */
function shippableEligible(p){ return p.status === 'in_storage' || p.status === 'pending_pickup'; }

function renderInventory(){
  const f = state.invFilter || {q:'', status:'', customer:'', warehouses:[]};
  const fWarehouses = f.warehouses || [];
  const whs = companyWarehouses();
  const multiWh = whs.length > 1;
  let list = companyPallets().slice();
  if(fWarehouses.length) list = list.filter(p=>fWarehouses.includes(p.warehouseId));
  if(f.status) list = list.filter(p=>p.status===f.status);
  if(f.customer) list = list.filter(p=>p.customerId===f.customer);
  if(f.q){
    const q = f.q.toLowerCase();
    list = list.filter(p=> p.id.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || customerById(p.customerId).name.toLowerCase().includes(q) || (p.jobName && p.jobName.toLowerCase().includes(q)));
  }
  list.sort((a,b)=> (a.status==='shipped')-(b.status==='shipped') || b.receivedDate.localeCompare(a.receivedDate));

  const selected = state.selectedPallets || [];
  const selectedPallets = selected.map(id=>palletById(id)).filter(Boolean);
  const customerIds = new Set(selectedPallets.map(p=>p.customerId));
  const mixedCustomers = customerIds.size > 1;
  const allPendingPutaway = selectedPallets.length>0 && selectedPallets.every(p=>p.status==='pending_putaway');
  const allShippable = selectedPallets.length>0 && selectedPallets.every(p=>shippableEligible(p));

  return `
    <h1 class="page-title">Inventory</h1>
    <p class="page-sub">${companyPallets().filter(p=>p.status!=='shipped').length} active pallets · ${list.length} shown</p>
    ${multiWh ? `
    <div class="wh-tabs" style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px;align-items:center;">
      <span class="muted" style="font-size:12.5px;margin-right:2px;">Warehouse:</span>
      <button class="btn sm ${fWarehouses.length===0?'primary':''}" onclick="clearInvWarehouseFilter()">All warehouses</button>
      ${whs.map(w=>`<button class="btn sm ${fWarehouses.includes(w.id)?'primary':''}" onclick="toggleInvWarehouseFilter('${w.id}')">${escapeHtml(w.name)}</button>`).join('')}
    </div>
    ` : ''}
    <div class="search-bar">
      <input id="invSearchInput" placeholder="Search pallet ID, SKU, customer, or job name..." value="${escapeHtml(f.q)}" oninput="liveFilterInput(this, ()=>{state.invFilter={...(state.invFilter||{}), q:this.value};})">
      <select onchange="state.invFilter={...(state.invFilter||{}), status:this.value}; render();">
        <option value="">All statuses</option>
        <option value="in_storage" ${f.status==='in_storage'?'selected':''}>In Storage</option>
        <option value="pending_putaway" ${f.status==='pending_putaway'?'selected':''}>Pending Putaway</option>
        <option value="pending_pickup" ${f.status==='pending_pickup'?'selected':''}>Pending Pickup</option>
        <option value="shipped" ${f.status==='shipped'?'selected':''}>Shipped</option>
      </select>
      <select onchange="state.invFilter={...(state.invFilter||{}), customer:this.value}; render();">
        <option value="">All customers</option>
        ${companyCustomers().map(c=>`<option value="${c.id}" ${f.customer===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
      </select>
      <button class="btn primary" onclick="showView('scan')">+ Receive pallet</button>
    </div>
    ${selected.length ? `
      <div class="panel" style="background:var(--accent-bg);border-color:#c3d0fb;">
        <div class="panel-body" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;">
          <b>${selected.length} selected</b>
          ${allPendingPutaway ? `
            <div class="btn-row" style="margin-left:auto;">
              <button class="btn sm primary" onclick="openBulkPutawayModal()">Put away selected</button>
              <button class="btn sm" onclick="state.selectedPallets=[]; render();">Clear</button>
            </div>
          ` : allShippable ? `
            ${mixedCustomers ? `<span class="muted" style="font-size:12.5px;">Spans multiple customers — LPNs must be single-customer.</span>` : ''}
            <div class="btn-row" style="margin-left:auto;">
              <button class="btn sm primary" onclick="bulkShipSelected()">Ship selected now</button>
              <button class="btn sm" ${mixedCustomers?'disabled':''} onclick="openAssignLPNModal()">Assign to LPN</button>
              <button class="btn sm" onclick="state.selectedPallets=[]; render();">Clear</button>
            </div>
          ` : `
            <span class="muted" style="font-size:12.5px;">Mixes pallets awaiting putaway with pallets already in storage — select one group at a time.</span>
            <div class="btn-row" style="margin-left:auto;">
              <button class="btn sm" onclick="state.selectedPallets=[]; render();">Clear</button>
            </div>
          `}
        </div>
      </div>
    ` : ''}
    <div class="panel">
      <div class="panel-body table-wrap">
        <table>
          <thead><tr>

}

function toggleSelectPallet(id){
  state.selectedPallets = state.selectedPallets || [];
  if(state.selectedPallets.includes(id)) state.selectedPallets = state.selectedPallets.filter(x=>x!==id);
  else state.selectedPallets.push(id);
  render();
}

// Inventory's warehouse filter is multi-select (unlike the single-warehouse switcher used
// elsewhere, e.g. Locations) since a company running several warehouses may still want to see
// inventory across two or three of them side by side, not lock down to just one at a time.
function toggleInvWarehouseFilter(id){
  const f = state.invFilter || {q:'', status:'', customer:'', warehouses:[]};
  const cur = f.warehouses || [];
  const next = cur.includes(id) ? cur.filter(x=>x!==id) : [...cur, id];
  state.invFilter = {...f, warehouses: next};
  render();
}
function clearInvWarehouseFilter(){
  const f = state.invFilter || {q:'', status:'', customer:'', warehouses:[]};
  state.invFilter = {...f, warehouses: []};
  render();
}

function bulkShipSelected(){
  const ids = (state.selectedPallets || []).filter(id=>{ const p = palletById(id); return p && shippableEligible(p); });
  if(!ids.length) return;
  // Shipping out from Inventory should land the user on the Shipments page afterward (with the
  // shipment they just created open, when there's exactly one) rather than leaving them stranded
  // on Inventory — that's where the BOL and shipment record they just made actually live.
  openShipConfirmModal(ids, { afterShip: ()=>{ state.selectedPallets = []; }, gotoShipments: true });
}

function openPalletRateModal(id){
  const p = palletById(id);
  if(!p) return;
  const cust = customerById(p.customerId);
  showModal({
    title: `Custom rate — ${p.id}`,
    primaryLabel: 'Save rate',
    body: `
      <p class="muted" style="font-size:12.5px;margin-top:0;">Overrides ${escapeHtml(cust.name)}'s default rates for this pallet only. Leave a field blank to use the customer default.</p>
      <div class="field-row">
        <div class="field"><label>Inside rate ($/mo)</label><input id="fPltRateIn" type="number" step="0.25" placeholder="Default ${cust.rateInside}" value="${p.customRateInside!=null?p.customRateInside:''}"></div>
        <div class="field"><label>Outside rate ($/mo)</label><input id="fPltRateOut" type="number" step="0.25" placeholder="Default ${cust.rateOutside}" value="${p.customRateOutside!=null?p.customRateOutside:''}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Unload fee ($)</label><input id="fPltUnload" type="number" step="0.25" placeholder="Default ${cust.unloadFee}" value="${p.customUnloadFee!=null?p.customUnloadFee:''}"></div>
        <div class="field"><label>Load fee ($)</label><input id="fPltLoad" type="number" step="0.25" placeholder="Default ${cust.loadFee}" value="${p.customLoadFee!=null?p.customLoadFee:''}"></div>
      </div>
    `,
    onPrimary: ()=>{
      const toNumOrNull = v => (v===undefined || v===null || v.trim()==='') ? null : Number(v);
      p.customRateInside = toNumOrNull($('#fPltRateIn').value);
      p.customRateOutside = toNumOrNull($('#fPltRateOut').value);
      p.customUnloadFee = toNumOrNull($('#fPltUnload').value);
      p.customLoadFee = toNumOrNull($('#fPltLoad').value);
      // Correct any not-yet-invoiced accessorials for this pallet to reflect the new rate.
      companyAccessorials().forEach(a=>{
        if(a.palletId===p.id && a.invoiceId===null){
          if(a.type==='Unload') a.amount = effUnloadFee(p);
          if(a.type==='Load') a.amount = effLoadFee(p);

function openBulkPutawayModal(){
  const selected = state.selectedPallets || [];
  const pallets = selected.map(id=>palletById(id)).filter(Boolean);
  if(!pallets.length) return;

  // Suggest the next free bins without double-booking the same bin across two pallets in this batch.
  // Scoped per pallet's own warehouse, since selected pallets can span more than one warehouse.
  const usedByWh = {};
  const suggestions = {};
  pallets.forEach(p=>{
    const wid = p.warehouseId || state.currentWarehouseId;
    usedByWh[wid] = usedByWh[wid] || new Set();
    const loc = locationsForWarehouse(wid).find(l=>!l.palletId && !usedByWh[wid].has(l.code));
    suggestions[p.id] = loc ? loc.code : '';
    if(loc) usedByWh[wid].add(loc.code);
  });

  showModal({
    title:`Put away ${pallets.length} pallet${pallets.length===1?'':'s'}`,
    primaryLabel:'Confirm putaway',
    body:`
      <p class="muted" style="font-size:12.5px;margin-top:0;">Suggested locations are pre-filled below — edit any of them before confirming.</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Pallet</th><th>Customer</th><th>Location</th></tr></thead>
          <tbody>
          ${pallets.map(p=>`<tr>
            <td class="mono">${p.id}</td>
            <td>${escapeHtml(customerById(p.customerId).name)}</td>
            <td><input id="putawayLoc-${p.id}" class="mono" value="${suggestions[p.id]}" placeholder="Location code" style="min-width:110px;"></td>
          </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `,
    onPrimary: ()=>{
      // Validate everything first so this is all-or-nothing — no partial putaway from one bad row.
      const plan = [];
      const seenCodes = new Set();
      for(const p of pallets){
        const code = ($(`#putawayLoc-${p.id}`).value || '').trim();
        if(!code){ toast(`Enter a location for ${p.id}`); return false; }
        const loc = locationByCode(code, p.warehouseId);
        if(!loc){ toast(`No such location "${code}" (for ${p.id})`); return false; }
        if(loc.palletId){ toast(`Location ${code} is already occupied (for ${p.id})`); return false; }
        if(seenCodes.has(code)){ toast(`Location ${code} is used more than once in this batch`); return false; }
        seenCodes.add(code);
        plan.push({ p, code });
      }
      plan.forEach(({p,code})=> putawayPalletAt(p, code));
      state.selectedPallets = [];
      toast(`${plan.length} pallet${plan.length===1?'':'s'} put away`);
      render();
      return true;
    }
  });
}

// Creates a brand-new warehouse for the current company with its own independent layout.
// Every warehouse can have a totally different footprint — different aisle counts, different
// inside/outside mix — since a nationwide company's sites rarely match each other physically.

    title: 'Add warehouse',
    body: `
      <div class="field"><label>Warehouse name</label><input id="fWhName" placeholder="e.g. Mesa"></div>
      <div class="field"><label>City</label><input id="fWhCity" placeholder="e.g. Mesa, AZ"></div>

// Reconstructs the grid dimensions for the read-only floor-plan view. Warehouses created or
// edited through the visual setup carry their own .grid; older/never-edited ones fall back to
// whatever extent their (row,col)-tagged locations actually span.
function warehouseGridDims(wh, locs){
  if(wh && wh.grid) return wh.grid;
  if(!locs.length) return { rows:1, cols:1 };
  return { rows: Math.max(...locs.map(l=>l.row||0))+1, cols: Math.max(...locs.map(l=>l.col||0))+1 };
}

function renderLocations(){
  if(state.locSetupOpen) return renderWarehouseSetup();

  const locsAll = locationsForWarehouse();
  const occ = occupiedCount(locsAll);
  const wh = currentWarehouse();
  const dims = warehouseGridDims(wh, locsAll);

  const tileMap = new Map();
  locsAll.forEach(l=>{
    const key = `${l.row||0},${l.col||0}`;
    if(!tileMap.has(key)) tileMap.set(key, []);
    tileMap.get(key).push(l);
  });

  let cellsHtml = '';
  tileMap.forEach((locsHere, key)=>{
    const [r,c] = key.split(',').map(Number);
    const type = locsHere[0].type;
    const isMulti = locsHere.length>1;
    const occupiedHere = locsHere.filter(l=>l.palletId);
    let cls = type==='outside' ? 'floor-outside' : 'floor-inside';
    if(occupiedHere.length===locsHere.length) cls += ' full';
    else if(occupiedHere.length>0) cls += ' partial';
    const label = isMulti ? `${occupiedHere.length}/${locsHere.length}` : (locsHere[0].locNum!=null ? String(locsHere[0].locNum) : '·');
    const title = `${locsHere[0].code} — ${storageTypeLabel(type)}${isMulti?`, ${locsHere.length} slots`:''}`;
    cellsHtml += `<div class="floor-cell ${cls}" style="grid-row:${r+1};grid-column:${c+1};" title="${escapeHtml(title)}" onclick="openTileModal(${r},${c})"><span class="fc-aisle">${escapeHtml(locsHere[0].rack || locsHere[0].aisle)}</span><span class="fc-label">${label}</span></div>`;
  });

  return `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
      <div>
        <h1 class="page-title">Warehouse Locations</h1>
        <p class="page-sub">${wh?escapeHtml(wh.name)+' · ':''}${occ} of ${locsAll.length} bins occupied (${locsAll.length?Math.round(occ/locsAll.length*100):0}%) · this map matches the warehouse's actual floor plan — click a tile to see what's there.</p>
        ${wh && (wh.address || wh.sqft) ? `<p class="page-sub" style="margin-top:2px;">${wh.address?escapeHtml(wh.address):''}${wh.address && wh.sqft?' · ':''}${wh.sqft?wh.sqft.toLocaleString()+' RSF':''}</p>` : ''}
        ${(()=>{ const total = companyTotalSqft(); if(!total) return ''; const usable = companyUsableContractSqft(); const contracted = companyContractedSqft(); const available = usable - contracted; return `<p class="page-sub" style="margin-top:2px;">${contracted.toLocaleString()} of ${usable.toLocaleString()} usable sqft committed to storage contracts across ${escapeHtml(currentCompany().name)}'s warehouses <span class="muted">(usable = ${Math.round(CONTRACT_USABLE_SQFT_PCT*100)}% of ${total.toLocaleString()} sqft physical — the rest is needed for aisles, docks, and general operations)</span> · <b style="color:${available<0?'#b91c1c':'inherit'};">${available.toLocaleString()} sqft available</b> for new contracts <span class="muted">(reserved-space commitments company-wide, not how full this floor looks today)</span></p>`; })()}
      </div>
      <button class="btn" onclick="openWarehouseSetup()">⚙ Edit floor plan</button>
    </div>
    ${warehouseSwitcherHtml()}
    ${locsAll.length ? `<div class="floor-grid view-mode" style="grid-template-columns:repeat(${dims.cols}, 42px); grid-template-rows:repeat(${dims.rows}, 42px);">${cellsHtml}</div>` : `<div class="empty-state"><div class="ic">🗺️</div>No floor plan yet — click "Edit floor plan" to paint one.</div>`}
    <div class="legend">
      <span><span class="sw" style="background:var(--gray-bg);border:1px solid var(--border);"></span>Empty (inside)</span>
      <span><span class="sw" style="background:var(--accent-bg);"></span>Occupied (inside)</span>
      <span><span class="sw" style="background:#fdf3e4;border:1px dashed #d9b876;"></span>Empty (outside)</span>
      <span><span class="sw" style="background:#f7deb0;"></span>Occupied (outside)</span>
    </div>
  `;
}

// A tile can hold one slot (floor-only zones — jumps straight to the familiar put-away/receive
// modal) or several stacked level×spot slots (racked zones — shows a picker first since a 2D
// top-down map can't show verticality directly).
function openTileModal(r, c){
  const locs = locationsForWarehouse().filter(l=>(l.row||0)===r && (l.col||0)===c);
  if(!locs.length) return;
  if(locs.length===1){ openLocationModal(locs[0].code); return; }
  const sorted = locs.slice().sort((a,b)=> a.level-b.level || a.spot-b.spot);
  const isRacked = sorted.some(l=>l.level>1);
  showModal({
    title: `Zone ${sorted[0].rack || sorted[0].aisle} — ${storageTypeLabel(sorted[0].type)}${isRacked?' (racked)':' (floor, multiple spots)'}`,
    primaryLabel:'Close',
    body: `
      <p class="muted" style="font-size:12.5px;margin-top:0;">${sorted.filter(l=>l.palletId).length} of ${sorted.length} slots occupied at this spot. Click a slot to view or put away.</p>
      <div class="table-wrap"><table><thead><tr><th>Location</th><th>Level</th><th>Status</th><th></th></tr></thead><tbody>
        ${sorted.map(l=>{
          const p = l.palletId ? palletById(l.palletId) : null;
          return `<tr>
            <td class="mono">${l.code}</td>
            <td>Level ${l.level}${l.spot>1?' · spot '+l.spotLetter:''}</td>
            <td>${p ? statusBadge(p.status) : '<span class="muted">Empty</span>'}</td>
            <td><button class="link-btn" onclick="closeModal(); openLocationModal('${l.code}');">${p?'View':'Put away / receive'} →</button></td>
          </tr>`;
        }).join('')}
      </tbody></table></div>
    `,
    onPrimary: ()=> true
  });
}

/* ---------------------------- Warehouse Setup (visual floor-plan editor) ---------------------------- */
// state.layoutDraft shape while editing: { rows, cols, zones: [{code,type,floorOnly,levels,spots,cells:[{row,col}]}] }
// state.floorTool: { mode:'paint'|'erase', zoneCode }
function openWarehouseSetup(){
  const wh = currentWarehouse();
  if(wh.grid){
    state.layoutDraft = {
      rows: wh.grid.rows, cols: wh.grid.cols,
      storageMode: wh.storageMode || 'mixed',
      zones: wh.layoutConfig.map(z=>({ ...z, cells: (z.cells||[]).map(c=>({...c})) }))
    };
  } else {
    state.layoutDraft = migrateLegacyLayoutToGrid(wh.layoutConfig);
    state.layoutDraft.storageMode = wh.storageMode || 'mixed';
  }
  state.floorTool = { mode:'paint', zoneCode: state.layoutDraft.zones[0] ? state.layoutDraft.zones[0].code : null };
  state.locSetupOpen = true;
  render();
}
function closeWarehouseSetup(){
  state.locSetupOpen = false;
  render();
}
// Answers "will this warehouse use racking, floor storage only, or both?" up front. Choosing
// a single mode (racking-only / floor-only) simplifies every zone's fields to match; "mixed"
// keeps the full per-zone choice.
function setWarehouseStorageMode(mode){
  state.layoutDraft.storageMode = mode;
  if(mode==='floor'){
    state.layoutDraft.zones.forEach(z=>{ z.floorOnly = true; z.levels = 1; });
  } else if(mode==='racked'){
    state.layoutDraft.zones.forEach(z=>{ z.floorOnly = false; if(!z.levels || parseInt(z.levels)<2) z.levels = 4; });
  }
  render();
}
function nextZoneCode(){
  const used = new Set(state.layoutDraft.zones.map(z=>(z.code||'').toUpperCase()));
  for(let i=1;i<=676;i++){ const c = letterFromIndex(i); if(!used.has(c)) return c; }
  return 'Z';
}
function setFloorTool(mode, zoneCode){
  state.floorTool = { mode, zoneCode: zoneCode || null };
  render();
}
// Paints (or erases) a single grid tile. A tile belongs to at most one zone, so painting
// automatically un-paints it from wherever it was before.
function paintCell(r, c){
  const tool = state.floorTool;
  if(!tool) return;
  state.layoutDraft.zones.forEach(z=>{ z.cells = z.cells.filter(cell=>!(cell.row===r && cell.col===c)); });
  if(tool.mode==='paint' && tool.zoneCode){
    const zone = state.layoutDraft.zones.find(z=>z.code===tool.zoneCode);
    if(zone) zone.cells.push({ row:r, col:c });
  }
  render();
}
function updateGridDims(field, value){
  const v = Math.max(1, Math.min(40, parseInt(value)||1));
  state.layoutDraft[field] = v;
  state.layoutDraft.zones.forEach(z=>{
    z.cells = z.cells.filter(c=> c.row < state.layoutDraft.rows && c.col < state.layoutDraft.cols);
  });
  render();
}
function updateZoneField(idx, field, value){
  state.layoutDraft.zones[idx][field] = value;
  render();
}
function toggleZoneFloorOnly(idx){
  const z = state.layoutDraft.zones[idx];
  z.floorOnly = !z.floorOnly;
  if(z.floorOnly) z.levels = 1;
  else if(!z.levels || parseInt(z.levels)<2) z.levels = 4;
  render();
}
function removeZone(idx){
  if(state.layoutDraft.zones.length<=1){ toast('You need at least one zone'); return; }
  const removedCode = state.layoutDraft.zones[idx].code;
  state.layoutDraft.zones.splice(idx,1);
  if(state.floorTool && state.floorTool.zoneCode===removedCode){
    const first = state.layoutDraft.zones[0];
    state.floorTool = first ? { mode:'paint', zoneCode:first.code } : { mode:'erase', zoneCode:null };
  }
  render();
}
function openAddZoneModal(){
  const suggestedLetter = nextZoneCode();
  const mode = state.layoutDraft.storageMode || 'mixed';
  const letterOptions = Array.from({length:26}, (_,i)=>letterFromIndex(i+1))
    .map(l=>`<option value="${l}" ${l===suggestedLetter?'selected':''}>${l}</option>`).join('');
  showModal({
    title:'New zone',
    body:`
      <div class="field-row">
        <div class="field"><label>Zone letter</label><select id="fZoneLetter">${letterOptions}</select></div>
        <div class="field"><label>Number (optional)</label><input id="fZoneNum" type="number" min="1" placeholder="e.g. 1"></div>
      </div>
      <p class="muted" style="font-size:11.5px;margin-top:-6px;">Leave the number blank for a simple zone like "A", or add one for more zones sharing a letter — e.g. "A1", "A2".</p>
      <div class="field"><label>Storage type</label>
        <select id="fZoneType"><option value="inside">Inside</option><option value="outside">Outside</option></select>
      </div>
      ${mode==='mixed' ? `<div class="field"><label><input type="checkbox" id="fZoneFloorOnly" style="width:auto;" onchange="document.getElementById('zoneLevelsField').style.display=this.checked?'none':'block';"> Floor level only (no racking)</label></div>` : ''}
      <div class="field-row">
        <div class="field" id="zoneLevelsField" style="${mode==='floor'?'display:none;':''}"><label>Levels</label><input id="fZoneLevels" type="number" min="1" value="4"></div>
        <div class="field"><label>Spots per tile</label><input id="fZoneSpots" type="number" min="1" value="1"></div>
      </div>
      <p class="muted" style="font-size:12px;">After creating, click (or click-and-drag) tiles on the floor plan grid below to paint this zone's real footprint.</p>
    `,
    primaryLabel:'Create zone',
    onPrimary: ()=>{
      const letter = $('#fZoneLetter').value;
      const numSuffix = ($('#fZoneNum').value||'').trim().replace(/[^0-9]/g,'');
      const code = letter + numSuffix;
      if(state.layoutDraft.zones.some(z=>z.code===code)){ toast(`Zone "${code}" already exists`); return false; }
      const floorOnly = mode==='floor' ? true : mode==='racked' ? false : $('#fZoneFloorOnly').checked;
      const zone = {
        code, type: $('#fZoneType').value, floorOnly,
        levels: floorOnly ? 1 : (parseInt($('#fZoneLevels').value)||4),
        spots: parseInt($('#fZoneSpots').value)||1,
        cells: []
      };
      state.layoutDraft.zones.push(zone);
      state.floorTool = { mode:'paint', zoneCode: code };
      toast(`Zone ${code} added — click tiles on the grid to paint it`);
      render();
      return true;
    }
  });
}

function renderWarehouseSetup(){
  const draft = state.layoutDraft;
  const tool = state.floorTool || { mode:'erase', zoneCode:null };
  const mode = draft.storageMode || 'mixed';
  const currentPlaced = companyPallets().filter(p=>p.warehouseId===state.currentWarehouseId && p.locationCode).length;
  return `
    <h1 class="page-title">Warehouse Setup — ${currentWarehouse()?escapeHtml(currentWarehouse().name):''}</h1>
    <p class="page-sub">Paint the actual physical layout of this warehouse — define zones below, then click (or click-and-drag) tiles on the floor plan to lay out where each one really sits. Location codes read as RackSectionLevelSpot (e.g. "WA1A" = the W rack, section A, level 1, spot A): the section letter changes as you walk down the aisle (one per tile — A, B, C...), the number changes only when you go up a level, and the spot letter (A or B) only tells apart the two pallets side by side in that same tile. Zones sharing a rack letter (e.g. "W6" and "W7" for a wall spanning two bays) share one continuous aisle, so bay 7's sections just continue where bay 6's left off. This only affects this warehouse — other warehouses are untouched.</p>

    <div class="panel" style="margin-bottom:14px;">
      <div class="panel-body" style="padding:14px 16px;">

        <div class="btn-row">
          <button type="button" class="btn sm ${mode==='racked'?'primary':''}" onclick="setWarehouseStorageMode('racked')">🗄 Racking only</button>
          <button type="button" class="btn sm ${mode==='floor'?'primary':''}" onclick="setWarehouseStorageMode('floor')">▦ Floor storage only</button>
          <button type="button" class="btn sm ${mode==='mixed'?'primary':''}" onclick="setWarehouseStorageMode('mixed')">🔀 Both / mixed</button>
        </div>
      </div>

    <div class="panel">
      <div class="panel-head"><h2>Zones</h2><button class="btn sm" onclick="openAddZoneModal()">+ New zone</button></div>
      <div class="panel-body table-wrap">
        <table>
          <thead><tr><th>Code</th><th>Type</th><th>Storage</th><th>Spots / tile</th><th>Tiles painted</th><th></th></tr></thead>
          <tbody>
          ${draft.zones.map((z,i)=>`<tr>
            <td><input class="setup-input" style="width:56px;" value="${escapeHtml(z.code)}" maxlength="4" oninput="updateZoneField(${i},'code',this.value.toUpperCase())"></td>
            <td>
              <select onchange="updateZoneField(${i},'type',this.value)">
                <option value="inside" ${z.type==='inside'?'selected':''}>Inside</option>
                <option value="outside" ${z.type==='outside'?'selected':''}>Outside</option>
              </select>
            </td>
            <td style="white-space:nowrap;">
              ${mode==='floor' ? `<span class="muted" style="font-size:12px;">Floor storage</span>`
                : mode==='racked' ? `<input class="setup-input" type="number" min="1" value="${z.levels}" style="width:44px;" oninput="updateZoneField(${i},'levels',this.value)"> levels`
                : `<label style="font-size:12px;"><input type="checkbox" style="width:auto;" ${z.floorOnly?'checked':''} onchange="toggleZoneFloorOnly(${i})"> Floor only</label>${z.floorOnly ? '' : ` · <input class="setup-input" type="number" min="1" value="${z.levels}" style="width:44px;" oninput="updateZoneField(${i},'levels',this.value)"> levels`}`}
            </td>
            <td><input class="setup-input" type="number" min="1" value="${z.spots}" style="width:50px;" oninput="updateZoneField(${i},'spots',this.value)"></td>
            <td class="mono">${z.cells.length}</td>
            <td><button class="link-btn" onclick="removeZone(${i})">Remove</button></td>
          </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>

    ${currentPlaced ? `<p class="muted" style="font-size:12.5px;">${currentPlaced} pallets are currently assigned to bins. If a tile's slot no longer exists after regenerating, that pallet is unassigned back to "pending putaway" — it stays in inventory and just needs re-putaway.</p>` : ''}

    <div class="panel" style="margin-top:4px;">
      <div class="panel-head">
        <h2>Floor plan</h2>
        <div class="btn-row">
          <label class="muted" style="font-size:12px;">Rows <input type="number" min="1" max="40" value="${draft.rows}" style="width:52px;" onchange="updateGridDims('rows', this.value)"></label>
          <label class="muted" style="font-size:12px;">Cols <input type="number" min="1" max="40" value="${draft.cols}" style="width:52px;" onchange="updateGridDims('cols', this.value)"></label>
        </div>
      </div>
      <div class="panel-body">
        <div class="btn-row" style="flex-wrap:wrap;margin-bottom:10px;">
          ${draft.zones.map(z=>`<button type="button" class="btn sm ${tool.mode==='paint'&&tool.zoneCode===z.code?'primary':''}" onclick="setFloorTool('paint','${z.code}')">🖌 ${escapeHtml(z.code)}</button>`).join('')}
          <button type="button" class="btn sm ${tool.mode==='erase'?'primary':''}" onclick="setFloorTool('erase')">🧹 Erase</button>

function renderFloorGridCells(draft){
  let html = '';
  for(let r=0;r<draft.rows;r++){
    for(let c=0;c<draft.cols;c++){
      const zone = draft.zones.find(z=>z.cells.some(cell=>cell.row===r && cell.col===c));
      const cls = zone ? `painted ${zone.type==='outside'?'outside':'inside'}` : '';
      const title = zone ? `${zone.code}${zone.floorOnly?' · floor level':' · '+zone.levels+' levels'}` : 'Empty — click to paint';
      html += `<div class="floor-cell ${cls}" style="grid-row:${r+1};grid-column:${c+1};" onmousedown="paintCell(${r},${c})" onmouseenter="if(event.buttons===1) paintCell(${r},${c})" title="${escapeHtml(title)}">${zone?escapeHtml(zone.code):''}</div>`;
    }
  }
  return html;
}

function applyLayoutConfig(){
  const draft = state.layoutDraft;
  const codes = new Set();
  for(const z of draft.zones){
    const code = (z.code||'').trim().toUpperCase();
    if(!code){ toast('Every zone needs a code'); return; }
    if(codes.has(code)){ toast(`Zone code "${code}" is used more than once`); return; }
    codes.add(code);
    z.code = code;
    // Enforce the warehouse's storage mode as the final word, in case a zone was created before a mode switch.
    if(draft.storageMode==='floor') z.floorOnly = true;
    else if(draft.storageMode==='racked') z.floorOnly = false;
    if(z.floorOnly){ z.levels = 1; }
    else {
      const lv = parseInt(z.levels);
      if(!lv || lv<1){ toast(`Zone ${code}: levels must be at least 1`); return; }
      z.levels = lv;
    }
    const sp = parseInt(z.spots);
    if(!sp || sp<1){ toast(`Zone ${code}: spots must be at least 1`); return; }
    z.spots = sp;
  }
  const paintedZones = draft.zones.filter(z=>z.cells.length>0);
  const skippedCount = draft.zones.length - paintedZones.length;
  if(!paintedZones.length){ toast('Paint at least one tile before saving'); return; }

  const wid = state.currentWarehouseId;
  const cid = state.currentCompanyId;
  const newLocations = generateLocationsFromZones(paintedZones).map(l=>({ ...l, companyId: cid, warehouseId: wid }));
  const byCode = new Map(newLocations.map(l=>[l.code,l]));
  let displaced = 0, kept = 0;
  // Only pallets in THIS warehouse are affected — other warehouses and other companies are untouched.
  companyPallets().filter(p=>p.warehouseId===wid).forEach(p=>{
    if(!p.locationCode) return;
    const loc = byCode.get(p.locationCode);
    const loc2 = p.locationCode2 ? byCode.get(p.locationCode2) : null;
    // A double-spot pallet only keeps its bin if BOTH spots survived the regenerated layout —
    // otherwise it goes back to pending putaway rather than sitting half-assigned.
    if(loc && (!p.locationCode2 || loc2)){
      loc.palletId = p.id;
      if(loc2) loc2.palletId = p.id;
      kept++;
    } else{
      state.movements.push({ id: uid('MV-'), companyId: cid, palletId:p.id, type:'Move', ts:new Date().toISOString(), from:palletLocationLabel(p), to:'Dock', user:'staff', note:'Warehouse layout updated' });
      p.status = 'pending_putaway';
      p.locationCode = null;
      p.locationCode2 = null;
      displaced++;
    }
  });
  // Splice out only this warehouse's old locations, keeping every other warehouse/company untouched.
  state.locations = state.locations.filter(l=>l.warehouseId!==wid).concat(newLocations);
  currentWarehouse().grid = { rows: draft.rows, cols: draft.cols };
  currentWarehouse().storageMode = draft.storageMode || 'mixed';
  currentWarehouse().layoutConfig = paintedZones.map(z=>({ ...z, cells: z.cells.map(c=>({...c})) }));
  state.locSetupOpen = false;
  toast(`Layout updated — ${newLocations.length} bins${skippedCount?`, ${skippedCount} empty zone${skippedCount===1?'':'s'} skipped`:''}${displaced? `, ${displaced} pallet${displaced===1?'':'s'} unassigned and need putaway`:''}`);
  render();
}

function openLocationModal(code){
  const loc = locationByCode(code);
  const p = loc.palletId ? palletById(loc.palletId) : null;

  if(p){
    showModal({
      title: `Location ${code}`,
      primaryLabel: 'View pallet in Inventory',
      body: `
        <div class="pallet-preview">
          <div class="pv-row"><span class="k">Pallet</span><span class="mono">${p.id}</span></div>
          <div class="pv-row"><span class="k">Customer</span><span>${escapeHtml(customerById(p.customerId).name)}</span></div>
          <div class="pv-row"><span class="k">Description</span><span>${escapeHtml(p.sku)}</span></div>
          <div class="pv-row"><span class="k">Qty</span><span>${p.qty} ${p.uom}</span></div>
          <div class="pv-row"><span class="k">Received</span><span>${fmtDate(p.receivedDate)}</span></div>
          <div class="pv-row"><span class="k">Storage type</span><span>${storageTypeLabel(loc.type)}</span></div>
          ${p.locationCode2 ? `<div class="pv-row"><span class="k">Full location</span><span class="mono">${palletLocationLabel(p)}</span></div>` : ''}
        </div>
        <div class="btn-row" style="margin-top:4px;">
          <button class="btn" style="flex:1;" onclick="printLabel('${p.id}')">🖨 Print label</button>
          <button class="btn" style="flex:1;" onclick="closeModal(); openPalletModal('${p.id}');">Details / edit rate</button>
        </div>
      `,
      onPrimary: ()=>{ state.invFilter={q:p.id, status:'', customer:''}; showView('inventory'); return true; }
    });
    return;
  }

  // Empty bin: either put away an existing pallet (scanned barcode) into it, or receive a brand-new pallet directly into it.
  if(state.locModalCode !== code){
    state.locModalCode = code;
    state.locModalMode = 'putaway';
    state.locModalBarcode = '';
    state.locModalFound = null;
  }
  const mode = state.locModalMode || 'putaway';
  const tabBtn = (key, label) => `<button type="button" class="btn sm ${mode===key?'primary':''}" style="flex:1;" onclick="state.locModalMode='${key}'; openLocationModal('${code}');">${label}</button>`;

  let body = `<div class="btn-row" style="margin-bottom:14px;">${tabBtn('putaway','📦 Put away existing pallet')}${tabBtn('receive','📥 Receive new pallet')}</div>`;

  if(mode === 'putaway'){
    const found = state.locModalFound;
    body += `
      <div class="field">
        <label>Pallet barcode</label>
        <input id="locModalBarcode" class="scan-input-big" placeholder="Scan or type pallet ID" value="${escapeHtml(state.locModalBarcode||'')}"
          oninput="state.locModalBarcode=this.value;"
          onkeydown="if(event.key==='Enter'){ lookupLocModalPallet('${code}'); }">
      </div>
      <button class="btn" style="width:100%;margin-bottom:10px;" type="button" onclick="lookupLocModalPallet('${code}')">Look up</button>
    `;
    if(found === 'notfound'){
      body += `<div class="empty-state">No pallet found for that barcode.</div>`;
    } else if(found && found.status !== 'pending_putaway'){
      body += `<div class="empty-state">${escapeHtml(found.id)} isn't awaiting putaway (current status: ${statusBadge(found.status)}). Only a pallet that was received without a location yet can be put away here.</div>`;
    } else if(found){
      body += `
        <div class="pallet-preview">
          <div class="pv-row"><span class="k">Pallet</span><span class="mono">${found.id}</span></div>
          <div class="pv-row"><span class="k">Customer</span><span>${escapeHtml(customerById(found.customerId).name)}</span></div>
          <div class="pv-row"><span class="k">Description</span><span>${escapeHtml(found.sku)} · ${found.qty} ${found.uom}</span></div>
        </div>
      `;
    } else {
      body += `<p class="muted" style="font-size:12.5px;">Scan the barcode of a pallet awaiting putaway (created via Receive) to place it in this bin.</p>`;
    }
  } else {
    body += `
      <div class="field">
        <label>Pallet barcode</label>
        <input id="fLocBarcode" placeholder="Scan or type ID">
        <div style="text-align:center;margin-top:6px;"><button class="link-btn" type="button" onclick="document.getElementById('fLocBarcode').value=uid('PLT-');">Generate new ID instead</button></div>
      </div>
      <div class="field">
        <label>Customer</label>
        <select id="fLocCustomer">${companyCustomers().map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}</select>
      </div>
      <div class="field-row">
        <div class="field"><label>Description</label><input id="fLocDesc" placeholder="e.g. Case pack - 24ct" value="Master carton"></div>
        <div class="field"><label>Qty</label><input id="fLocQty" type="number" value="48"></div>
      </div>
      <p class="muted" style="font-size:12px;">An unload fee is charged automatically on receipt.</p>
    `;
  }

  showModal({
    title: `Location ${code} — Empty (${storageTypeLabel(loc.type)})`,
    primaryLabel: mode==='putaway' ? 'Put away here' : 'Receive pallet here',
    body,
    onPrimary: ()=>{
      if(mode === 'putaway'){
        const found = state.locModalFound;
        if(!found || found === 'notfound'){ toast('Scan or enter a pallet barcode first'); return false; }
        if(found.status !== 'pending_putaway'){ toast(`${found.id} isn't awaiting putaway`); return false; }
        const result = putawayPalletAt(found, code);
        if(result.error){ toast(result.error); return false; }
        toast(`${found.id} put away at ${palletLocationLabel(found)}`);
        render();
        return true;
      }
      const barcode = ($('#fLocBarcode').value || uid('PLT-')).trim();
      if(state.pallets.some(x=>x.id===barcode)){ toast(`Pallet ${barcode} already exists`); return false; }
      const customerId = $('#fLocCustomer').value;
      const sku = $('#fLocDesc').value.trim() || 'Unlabeled goods';
      const qty = parseInt($('#fLocQty').value) || 1;
      const result = createReceivedPallet(barcode, customerId, sku, qty, code);
      if(result.error){ toast(result.error); return false; }
      toast(`${barcode} received into ${code}`);
      render();
      closeModal();
      offerPrintLabel(barcode);
      return false;
    }
  });
}

function lookupLocModalPallet(code){
  const el = document.getElementById('locModalBarcode');
  const id = (el ? el.value : (state.locModalBarcode||'')).trim();
  state.locModalBarcode = id;
  const p = id ? palletById(id) : null;
  state.locModalFound = p || (id ? 'notfound' : null);
  openLocationModal(code);
}

/* ---------------------------- Receive / Move / Ship (scan) ---------------------------- */
const SCAN_MODES = [
  ['receive','📥','Receive'], ['putaway','📦','Putaway'], ['move','↔️','Move'], ['ship','🚚','Ship']
];

function setScanMode(m){
  state.scanMode = m;
  state.scanBarcodeVal = '';
  state.scanFound = null;
  state.scanLocVal = '';
  state.shipQueue = [];
  state.shipShipmentDraft = null;
  state.scanLpnFound = null;
  state.recvPrefill = null;
  render();
}

function renderScan(){
  const mode = state.scanMode || 'receive';
  _afterRenderHook = ()=>{
    const el = $('#scanBarcode'); if(el) el.focus();
    // A prefill from Expected Inbound sets select/value attributes directly rather than going
    // through the usual onchange/oninput handlers, so the derived UI (sqft readout, shipment
    // options for the pre-selected customer) needs one manual refresh after the initial paint.
    if(mode==='receive' && state.recvPrefill){ updateReceiveSqft(); refreshShipmentOptions(); }
  };

  let body = '';
  if(mode === 'receive') body = renderReceiveForm();
  else if(mode === 'ship') body = renderShipForm();
  else body = renderLookupForm(mode);

  return `
    <div class="scan-shell">
      <h1 class="page-title" style="text-align:center;">Warehouse Scan</h1>
      <p class="page-sub" style="text-align:center;">Use a handheld scanner (acts as a keyboard) or type a pallet ID, then press Enter.</p>
      <div class="scan-mode-row">
        ${SCAN_MODES.map(([k,ic,label])=>`
          <div class="scan-mode-btn ${mode===k?'active':''}" onclick="setScanMode('${k}')">
            <div class="ic">${ic}</div><div class="lbl">${label}</div>
          </div>`).join('')}
      </div>
      ${body}
    </div>
  `;
}
