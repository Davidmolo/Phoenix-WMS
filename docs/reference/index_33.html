function toggleReceiveFields(){
  const bcEl = document.getElementById('scanBarcode');
  const fs = document.getElementById('recvFieldset');
  const hint = document.getElementById('recvBarcodeHint');
  if(!bcEl || !fs) return;
  const has = bcEl.value.trim().length > 0;
  fs.disabled = !has;
  fs.style.opacity = has ? '1' : '.45';
  if(hint) hint.style.display = has ? 'none' : '';
}

// Live-updates the "Floor square footage" readout in the receive form's dimensions box as
// length/width are typed, using the same calcSqft() the billing math uses.
function updateReceiveSqft(){
  const out = document.getElementById('recvSqftOut');
  if(!out) return;
  const l = document.getElementById('recvDimLength').value;
  const w = document.getElementById('recvDimWidth').value;
  const sqft = calcSqft(l, w);
  const spotsNote = document.getElementById('recvSpotsOut');
  if(spotsNote){
    const n = spotsNeededForDims(l, w);
    spotsNote.textContent = n===1 ? '' : n===2 ? ' · needs 2 adjacent spots' : ` · too big for any bin here (over ${SPOT_SIZE_IN*2}in)`;
  }
  out.textContent = sqft!=null ? `${sqft} sqft` : '—';
  // Dimensions changed after a bin was already picked — that bin may no longer be the right
  // size (or the right size may now be available where it wasn't before), so clear the stale
  // choice and let the user re-pick from the (now correctly sized) list instead of silently
  // submitting a mismatched size.
  const locInput = document.getElementById('recvLoc');
  if(locInput && locInput.value){
    locInput.value = '';
    const list = document.getElementById('recvLocList');
    if(list) list.hidden = true;
  }
}

// When the selected customer bills by square foot, relabel the sqft hint so staff know dimensions
// drive their billing (dimensions themselves stay optional for every other customer).
function refreshDimensionsHint(){
  const custEl = document.getElementById('recvCustomer');
  const cust = custEl && custEl.value ? customerById(custEl.value) : null;
  const hint = document.getElementById('recvDimsHint');
  if(!hint) return;
  const sqftOut = document.getElementById('recvSqftOut');
  const spotsOut = document.getElementById('recvSpotsOut');
  const sqftHtml = `Floor square footage: <b id="recvSqftOut">${sqftOut ? sqftOut.textContent : '—'}</b><span id="recvSpotsOut">${spotsOut ? spotsOut.innerHTML : ''}</span>`;
  if(cust && cust.billingMethod === 'sqft'){
    hint.innerHTML = `<b>${escapeHtml(cust.name)} is billed per square foot</b> — enter this pallet's length &amp; width so storage can be billed correctly. ${sqftHtml}`;
  } else {
    hint.innerHTML = sqftHtml;
  }
}

// Repopulates the inbound-shipment picker with the selected customer's open Inbound shipments
// (direct DOM update, like toggleReceiveFields, so it doesn't wipe other in-progress form fields).
function refreshShipmentOptions(){
  toggleReceiveFields();
  refreshDimensionsHint();
  const sel = document.getElementById('recvShipmentChoice');
  if(!sel) return;
  const custEl = document.getElementById('recvCustomer');
  const custId = custEl ? custEl.value : '';
  const whEl = document.getElementById('recvWarehouse');
  const whId = whEl ? whEl.value : state.currentWarehouseId;
  const openShipments = custId ? companyShipments().filter(s=>s.customerId===custId && s.warehouseId===whId && s.direction==='Inbound' && s.status==='Open') : [];
  const current = sel.value;
  sel.innerHTML = `
    <option value="">No shipment — charge standard unload fee</option>
    <option value="__new__">+ Start a new inbound shipment</option>
    ${openShipments.map(s=>`<option value="${s.id}">${s.id} — ${s.palletIds.length} pallet${s.palletIds.length===1?'':'s'} so far${s.weightLbs?', '+s.weightLbs+' lbs':''}</option>`).join('')}
  `;
  if([...sel.options].some(o=>o.value===current)) sel.value = current;
  toggleShipmentFields();
  refreshTransportBox();
  // Re-default the shipper address to whichever customer is now selected, unless staff already
  // typed something themselves (tracked via data-touched) — matches the initial prefill above,
  // which only knew the right customer when the receive was launched from a request.
  const addrEl = document.getElementById('recvBolAddress');
  if(addrEl && addrEl.dataset.touched !== '1'){
    const cust = custId ? customerById(custId) : null;
    addrEl.value = cust && cust.address ? cust.address : '';
  }
}
function toggleShipmentFields(){
  const sel = document.getElementById('recvShipmentChoice');
  const box = document.getElementById('recvShipmentNewFields');
  if(!sel || !box) return;
  box.style.display = sel.value === '__new__' ? 'block' : 'none';
  if(sel.value === '__new__') updateReceiveShipFeePlaceholder();
}

// Shows the "Include transportation" checkbox only for customers with the transportation add-on
// enabled; hides and resets it otherwise.
function refreshTransportBox(){
  const custEl = document.getElementById('recvCustomer');
  const cust = custEl && custEl.value ? customerById(custEl.value) : null;
  const box = document.getElementById('recvTransportBox');
  if(!box) return;
  const enabled = !!(cust && cust.transportEnabled);
  box.style.display = enabled ? 'block' : 'none';
  if(!enabled){
    const chk = document.getElementById('recvTransportChk');
    if(chk) chk.checked = false;
    const feeBox = document.getElementById('recvTransportFeeBox');
    if(feeBox) feeBox.style.display = 'none';
  }
}
function toggleReceiveTransportFee(){
  const chk = document.getElementById('recvTransportChk');
  const feeBox = document.getElementById('recvTransportFeeBox');
  const feeInput = document.getElementById('recvTransportFee');
  const custEl = document.getElementById('recvCustomer');
  const cust = custEl && custEl.value ? customerById(custEl.value) : null;
  if(!chk || !feeBox) return;
  feeBox.style.display = chk.checked ? 'block' : 'none';
  if(chk.checked && feeInput && cust) feeInput.placeholder = `Default ($${cust.transportInboundFee})`;
}

// Shared toggles for the Bill of Lading fields that appear (with matching id prefixes) in every
// BOL-collecting form: the "Bill to" box only matters when freight charges are Third Party, and
// the emergency contact phone is only required once a shipment is flagged as hazmat — DOT 49 CFR
// 172.604 requires that 24-hr contact on the shipping papers whenever hazmat is checked.
function toggleBolBillTo(prefix){
  const sel = document.getElementById(prefix+'FreightTerms');
  const box = document.getElementById(prefix+'BillToBox');
  if(!sel || !box) return;
  box.style.display = sel.value === 'Third Party' ? 'block' : 'none';
}
function toggleBolHazmat(prefix){
  const chk = document.getElementById(prefix+'Hazmat');
  const box = document.getElementById(prefix+'HazmatBox');
  if(!chk || !box) return;
  box.style.display = chk.checked ? 'block' : 'none';
}

// Shows what the offload fee will default to if left blank. Once the company has a fee schedule,
// equipment type doesn't drive the price for Cross-Dock or Pallet-storage customers — the
// three-tier structure does (see shipmentFeeForCount): Cross-Dock bills ONE combined fee covering
// both directions (the eventual Reload leg is free); a pallet-storage account bills this intake
// leg independently from its eventual pickup leg (Section 2 of the fee schedule — explicitly not a
// customer-facing choice, it's just how a storage account's movements get billed). Sqft- and
// Contract-billed customers aren't covered by the fee schedule at all, so they fall to their own
// flat blanket rate, same as when there's no fee schedule set up — and equipment type only ever
// drives the price as the old shortcut (Crane $300, Hoist $200, everything else $75) when there's
// no fee schedule at all.
function updateReceiveShipFeePlaceholder(){
  const feeEl = document.getElementById('recvShipFee');
  const hintEl = document.getElementById('recvShipFeeHint');
  const equipEl = document.getElementById('recvEquipment');
  const custEl = document.getElementById('recvCustomer');
  const fullTrailerBox = document.getElementById('recvShipFullTrailerBox');
  const fullTrailerChk = document.getElementById('recvShipFullTrailer');
  if(!feeEl) return;
  const equipment = equipEl ? equipEl.value : '';
  const cust = custEl && custEl.value ? customerById(custEl.value) : null;
  const fs = cust ? feeScheduleFor(cust.companyId) : null;
  const isDynamicBilling = cust && fs && (cust.billingMethod==='crossdock' || cust.billingMethod==='pallet');
  if(fullTrailerBox) fullTrailerBox.style.display = isDynamicBilling ? 'block' : 'none';
  let amount, source;
  if(isDynamicBilling){
    const isXD = cust.billingMethod === 'crossdock';
    const fullTrailer = fullTrailerChk ? fullTrailerChk.checked : false;
    amount = shipmentFeeForCount(cust, 'Inbound', fullTrailer, 1);
    const perPallet = isXD ? fs.crossDockPerPallet : fs.unloadLoadPerPallet;
    const minimum = isXD ? fs.crossDockMinimum : fs.unloadLoadMinimum;
    const cap = isXD ? fs.crossDockPerTrailer : fs.unloadLoadPerTrailer;
    const comboNote = isXD ? ' — covers shipping it back out too' : ' (shipping it back out later is billed separately)';
    source = fullTrailer
      ? `${currentCompany().name}'s full-trailer rate${comboNote}`
      : `$${perPallet}/pallet as they're added (${fmtMoney(minimum)} minimum, capped at ${fmtMoney(cap)} past ${Math.ceil(cap/perPallet)} pallets${comboNote})`;
  } else if(equipment){
    amount = equipmentDefaultFee(equipment); source = `${equipment} default`;
  } else {
    amount = cust ? cust.shipmentOffloadFee : DEFAULT_EQUIPMENT_FEE;
    source = cust ? `${cust.name}'s default` : 'default';
  }
  feeEl.placeholder = `Default ($${Number(amount).toFixed(2)})`;
  if(hintEl) hintEl.textContent = `Leave blank to charge ${source}: $${Number(amount).toFixed(2)}.`;
}

function fillSuggestedLocation(type){
  const loc = firstFreeLocation(type);
  const el = $('#recvLoc');
  if(!loc){ toast(`No empty ${type} bins available`); return; }
  el.value = loc.code;
}

function fillScanLocSuggested(type){
  const loc = firstFreeLocation(type);
  const el = $('#scanLoc');
  if(!loc){ toast(`No empty ${type} bins available`); return; }
  el.value = loc.code;
  state.scanLocVal = loc.code;
}

// Live "Put away at" location picker: clicking or typing in the field lists every currently
// empty bin in this warehouse, filtered by whatever's typed and — when a pallet's dimensions
// call for it — sized to fit: a pallet whose long side is over 48in needs 2 adjacent spots
// (spotsNeeded===2), so only bins with a free paired partner are offered, shown as one
// "double" entry rather than two separate single spots.
// Deliberately built with direct DOM writes instead of the app's usual render() cycle: these
// inputs live inside longer forms (Receive, Scan > Putaway) alongside sibling fields that
// aren't tracked in `state` — a full render() on every keystroke here would wipe out whatever
// the user already typed into those other fields.
function locPickerMatches(query, warehouseId, spotsNeeded){
  const q = (query||'').trim().toLowerCase();
  const free = locationsForWarehouse(warehouseId).filter(l=>!l.palletId);
  let results;
  if(spotsNeeded === 2){
    const seen = new Set();
    results = [];
    free.forEach(l=>{
      if(seen.has(l.code)) return;
      const partner = partnerSpotLocation(l, warehouseId);
      if(!partner || partner.palletId) return;
      seen.add(l.code); seen.add(partner.code);
      const [first, second] = [l, partner].sort((a,b)=>a.spot-b.spot);
      results.push({ ...first, partnerCode: second.code, isPair: true });
    });
  } else {
    results = free.map(l=>({ ...l }));
  }
  if(q) results = results.filter(l=> l.code.toLowerCase().includes(q) || (l.partnerCode && l.partnerCode.toLowerCase().includes(q)));
  return results.sort((a,b)=> (a.type===b.type?0:(a.type==='inside'?-1:1)) || a.code.localeCompare(b.code));
}

function renderLocPicker(inputId, listId, warehouseId, spotsNeeded){
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  if(!input || !list) return;
  if(spotsNeeded === null){
    list.innerHTML = `<div class="loc-picker-empty">This pallet's footprint is bigger than any bin here (over ${SPOT_SIZE_IN*2}in on its long side) — it'll need to be received to the dock and placed manually.</div>`;
    list.hidden = false;
    return;
  }
  const query = input.value.trim();
  const matches = locPickerMatches(query, warehouseId, spotsNeeded).slice(0, 60);
  list.innerHTML = matches.length
    ? matches.map(l=>{
        const label = l.isPair ? `${l.code} + ${l.partnerCode}` : l.code;
        const meta = l.isPair ? `${storageTypeLabel(l.type)} · 2 spots (${SPOT_SIZE_IN*2}x${SPOT_SIZE_IN})` : storageTypeLabel(l.type);
        return `<div class="loc-picker-item" onmousedown="event.preventDefault(); pickLocPickerItem('${inputId}','${listId}','${l.code}')"><span class="code">${escapeHtml(label)}</span><span class="meta">${escapeHtml(meta)}</span></div>`;
      }).join('')
    : `<div class="loc-picker-empty">No ${spotsNeeded===2?'open double-spot bins':'empty bins'}${query?` match "${escapeHtml(query)}"`:''} in this warehouse.</div>`;
  list.hidden = false;
}

// Shared by the Scan > Receive form and the Locations tab's "receive into this bin" quick-add.
// locationCode may be null/empty to receive to the dock without assigning a bin yet.
// shipmentId, if given, groups this pallet into an inbound shipment (which carries its own single
// flat offload fee) instead of charging the standard per-pallet unload fee.
// dims, if given ({length, width} in inches), records the pallet's floor footprint and drives
// square-foot billing for customers whose billingMethod is 'sqft'.
function createReceivedPallet(barcode, customerId, sku, qty, locationCode, rateOverride, shipmentId, dims, equipment, weightLbs, jobName){
  let status = 'pending_putaway';
  const companyId = state.currentCompanyId, warehouseId = state.currentWarehouseId;
  const dm = dims || {};
  let loc = null, partnerLoc = null;
  if(locationCode){
    loc = locationByCode(locationCode, warehouseId);
    if(!loc) return { error: `No such location "${locationCode}"` };
    if(loc.palletId) return { error: `Location ${locationCode} is already occupied` };
    const spotsNeeded = spotsNeededForDims(dm.length, dm.width);
    if(spotsNeeded === 2){
      partnerLoc = partnerSpotLocation(loc, warehouseId);
      if(!partnerLoc || partnerLoc.palletId) return { error: `Location ${locationCode} doesn't have a free adjacent spot for this oversized pallet` };
    }
    status = 'in_storage';
  }
  const ro = rateOverride || {};
  const toNumOrNull = v => (v===undefined || v===null || v==='') ? null : Number(v);
  const pallet = {
    id:barcode, companyId, warehouseId, customerId, sku, uom:'ea', qty, receivedDate: todayISO(), status, locationCode:null, locationCode2:null, shippedDate:null, lpnId:null, notes:'',
    jobName: (jobName && jobName.trim()) ? jobName.trim() : null,
    shipmentId: shipmentId || null,
    equipment: equipment || null,
    weightLbs: toNumOrNull(weightLbs),
    dimLength: toNumOrNull(dm.length),
    dimWidth: toNumOrNull(dm.width),
    sqft: calcSqft(dm.length, dm.width),
    customRateInside: toNumOrNull(ro.rateInside),
    customRateOutside: toNumOrNull(ro.rateOutside),
    customUnloadFee: toNumOrNull(ro.unloadFee),
    customLoadFee: toNumOrNull(ro.loadFee),
    // Workflow override: null means "bill per the customer's default billing method" (the normal
    // case). A cross-dock pallet that lingers past free dwell can be converted, on the customer's
    // request, to Monthly Storage billing — see convertPalletsToStorage(). workflowConvertedDate
    // marks where cross-dock overage billing stops and Monthly Storage billing picks up.
    workflowOverride: null,
    workflowConvertedDate: null,
  };
  if(loc) occupyPalletLocation(pallet, loc, partnerLoc);
  state.pallets.push(pallet);
  state.movements.push({ id: uid('MV-'), companyId, palletId:barcode, type:'Receive', ts:new Date().toISOString(), from:null, to: pallet.locationCode||'Dock', user:'staff' });
  if(pallet.locationCode) state.movements.push({ id: uid('MV-'), companyId, palletId:barcode, type:'Putaway', ts:new Date().toISOString(), from:'Dock', to:palletLocationLabel(pallet), user:'staff' });
  if(shipmentId) addPalletToShipment(shipmentId, barcode);
  else chargeAccessorial(pallet, 'Unload');
  return { pallet };
}

// Required fields for a receipt, full stop: customer (Name), Description, Qty, and Type of offload
// (equipment). Everything else — location, dimensions, weight, shipment attachment, custom rate —
// is optional. All of these live directly on this one page; opening the shipment or custom-rate
// boxes never navigates away or hides the required fields above.
function submitReceive(){
  const barcode = ($('#scanBarcode').value || '').trim();
  if(!barcode){ toast('Scan or enter a pallet barcode first'); return; }
  if(state.pallets.some(p=>p.id===barcode)){ toast(`Pallet ${barcode} already exists`); return; }
  const customerId = $('#recvCustomer').value;
  if(!customerId){ toast('Select a customer'); return; }
  const sku = $('#recvDesc').value.trim();
  if(!sku){ toast('Enter a description'); return; }
  const jobName = document.getElementById('recvJobName') ? document.getElementById('recvJobName').value.trim() : '';
  const qtyRaw = $('#recvQty').value.trim();
  const qty = parseInt(qtyRaw);
  if(!qtyRaw || !Number.isFinite(qty) || qty <= 0){ toast('Enter a valid quantity'); return; }
  const equipment = $('#recvEquipment').value;
  if(!equipment){ toast('Select the type of offload'); return; }
  const locCode = $('#recvLoc').value.trim();
  const weightLbs = document.getElementById('recvWeight') ? document.getElementById('recvWeight').value.trim() : '';
  const dims = {
    length: document.getElementById('recvDimLength') ? document.getElementById('recvDimLength').value.trim() : '',
    width: document.getElementById('recvDimWidth') ? document.getElementById('recvDimWidth').value.trim() : '',
  };
  const rateOverride = {
    rateInside: $('#recvRateIn').value.trim(),
    rateOutside: $('#recvRateOut').value.trim(),
    unloadFee: $('#recvUnloadOverride').value.trim(),
    loadFee: $('#recvLoadOverride').value.trim(),
  };
  const shipChoiceEl = document.getElementById('recvShipmentChoice');
  const shipChoice = shipChoiceEl ? shipChoiceEl.value : '';
  let shipmentId = null, shipmentMsg = '';
  if(shipChoice === '__new__'){
    const transportChk = document.getElementById('recvTransportChk');
    const hazmatChk = document.getElementById('recvBolHazmat');
    const isHazmat = hazmatChk ? hazmatChk.checked : false;
    const hazmatPhone = document.getElementById('recvBolHazmatPhone') ? document.getElementById('recvBolHazmatPhone').value.trim() : '';
    if(isHazmat && !hazmatPhone){ toast('Enter a 24-hr emergency contact phone for this hazmat shipment'); return; }
    const fullTrailerChk = document.getElementById('recvShipFullTrailer');
    const shipment = createShipment(customerId, 'Inbound', {
      weightLbs: $('#recvShipWeight').value.trim(),
      equipment,
      fullTrailer: fullTrailerChk ? fullTrailerChk.checked : false,
      initialPalletCount: 1,
      dimLength: dims.length,
      dimWidth: dims.width,
      fee: $('#recvShipFee').value.trim(),
      bol: {
        bolNumber: $('#recvBolNumber').value,
        carrier: $('#recvBolCarrier').value,
        scac: $('#recvBolScac').value,
        driverName: $('#recvBolDriver').value,
        truckNumber: $('#recvBolTruck').value,
        poNumber: $('#recvBolPO').value,
        notes: $('#recvBolNotes').value,
        address: $('#recvBolAddress').value,
        jobName,
        freightTerms: $('#recvBolFreightTerms').value,
        billTo: $('#recvBolBillTo').value,
        freightClass: $('#recvBolFreightClass').value,
        hazmat: isHazmat,
        hazmatPhone,
      },
      transportation: transportChk ? transportChk.checked : false,
      transportFee: $('#recvTransportFee') ? $('#recvTransportFee').value.trim() : ''
    });
    shipmentId = shipment.id;
    learnCustomerAddress(customerId, $('#recvBolAddress').value);
    const transportMsg = shipment.transportation ? ` + transportation fee ${fmtMoney(shipment.transportFee)}` : '';
    shipmentMsg = ` · new shipment ${shipment.id} — offload fee ${fmtMoney(shipment.fee)}${transportMsg} charged`;
  } else if(shipChoice){
    shipmentId = shipChoice;
    shipmentMsg = ` · added to shipment ${shipChoice}`;
  }
  const result = createReceivedPallet(barcode, customerId, sku, qty, locCode || null, rateOverride, shipmentId, dims, equipment, weightLbs, jobName);
  if(result.error){ toast(result.error); return; }
  const pallet = result.pallet;
  // If this receive was driven from Expected Inbound, the request that prompted it is now
  // fulfilled — link the two records and close the request out automatically, the same way
  // shipFromRequest() does for the outbound side.
  let requestMsg = '';
  if(state.recvPrefill && state.recvPrefill.requestId){
    const req = companyRequests().find(x=>x.id===state.recvPrefill.requestId);
    if(req){
      req.receivedPalletIds = req.receivedPalletIds || [];
      req.receivedPalletIds.push(pallet.id);
      pallet.sourceRequestId = req.id;
      const count = req.palletCount || 1;
      if(req.receivedPalletIds.length >= count){
        req.linkedPalletId = pallet.id;
        req.status = 'Completed';
        req.dateResolved = todayISO();
        requestMsg = ` · request ${req.id} completed`;
      } else {
        requestMsg = ` · request ${req.id}: ${req.receivedPalletIds.length} of ${count} pallets received`;
      }
    }
  }
  const feeMsg = shipmentId ? shipmentMsg : ` · unload fee ${fmtMoney(effUnloadFee(pallet))} charged`;
  const sqftMsg = pallet.sqft ? ` · ${pallet.sqft} sqft` : '';
  const weightMsg = pallet.weightLbs ? ` · ${pallet.weightLbs} lbs` : '';
  toast(`${barcode} received${pallet.locationCode? ' → '+palletLocationLabel(pallet) : ' (awaiting putaway)'}${weightMsg}${sqftMsg}${feeMsg}${requestMsg}`);
  setScanMode('receive');
  offerPrintLabel(barcode);
}

function lookupPallet(mode){
  const id = ($('#scanBarcode').value||'').trim();
  const p = palletById(id);
  if(!p){ toast(`No pallet found for "${id}"`); state.scanFound=null; render(); return; }
  state.scanFound = p;
  state.scanLocVal = '';
  render();
}

// Lets staff click a pallet straight from the "awaiting putaway" list instead of scanning/typing its barcode.
function selectPalletForPutaway(id){
  const p = palletById(id);
  if(!p) return;
  state.scanFound = p;
  state.scanBarcodeVal = id;
  state.scanLocVal = '';
  render();
}

// Shared by the Scan > Putaway flow, Inventory's bulk "Put away selected", and the quick tile-click
// putaway modal. locationCode is always the pallet's PRIMARY spot; if the pallet's own recorded
// dims call for 2 spots (spotsNeededForDims), the adjacent partner spot is found and booked too.
function putawayPalletAt(p, locationCode){
  const loc = locationByCode(locationCode, p.warehouseId);
  if(!loc) return { error: `No such location "${locationCode}"` };
  if(loc.palletId) return { error: `Location ${locationCode} is already occupied` };
  const spotsNeeded = spotsNeededForDims(p.dimLength, p.dimWidth);
  let partnerLoc = null;
  if(spotsNeeded === 2){
    partnerLoc = partnerSpotLocation(loc, p.warehouseId);
    if(!partnerLoc || partnerLoc.palletId) return { error: `Location ${locationCode} doesn't have a free adjacent spot for this oversized pallet` };
  }
  occupyPalletLocation(p, loc, partnerLoc);
  p.status = 'in_storage';
  state.movements.push({ id: uid('MV-'), companyId: p.companyId, palletId:p.id, type:'Putaway', ts:new Date().toISOString(), from:'Dock', to:palletLocationLabel(p), user:'staff' });
  return { ok:true };
}

function confirmPutaway(){
  const p = state.scanFound;
  const locCode = ($('#scanLoc').value||'').trim();
  const result = putawayPalletAt(p, locCode);
  if(result.error){ toast(result.error); return; }
  toast(`${p.id} put away at ${palletLocationLabel(p)}`);
  setScanMode('putaway');
}

function confirmMove(){
  const p = state.scanFound;
  const locCode = ($('#scanLoc').value||'').trim();
  const loc = locationByCode(locCode, p.warehouseId);
  if(!loc){ toast(`No such location "${locCode}"`); return; }
  if(loc.palletId){ toast(`Location ${locCode} is already occupied`); return; }
  const spotsNeeded = spotsNeededForDims(p.dimLength, p.dimWidth);
  let partnerLoc = null;
  if(spotsNeeded === 2){
    partnerLoc = partnerSpotLocation(loc, p.warehouseId);
    if(!partnerLoc || partnerLoc.palletId){ toast(`Location ${locCode} doesn't have a free adjacent spot for this oversized pallet`); return; }
  }
  const from = palletLocationLabel(p);
  releasePalletLocation(p, p.warehouseId);
  occupyPalletLocation(p, loc, partnerLoc);
  state.movements.push({ id: uid('MV-'), companyId: p.companyId, palletId:p.id, type:'Move', ts:new Date().toISOString(), from, to:palletLocationLabel(p), user:'staff' });
  toast(`${p.id} moved to ${palletLocationLabel(p)}`);
  setScanMode('move');
}

                <option value="" ${draft.choice===''?'selected':''}>No shipment — charge standard load fee per pallet</option>
                <option value="__new__" ${draft.choice==='__new__'?'selected':''}>+ Start a new outbound shipment</option>
                ${openShipments.map(s=>`<option value="${s.id}" ${draft.choice===s.id?'selected':''}>${s.id} — ${s.palletIds.length} pallet${s.palletIds.length===1?'':'s'} so far</option>`).join('')}
              </select>
            </div>
            ${draft.choice==='__new__' ? (()=>{
              const custForDraft = customerById(custId);
              const defaultAmount = draft.equipment ? equipmentDefaultFee(draft.equipment) : custForDraft.shipmentReloadFee;
              const defaultSource = draft.equipment ? `${draft.equipment} default` : `${custForDraft.name}'s default`;
              const draftSqft = calcSqft(draft.dimLength, draft.dimWidth);
              const inboundDefaults = deriveOutboundDefaults(queue.map(p=>p.id));
              const prefilled = inboundDefaults.weightLbs!=null || inboundDefaults.equipment;
              const bolPrefilled = inboundDefaults.jobName || inboundDefaults.poNumber || inboundDefaults.address || (custForDraft && custForDraft.address);
              return `
              ${prefilled ? `<div class="muted" style="font-size:12px;margin-bottom:6px;">Weight and equipment below are prefilled from what these pallets were received with — feel free to adjust.${inboundDefaults.mixedEquipment ? ' (Pallets were received with different equipment types; defaulting to the most common.)' : ''}</div>` : ''}
              <div class="field-row">
                <div class="field"><label>Weight (lbs)</label><input value="${escapeHtml(draft.weightLbs||'')}" type="number" placeholder="e.g. 4200" oninput="state.shipShipmentDraft.weightLbs=this.value; state.shipShipmentDraft.weightTouched=true;"></div>
                <div class="field"><label>Equipment used *</label>
                  <select onchange="state.shipShipmentDraft.equipment=this.value; state.shipShipmentDraft.equipmentTouched=true; render();">
                    <option value="">Select…</option>
                    ${EQUIPMENT_TYPES.map(e=>`<option value="${e}" ${draft.equipment===e?'selected':''}>${e}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div class="field-row">
                <div class="field"><label>Length (in)</label><input id="shipDimLength" value="${escapeHtml(draft.dimLength||'')}" type="number" step="0.5" placeholder="e.g. 96" oninput="updateShipDraftSqft()"></div>
                <div class="field"><label>Width (in)</label><input id="shipDimWidth" value="${escapeHtml(draft.dimWidth||'')}" type="number" step="0.5" placeholder="e.g. 48" oninput="updateShipDraftSqft()"></div>
              </div>
              <div class="muted" style="font-size:12.5px;">Floor square footage: <b id="shipSqftOut">${draftSqft!=null?draftSqft+' sqft':'—'}</b></div>
              <div class="field"><label>Reload fee ($)</label><input value="${escapeHtml(draft.fee||'')}" type="number" step="0.25" placeholder="Default ($${defaultAmount})" oninput="state.shipShipmentDraft.fee=this.value"></div>
              <div class="muted" style="font-size:12px;margin-top:-6px;">Leave blank to charge the ${defaultSource}: $${defaultAmount}.</div>
              <p class="muted" style="font-size:11.5px;margin-top:6px;">* Equipment is required for every shipment in this prototype; dimensions are optional. Per-customer requirements can be customized later.</p>
              <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
                <div class="muted" style="font-size:12px;margin-bottom:8px;">Bill of lading — always generated for this shipment, even if left blank, so there's paperwork to cover the load whether or not the carrier brings their own.${bolPrefilled ? ' Job name, PO/reference #, and address below are prefilled from this customer\'s file and these pallets\' receiving/request records — feel free to adjust.' : ''}</div>
                <div class="field-row">
                  <div class="field"><label>BOL number</label><input value="${escapeHtml(draft.bolNumber||'')}" placeholder="Auto-generated if left blank" oninput="state.shipShipmentDraft.bolNumber=this.value"></div>
                  <div class="field"><label>Carrier</label><input value="${escapeHtml(draft.carrier||'')}" placeholder="e.g. XPO Logistics" oninput="state.shipShipmentDraft.carrier=this.value"></div>
                </div>
                <div class="field"><label>Job name <span class="muted" style="font-weight:400;">(optional)</span></label><input value="${escapeHtml(draft.jobName||'')}" placeholder="e.g. Fall reset - Store 214" oninput="state.shipShipmentDraft.jobName=this.value; state.shipShipmentDraft.jobNameTouched=true;"></div>
                <div class="field-row">
                  <div class="field"><label>SCAC <span class="muted" style="font-weight:400;">(optional)</span></label><input value="${escapeHtml(draft.scac||'')}" placeholder="e.g. SWFT" maxlength="4" style="text-transform:uppercase;" oninput="state.shipShipmentDraft.scac=this.value"></div>
                  <div class="field">
                    <label>Freight charge terms</label>
                    <select onchange="state.shipShipmentDraft.freightTerms=this.value; render();">
                      <option value="Prepaid" ${draft.freightTerms!=='Collect' && draft.freightTerms!=='Third Party'?'selected':''}>Prepaid</option>
                      <option value="Collect" ${draft.freightTerms==='Collect'?'selected':''}>Collect</option>
                      <option value="Third Party" ${draft.freightTerms==='Third Party'?'selected':''}>Third Party</option>
                    </select>
                  </div>
                </div>
                ${draft.freightTerms==='Third Party' ? `
                  <div class="field"><label>Bill freight charges to</label><input value="${escapeHtml(draft.billTo||'')}" placeholder="Company name &amp; address" oninput="state.shipShipmentDraft.billTo=this.value"></div>
                ` : ''}
                <div class="field-row">
                  <div class="field"><label>Driver name</label><input value="${escapeHtml(draft.driverName||'')}" oninput="state.shipShipmentDraft.driverName=this.value"></div>
                  <div class="field"><label>Truck/trailer #</label><input value="${escapeHtml(draft.truckNumber||'')}" oninput="state.shipShipmentDraft.truckNumber=this.value"></div>
                </div>
                <div class="field"><label>Freight class (NMFC) <span class="muted" style="font-weight:400;">(optional)</span></label><select onchange="state.shipShipmentDraft.freightClass=this.value;">${freightClassOptionsHtml(draft.freightClass||'')}</select></div>
                <div class="field"><label>Consignee / delivery address <span class="muted" style="font-weight:400;">(where this shipment is going)</span></label><textarea rows="2" placeholder="Street, City, State, ZIP" oninput="state.shipShipmentDraft.address=this.value; state.shipShipmentDraft.addressTouched=true;">${escapeHtml(draft.address||'')}</textarea></div>
                <div class="field"><label>PO/reference #</label><input value="${escapeHtml(draft.poNumber||'')}" oninput="state.shipShipmentDraft.poNumber=this.value; state.shipShipmentDraft.poNumberTouched=true;"></div>
                <div class="field"><label>Notes</label><input value="${escapeHtml(draft.bolNotes||'')}" oninput="state.shipShipmentDraft.bolNotes=this.value"></div>
                <div style="margin-top:6px;">
                  <label style="display:flex;align-items:center;gap:8px;font-weight:400;">
                    <input type="checkbox" ${draft.hazmat?'checked':''} onchange="state.shipShipmentDraft.hazmat=this.checked; render();">
                    Contains hazardous materials (DOT)
                  </label>
                  ${draft.hazmat ? `
                    <div class="field" style="margin-top:6px;"><label>24-hr emergency contact phone *</label><input value="${escapeHtml(draft.hazmatPhone||'')}" placeholder="Required for hazmat shipments" oninput="state.shipShipmentDraft.hazmatPhone=this.value"></div>
                  ` : ''}
                </div>
              </div>
              ${custForDraft.transportEnabled ? `
                <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
                  <label style="display:flex;align-items:center;gap:8px;font-weight:500;font-size:13.5px;">
                    <input type="checkbox" ${draft.transportation?'checked':''} onchange="state.shipShipmentDraft.transportation=this.checked; render();">
                    Include transportation fee for this shipment
                  </label>
                  ${draft.transportation ? `
                    <div class="field" style="margin-top:8px;"><label>Transportation fee ($)</label><input value="${escapeHtml(draft.transportFee||'')}" type="number" step="0.25" placeholder="Default ($${custForDraft.transportOutboundFee})" oninput="state.shipShipmentDraft.transportFee=this.value"></div>
                  ` : ''}
                </div>
              ` : ''}
            `; })() : ''}
          </div>
        `;
      } else if(customerIds.length > 1){
        shipmentSection = `<div class="muted" style="font-size:12px;margin:10px 0;">⚠️ Multiple customers in this queue — shipment grouping isn't available; each pallet will be charged its standard load fee individually.</div>`;
      }
    }
    lower = `
      ${queue.length ? `
        <div class="table-wrap" style="margin:10px 0;"><table><tbody>
          ${queue.map(p=>`<tr>
            <td class="mono">${p.id}</td>
            <td>${escapeHtml(customerById(p.customerId).name)}</td>
            <td class="mono">${palletLocationLabel(p)||'—'}</td>
            <td><button class="link-btn" onclick="removeFromShipQueue('${p.id}')">Remove</button></td>
          </tr>`).join('')}
        </tbody></table></div>
        ${shipmentSection}
        <button class="btn primary lg" style="width:100%;" onclick="confirmShipQueue()">Confirm ship all (${queue.length})</button>
      ` : `<div class="empty-state">Scan pallets one at a time to build a shipment — or scan an LPN barcode to ship its entire contents at once.</div>`}
    `;
  }

  return `
    <div class="scan-card">
      <div class="field">
        <label>Scan pallet or LPN to ship</label>
        <input id="scanBarcode" class="scan-input-big" placeholder="Scan or type ID" value="${escapeHtml(state.scanBarcodeVal||'')}"
          onkeydown="if(event.key==='Enter'){ scanForShip(); }"
          oninput="state.scanBarcodeVal=this.value">
      </div>
      <button class="btn" style="width:100%;margin-bottom:6px;" onclick="scanForShip()">Add</button>
      ${lower}
    </div>
  `;
}

function scanForShip(){
  const id = ($('#scanBarcode').value||'').trim();
  if(!id){ return; }
  const lpn = lpnById(id);
  if(lpn){
    state.scanLpnFound = lpn;
    state.scanBarcodeVal = '';
    render();
    return;
  }
  const p = palletById(id);
  if(!p){ toast(`No pallet or LPN found for "${id}"`); return; }
  if(p.status === 'shipped'){ toast(`${p.id} has already shipped`); return; }
  if(p.status === 'pending_putaway'){ toast(`${p.id} hasn't been put away yet — can't ship from the dock`); return; }
  state.shipQueue = state.shipQueue || [];
  if(state.shipQueue.includes(p.id)){ toast(`${p.id} is already in the queue`); }
  else { state.shipQueue.push(p.id); }
  state.scanBarcodeVal = '';
  render();
}
// Live-updates the outbound ship queue's "Floor square footage" readout, and keeps the raw values
// in state.shipShipmentDraft (direct DOM update, no render(), so keystrokes aren't disrupted).
function updateShipDraftSqft(){
  const lEl = document.getElementById('shipDimLength'), wEl = document.getElementById('shipDimWidth');
  const out = document.getElementById('shipSqftOut');
  if(!lEl || !wEl) return;
  state.shipShipmentDraft.dimLength = lEl.value;
  state.shipShipmentDraft.dimWidth = wEl.value;
  const sqft = calcSqft(lEl.value, wEl.value);
  if(out) out.textContent = sqft!=null ? `${sqft} sqft` : '—';
}

function removeFromShipQueue(id){
  state.shipQueue = (state.shipQueue||[]).filter(x=>x!==id);
  render();
}
// Every outbound ship path funnels through here unless a formal shipment was already chosen/created
// inline (the Ship tab's "start a new shipment" and "join existing shipment" flows). Shipping is
// never allowed to happen with zero information — a type of load is always required so the correct
// fee (and, if applicable, transportation) can be charged.
function confirmShipQueue(){
  const ids = state.shipQueue || [];
  if(!ids.length) return;
  const draft = state.shipShipmentDraft || {};
  const pallets = ids.map(id=>palletById(id)).filter(Boolean);
  const customerIds = [...new Set(pallets.map(p=>p.customerId))];
  if(customerIds.length === 1 && draft.choice === '__new__'){
    if(!draft.equipment){ toast('Select the type of offload used for this shipment'); return; }
    if(draft.hazmat && !(draft.hazmatPhone||'').trim()){ toast('Enter a 24-hr emergency contact phone for this hazmat shipment'); return; }
    const shipment = createShipment(customerIds[0], 'Outbound', {
      weightLbs: draft.weightLbs, equipment: draft.equipment, dimLength: draft.dimLength, dimWidth: draft.dimWidth, fee: draft.fee,
      bol: {
        bolNumber: draft.bolNumber, carrier: draft.carrier, scac: draft.scac, driverName: draft.driverName,
        truckNumber: draft.truckNumber, poNumber: draft.poNumber, notes: draft.bolNotes, address: draft.address, jobName: draft.jobName,
        freightTerms: draft.freightTerms, billTo: draft.billTo, freightClass: draft.freightClass, hazmat: !!draft.hazmat, hazmatPhone: draft.hazmatPhone,
      },
      transportation: !!draft.transportation, transportFee: draft.transportFee
    });
    learnCustomerAddress(customerIds[0], draft.address);
    let count = 0;
    ids.forEach(id=>{ const p = palletById(id); if(p && shipPalletCore(p, shipment.id)) count++; });
    const transportMsg = shipment.transportation ? ` + transportation fee ${fmtMoney(shipment.transportFee)}` : '';
    toast(`${count} pallet${count===1?'':'s'} shipped · new shipment ${shipment.id} — reload fee ${fmtMoney(shipment.fee)}${transportMsg} charged`);
    setScanMode('ship');
    return;
  }
  if(customerIds.length === 1 && draft.choice && draft.choice !== '__new__'){
    let count = 0;
    ids.forEach(id=>{ const p = palletById(id); if(p && shipPalletCore(p, draft.choice)) count++; });
    toast(`${count} pallet${count===1?'':'s'} shipped · added to shipment ${draft.choice}`);
    setScanMode('ship');
    return;
  }
  // No shipment selected (or pallets span multiple customers) — require the type of load (and
  // optionally weight/BOL/transportation) before anything ships.
  openShipConfirmModal(ids, { afterShip: ()=>{ setScanMode('ship'); } });
}
function confirmShipLPN(){
  const lpn = state.scanLpnFound;
  if(!lpn) return;
  const ids = lpn.palletIds.filter(id=>{ const p = palletById(id); return p && p.status !== 'shipped'; });
  if(!ids.length){ toast('This LPN has already shipped in full.'); return; }
  openShipConfirmModal(ids, {
    afterShip: ()=>{
      lpn.status = 'Shipped';
      lpn.shippedDate = todayISO();
      setScanMode('ship');
    }
  });
}

// Shared confirmation modal for every outbound ship path that hasn't already collected shipment
// info inline (bulk-ship from Inventory, "ship entire LPN", and the Ship tab queue when no formal
// shipment was chosen). Requires the type of load (equipment) so the correct fee is always charged;
// weight, Bill of Lading, and the transportation add-on are all optional. Pallets are grouped and
// billed per customer — one real Shipment record is created per customer represented.
function openShipConfirmModal(palletIds, opts){
  opts = opts || {};
  const pallets = palletIds.map(id=>palletById(id)).filter(Boolean);
  if(!pallets.length) return;
  const groups = {};
  pallets.forEach(p=>{ (groups[p.customerId] = groups[p.customerId] || []).push(p.id); });
  const customerIds = Object.keys(groups);
  const anyTransportEnabled = customerIds.some(cid=>{ const c = customerById(cid); return c && c.transportEnabled; });
  // Prefill weight/equipment from what these pallets were received with, so staff shipping them
  // back out don't have to re-enter physical details already on file.
  const inboundDefaults = deriveOutboundDefaults(palletIds);
  const prefilled = inboundDefaults.weightLbs!=null || inboundDefaults.equipment;
  // Address only auto-fills when every pallet belongs to the same customer — with multiple
  // customers sharing this one BOL-info form, a single address can't correctly represent all of
  // them, so that field is left blank for staff to fill in per the note above.
  const defaultAddress = customerIds.length===1
    ? (inboundDefaults.address || (customerById(customerIds[0]) && customerById(customerIds[0]).address) || '')
    : '';
  const bolPrefilled = inboundDefaults.jobName || inboundDefaults.poNumber || defaultAddress;
  // Only Cross-Dock and Pallet (storage) billing get a fee-schedule-driven shipment fee — Sqft and
  // Contract customers aren't covered by the fee schedule at all (see shipmentFeeForCount), so they
  // don't factor into either check below.
  const anyPalletDynamic = customerIds.some(cid=>{ const c = customerById(cid); return c && feeScheduleFor(c.companyId) && c.billingMethod==='pallet'; });
  const anyCrossDock = customerIds.some(cid=>{ const c = customerById(cid); return c && c.billingMethod==='crossdock'; });
  // updateShipConfirmFeeHint (a global onchange handler, not a closure over this call) needs the
  // per-customer pallet counts to preview the three-tier fee — stashed here for it to read.
  _shipConfirmGroups = groups;
  showModal({
    title: `Confirm shipment — ${pallets.length} pallet${pallets.length===1?'':'s'}${customerIds.length>1?` · ${customerIds.length} customers`:''}`,
    primaryLabel: 'Ship & charge',
    body: `
      <div class="muted" style="font-size:12.5px;margin-bottom:10px;">Enter the type of load-out so the correct fee can be charged.${customerIds.length>1?' Pallets span multiple customers — each is billed separately using the info below.':''}</div>
      ${prefilled ? `<div class="muted" style="font-size:12px;margin-bottom:8px;">Weight and equipment below are prefilled from what these pallets were received with — feel free to adjust.${inboundDefaults.mixedEquipment ? ' (Pallets were received with different equipment types; defaulting to the most common.)' : ''}</div>` : ''}
      <div class="field">
        <label>Type of load *</label>
        <select id="shipConfirmEquipment" onchange="updateShipConfirmFeeHint()">
          <option value="">Select…</option>
          ${EQUIPMENT_TYPES.map(e=>`<option value="${e}" ${inboundDefaults.equipment===e?'selected':''}>${e}</option>`).join('')}
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label>Weight (lbs)</label><input id="shipConfirmWeight" type="number" placeholder="e.g. 4200" value="${inboundDefaults.weightLbs!=null?inboundDefaults.weightLbs:''}"></div>
        <div class="field"><label>Fee override ($)</label><input id="shipConfirmFee" type="number" step="0.25" placeholder="Default"></div>
      </div>
      ${anyCrossDock ? `
      <div class="muted" style="font-size:12px;margin-bottom:6px;">Cross-Dock customer(s) here already paid the combined handling fee at receiving — this outbound leg is free unless you type a fee override above.</div>` : ''}
      ${anyPalletDynamic ? `
      <div style="margin-bottom:6px;">
        <label style="display:flex;align-items:center;gap:8px;font-weight:400;">
          <input type="checkbox" id="shipConfirmFullTrailer" onchange="updateShipConfirmFeeHint()" style="width:auto;">
          Full trailer / simple transfer — bill pallet-storage customer(s) the flat per-trailer rate instead of per pallet
        </label>
      </div>` : ''}
      <div id="shipConfirmFeeHint" class="muted" style="font-size:12px;margin-top:-6px;">Select a type of load to see the default fee.</div>
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
        <div class="muted" style="font-size:12px;margin-bottom:8px;"><b>Bill of lading</b> — a BOL is always generated for this shipment, even if these fields are left blank, so there's paperwork to cover the load whether or not the carrier brings their own.${bolPrefilled ? ' Job name, PO/reference #, and address below are prefilled from these pallets\' receiving/request records and the customer\'s file — feel free to adjust.' : ''}</div>
        <div class="field-row">
          <div class="field"><label>BOL number</label><input id="shipConfirmBolNumber" placeholder="Auto-generated if left blank"></div>
          <div class="field"><label>Carrier</label><input id="shipConfirmCarrier" placeholder="e.g. Swift Freight"></div>
        </div>
        <div class="field"><label>Job name <span class="muted" style="font-weight:400;">(optional)</span></label><input id="shipConfirmJobName" placeholder="e.g. Fall reset - Store 214" value="${escapeHtml(inboundDefaults.jobName||'')}"></div>
        <div class="field-row">
          <div class="field"><label>SCAC <span class="muted" style="font-weight:400;">(optional)</span></label><input id="shipConfirmScac" placeholder="e.g. SWFT" maxlength="4" style="text-transform:uppercase;"></div>
          <div class="field">
            <label>Freight charge terms</label>
            <select id="shipConfirmFreightTerms" onchange="toggleBolBillTo('shipConfirm')">
              <option value="Prepaid" selected>Prepaid</option>
              <option value="Collect">Collect</option>
              <option value="Third Party">Third Party</option>
            </select>
          </div>
        </div>
        <div id="shipConfirmBillToBox" style="display:none;">
          <div class="field"><label>Bill freight charges to</label><input id="shipConfirmBillTo" placeholder="Company name &amp; address"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Driver name</label><input id="shipConfirmDriver" placeholder="Optional"></div>
          <div class="field"><label>Truck / trailer #</label><input id="shipConfirmTruck" placeholder="Optional"></div>
        </div>
        <div class="field"><label>Freight class (NMFC) <span class="muted" style="font-weight:400;">(optional)</span></label><select id="shipConfirmFreightClass">${freightClassOptionsHtml('')}</select></div>
        <div class="field"><label>Consignee / delivery address <span class="muted" style="font-weight:400;">(where this shipment is going)</span></label><textarea id="shipConfirmAddress" rows="2" placeholder="Street, City, State, ZIP">${escapeHtml(defaultAddress)}</textarea></div>
        <div class="field"><label>PO / reference #</label><input id="shipConfirmPO" placeholder="Optional" value="${escapeHtml(inboundDefaults.poNumber||'')}"></div>
        <div class="field"><label>Notes</label><input id="shipConfirmNotes" placeholder="Optional"></div>
        <div style="margin-top:6px;">
          <label style="display:flex;align-items:center;gap:8px;font-weight:400;">
            <input type="checkbox" id="shipConfirmHazmat" onchange="toggleBolHazmat('shipConfirm')" style="width:auto;">
            Contains hazardous materials (DOT)
          </label>
          <div id="shipConfirmHazmatBox" style="display:none;margin-top:6px;">
            <div class="field"><label>24-hr emergency contact phone *</label><input id="shipConfirmHazmatPhone" placeholder="Required for hazmat shipments"></div>
          </div>
        </div>
      </div>
      ${anyTransportEnabled ? `
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
          <label style="display:flex;align-items:center;gap:8px;font-weight:500;font-size:13.5px;">
            <input type="checkbox" id="shipConfirmTransportChk" onchange="toggleShipConfirmTransportFee()" style="width:auto;">
            Include transportation fee for this shipment
          </label>
          <div id="shipConfirmTransportFeeBox" style="display:none;margin-top:8px;">
            <div class="field"><label>Transportation fee ($)</label><input id="shipConfirmTransportFee" type="number" step="0.25" placeholder="Default"></div>
          </div>
          ${customerIds.length>1 ? `<div class="muted" style="font-size:11.5px;margin-top:6px;">Only applied to customers with the transportation add-on enabled.</div>` : ''}
        </div>
      ` : ''}
    `,
    onPrimary: ()=>{
      const equipment = document.getElementById('shipConfirmEquipment').value;
      if(!equipment){ toast('Select the type of load'); return false; }
      const weightLbs = document.getElementById('shipConfirmWeight').value.trim();
      const feeOverride = document.getElementById('shipConfirmFee').value.trim();
      const hazmatChk = document.getElementById('shipConfirmHazmat');
      const isHazmat = hazmatChk ? hazmatChk.checked : false;
      const hazmatPhone = document.getElementById('shipConfirmHazmatPhone') ? document.getElementById('shipConfirmHazmatPhone').value.trim() : '';
      if(isHazmat && !hazmatPhone){ toast('Enter a 24-hr emergency contact phone for this hazmat shipment'); return false; }
      const bol = {
        bolNumber: document.getElementById('shipConfirmBolNumber').value,
        carrier: document.getElementById('shipConfirmCarrier').value,
        scac: document.getElementById('shipConfirmScac').value,
        driverName: document.getElementById('shipConfirmDriver').value,
        truckNumber: document.getElementById('shipConfirmTruck').value,
        poNumber: document.getElementById('shipConfirmPO').value,
        notes: document.getElementById('shipConfirmNotes').value,
        address: document.getElementById('shipConfirmAddress').value,
        jobName: document.getElementById('shipConfirmJobName').value,
        freightTerms: document.getElementById('shipConfirmFreightTerms').value,
        billTo: document.getElementById('shipConfirmBillTo').value,
        freightClass: document.getElementById('shipConfirmFreightClass').value,
        hazmat: isHazmat,
        hazmatPhone,
      };
      // Only one customer's worth of pallets share this one address field with confidence — with
      // several customers grouped into this same confirm screen, the typed address can't be
      // safely attributed to any single one of them, so nothing gets learned in that case.
      if(customerIds.length === 1) learnCustomerAddress(customerIds[0], bol.address);
      const transportChk = document.getElementById('shipConfirmTransportChk');
      const transportFeeEl = document.getElementById('shipConfirmTransportFee');
      const fullTrailerChk = document.getElementById('shipConfirmFullTrailer');
      const fullTrailer = fullTrailerChk ? fullTrailerChk.checked : false;
      let totalCount = 0;
      const shipmentIds = [];
      customerIds.forEach(custId=>{
        const cust = customerById(custId);
        const wantsTransport = !!(transportChk && transportChk.checked && cust.transportEnabled);
        const shipment = createShipment(custId, 'Outbound', {
          weightLbs, equipment, fee: feeOverride, bol,
          fullTrailer, initialPalletCount: groups[custId].length,
          transportation: wantsTransport,
          transportFee: transportFeeEl ? transportFeeEl.value.trim() : ''
        });
        shipmentIds.push(shipment.id);
        groups[custId].forEach(pid=>{ const p = palletById(pid); if(p && shipPalletCore(p, shipment.id)) totalCount++; });
      });
      toast(`${totalCount} pallet${totalCount===1?'':'s'} shipped · ${shipmentIds.length>1 ? shipmentIds.length+' shipments created' : 'shipment '+shipmentIds[0]+' created'}`);
      if(opts.afterShip) opts.afterShip(totalCount, shipmentIds);
      if(opts.gotoShipments){
        showView('shipments');
        if(shipmentIds.length === 1){
          // Take them straight to the shipment they just created (BOL, fee, everything) instead
          // of just the list. Return false so the modal framework's own auto-close (which fires
          // right after onPrimary returns) doesn't wipe out this new modal we just opened.
          openShipmentModal(shipmentIds[0]);
          return false;
        }
        return true;
      }
      render();
      return true;
    },
    onMount: ()=>{ updateShipConfirmFeeHint(); }
  });
}
// See the stash comment in openShipConfirmModal — this is a global onchange handler, not a
// closure, so it reads the current confirm modal's per-customer pallet groups from here.
let _shipConfirmGroups = null;
function updateShipConfirmFeeHint(){
  const eqEl = document.getElementById('shipConfirmEquipment');
  const hintEl = document.getElementById('shipConfirmFeeHint');
  const fullTrailerChk = document.getElementById('shipConfirmFullTrailer');
  if(!eqEl || !hintEl) return;
  const groups = _shipConfirmGroups || {};
  const customerIds = Object.keys(groups);
  const fullTrailer = fullTrailerChk ? fullTrailerChk.checked : false;
  // Four buckets, matching shipmentFeeForCount: Cross-Dock (fee schedule, always free outbound —
  // already paid at receiving), Pallet-storage (fee schedule, priced live off the intake/pickup
  // tiered formula — Section 2, not a customer choice), static (Sqft/Contract with a fee schedule,
  // or ANY billing method once there's no fee schedule at all — both just use the customer's own
  // blanket rate; a fee schedule that exists never falls back to the equipment shortcut, only its
  // total absence does).
  const crossDockIds = customerIds.filter(cid=>{ const c = customerById(cid); return c && feeScheduleFor(c.companyId) && c.billingMethod==='crossdock'; });
  const palletIds = customerIds.filter(cid=>{ const c = customerById(cid); return c && feeScheduleFor(c.companyId) && c.billingMethod==='pallet'; });
  const noFsIds = customerIds.filter(cid=>{ const c = customerById(cid); return c && !feeScheduleFor(c.companyId); });
  const staticIds = customerIds.filter(cid=>!crossDockIds.includes(cid) && !palletIds.includes(cid) && !noFsIds.includes(cid));
  const parts = [];
  if(crossDockIds.length){
    parts.push(`Cross-Dock customer(s) here already paid the combined handling fee at receiving — this leg is free for them`);
  }
  if(palletIds.length===1){
    const cid = palletIds[0];
    const cust = customerById(cid);
    const fs = feeScheduleFor(cust.companyId);
    const count = (groups[cid]||[]).length;
    const fee = shipmentFeeForCount(cust, 'Outbound', fullTrailer, count);
    const detail = fullTrailer ? 'the full-trailer rate' : `${fmtMoney(fs.unloadLoadPerPallet)}/pallet for ${count} pallet${count===1?'':'s'} (${fmtMoney(fs.unloadLoadMinimum)} min, ${fmtMoney(fs.unloadLoadPerTrailer)} cap)`;
    parts.push(`${escapeHtml(cust.name)} (storage) defaults to ${fmtMoney(fee)} — ${detail}`);
  } else if(palletIds.length>1){
    parts.push(`pallet-storage customer(s) here are priced per their own fee schedule (per-pallet, with a minimum and a full-trailer cap) unless overridden above`);
  }
  if(staticIds.length){
    parts.push(staticIds.length===1 ? `${escapeHtml(customerById(staticIds[0]).name)} defaults to their own rate` : `other customer(s) here default to their own rate`);
  }
  if(noFsIds.length){
    const eqVal = eqEl.value;
    if(eqVal){
      parts.push(noFsIds.length===1 ? `${escapeHtml(customerById(noFsIds[0]).name)} defaults to the ${eqVal} rate: ${fmtMoney(equipmentDefaultFee(eqVal))}` : `remaining customer(s) default to the ${eqVal} rate: ${fmtMoney(equipmentDefaultFee(eqVal))}`);
    } else if(noFsIds.length===1){
      parts.push(`${escapeHtml(customerById(noFsIds[0]).name)} defaults to their own rate`);
    } else {
      parts.push(`select a type of load to see the default fee for the rest`);
    }
  }
  hintEl.textContent = parts.length ? `Leave the fee blank to charge: ${parts.join('; ')}.` : 'Select a type of load to see the default fee.';
}
function toggleShipConfirmTransportFee(){
  const chk = document.getElementById('shipConfirmTransportChk');
  const box = document.getElementById('shipConfirmTransportFeeBox');
  if(!chk || !box) return;
  box.style.display = chk.checked ? 'block' : 'none';
}

// A company's fee schedule lives on the company record, keyed off whatever company a given
// pallet belongs to — not necessarily the CURRENTLY SELECTED company — so billing math (which can
// run for any customer's pallets) always reads the right one.
function feeScheduleFor(companyId){ const co = state.companies.find(c=>c.id===companyId); return co ? normalizeFeeSchedule(co.feeSchedule) : null; }

// A grouped shipment's one-time handling fee is a three-tier structure: a flat minimum for a
// small load, straight per-pallet through the middle range, and a flat per-trailer cap once
// per-pallet math would otherwise cost more than a full trailer — recalculated as pallets are
// actually scanned into the shipment (see addPalletToShipment). A manual "full trailer / simple
// transfer" flag skips straight to the flat rate for genuinely uncountable freight.
//
// Two different rate sets apply, and — per the fee schedule's own Section 2 note and its Workflow
// Guide (Section 5) — they are NOT a "Cross-Dock vs. everyone else" split. Section 2's tiered rate
// is explicitly "not a customer-facing service choice": it's the WMS billing mechanism behind
// Workflow 3 (Monthly Storage, non-contract) ONLY, billing that storage account's intake (IN) and
// eventual pickup (OUT) independently. It never applies to Cross-Dock (Workflow 1/2 bundle their
// own combined fee) and it never applies to a Sqft- or Contract-billed customer either — those
// aren't Section 3 pallet-based storage accounts at all, so the fee schedule has nothing to say
// about their shipment fee; they keep their own customer-level blanket rate instead.
// - Cross-Dock (Section 1: $25/pallet, $150 minimum, $425/trailer cap — break-even at 6 pallets)
//   bills ONE combined fee at receiving covering the whole in-and-out movement (Workflow 1: "$25/
//   pallet flat, in + out") — exactly like the existing per-pallet cross-dock fee already includes
//   the load-out at no extra charge (see chargeAccessorial's Load-skip below). The Outbound/Reload
//   leg is never separately charged for Cross-Dock.
// - Pallet-billed storage customers (Section 2's mechanism, feeding Section 3's "In/Out handling"
//   line — Workflow 3 only: $14/pallet, $125 minimum, $200/trailer cap — break-even at 9 and 15
//   pallets) bill the intake and pickup movements INDEPENDENTLY — each leg gets its own fee,
//   computed the same way, with no combining and no free leg.
// - Sqft- and Contract-billed customers fall outside this fee schedule entirely (Contract is its
//   own separately-negotiated Workflow 4 agreement; Sqft isn't a pallet-count metric at all) — they
//   always use their own editable blanket shipmentOffloadFee/shipmentReloadFee.
function tieredShipmentFee(perPalletRate, minimum, trailerCap, palletCount){
  const n = Math.max(palletCount||0, 1);
  return Math.min(Math.max(n * perPalletRate, minimum), trailerCap);
}
function shipmentFeeForCount(cust, direction, fullTrailer, palletCount){
  const blanketDefault = direction === 'Inbound' ? cust.shipmentOffloadFee : cust.shipmentReloadFee;
  const fs = feeScheduleFor(cust.companyId);
  if(!fs) return blanketDefault;
  if(cust.billingMethod === 'crossdock'){
    if(direction === 'Outbound') return 0;
    if(fullTrailer) return fs.crossDockPerTrailer;
    return tieredShipmentFee(fs.crossDockPerPallet, fs.crossDockMinimum, fs.crossDockPerTrailer, palletCount);
  }
  if(cust.billingMethod !== 'pallet') return blanketDefault;
  if(fullTrailer) return fs.unloadLoadPerTrailer;
  return tieredShipmentFee(fs.unloadLoadPerPallet, fs.unloadLoadMinimum, fs.unloadLoadPerTrailer, palletCount);
}

// Workflow conversion — Cross-Dock Overage never auto-converts to Monthly Storage (per the fee
// schedule's terms); it only happens here, on a customer's proactive request, staff-triggered.
// A pallet is eligible once it's actually a cross-dock customer's pallet, still on hand, and past
// its free dwell window (i.e. it's actually accruing the daily overage charge today).
function isEligibleForStorageConversion(p){
  const cust = customerById(p.customerId);
  if(!cust || cust.billingMethod !== 'crossdock') return false;
  if(p.status === 'shipped' || p.workflowOverride === 'storage') return false;
  const fs = feeScheduleFor(p.companyId);
  if(!fs) return false;
  const freeDays = Math.ceil((fs.crossDockFreeDwellHours||48) / 24);
  return todayISO() >= addDays(p.receivedDate, freeDays);
}
// Converts one or more pallets (a whole shipment/load, or a single standalone pallet) from
// Cross-Dock Overage to Monthly Storage billing, effective today. Overage days already accrued
// before today are left as-is (sunk cost, already billed correctly) — see computeCrossDockDwellLines
// and computeStorageLines, which split on workflowConvertedDate.
function convertPalletsToStorage(palletIds){
  const today = todayISO();
  let count = 0;
  palletIds.forEach(id=>{
    const p = palletById(id);
    if(!p || !isEligibleForStorageConversion(p)) return;
    p.workflowOverride = 'storage';
    p.workflowConvertedDate = today;
    count++;
  });
  return count;
}
// Staff-facing confirmation before converting — this is a customer-requested, one-way billing
// change (per the fee schedule, cross-dock overage never auto-converts), so it's worth a confirm
// step rather than a single click. reopenShipmentId re-opens the shipment modal afterward so staff
// land back where they started when converting a whole load.
function confirmConvertToStorage(palletIds, reopenShipmentId){
  const fs = feeScheduleFor(state.currentCompanyId);
  const rate = fs ? fs.floorStoragePerPalletMo : null;
  showModal({
    title: 'Convert to Monthly Storage',
    primaryLabel: 'Convert',
    body: `
      <p>This converts ${palletIds.length} pallet${palletIds.length===1?'':'s'} from Cross-Dock Overage to Monthly Storage billing, effective today.</p>
      <ul style="margin:8px 0;padding-left:20px;font-size:13px;line-height:1.6;">
        <li>Overage days already charged stay as billed — nothing is refunded or re-billed.</li>
        <li>Starting today, storage bills at ${rate!=null ? fmtMoney(rate) : 'the company rate'}/pallet/mo (prorated daily) instead of the per diem overage fee.</li>
        <li>This can't be undone from here — do this only after the customer has asked for it.</li>
      </ul>
    `,
    onPrimary: ()=>{
      const count = convertPalletsToStorage(palletIds);
      toast(`${count} pallet${count===1?'':'s'} converted to Monthly Storage`);
      if(reopenShipmentId) openShipmentModal(reopenShipmentId); else render();
      return true;
    }
  });
}

function chargeAccessorial(pallet, type){
  const cust = customerById(pallet.customerId);
  const fs = cust && cust.billingMethod==='crossdock' ? feeScheduleFor(pallet.companyId) : null;
  if(fs && type === 'Unload'){
    // Cross-dock billing: one flat per-pallet fee at receiving takes the place of the normal
    // unload fee (and covers the eventual load out too — see the skipped 'Load' branch below).
    state.accessorials.push({ id: uid('ACC-'), companyId: pallet.companyId, customerId: pallet.customerId, palletId: pallet.id, shipmentId: null, type: 'CrossDockPallet', description: `Cross-dock fee (per pallet) — includes ${fs.crossDockFreeDwellHours}h free dwell`, amount: fs.crossDockPerPallet, date: todayISO(), invoiceId: null });
    return;
  }
  if(fs && type === 'Load'){
    // Already paid for at receiving via the cross-dock fee above — charging a separate load fee
    // here would double-bill the same pallet's outbound handling.
    return;
  }
  const amount = type === 'Unload' ? effUnloadFee(pallet) : effLoadFee(pallet);
  state.accessorials.push({ id: uid('ACC-'), companyId: pallet.companyId, customerId: pallet.customerId, palletId: pallet.id, shipmentId: null, type, description: null, amount, date: todayISO(), invoiceId: null });
}

/* ---------------------------- Shipments (grouped offload/reload billing) ---------------------------- */
// A Shipment groups multiple pallets under one inbound or outbound event so a single flat
// offload/reload fee can be charged for the whole truckload instead of per pallet. The fee is
// charged once, at shipment creation — joining an already-open shipment with more pallets does
// not add another charge.
function createShipment(customerId, direction, opts){
  opts = opts || {};
  const c = customerById(customerId);
  const fullTrailer = !!opts.fullTrailer;
  const feeManuallySet = (opts.fee!=null && opts.fee!=='' && !isNaN(opts.fee));
  // Fee precedence: an explicit typed amount always wins. Once a company has a real fee schedule,
  // the type-of-offload equipment (Crane/Hoist/etc) never determines the shipment fee — that's
  // decided by shipmentFeeForCount instead (Section 1 for Cross-Dock, Section 2 for everyone
  // else). The older equipment-based shortcut (Crane $300, Hoist $200, everything else $75) only
  // survives as a fallback for a company that hasn't set up a fee schedule at all.
  const usesEquipmentFee = !feeScheduleFor(c.companyId) && !!opts.equipment;
  const dynamicDefaultFee = shipmentFeeForCount(c, direction, fullTrailer, opts.initialPalletCount||0);
  const defaultFee = usesEquipmentFee ? equipmentDefaultFee(opts.equipment) : dynamicDefaultFee;
  const fee = feeManuallySet ? Number(opts.fee) : defaultFee;
  const weightLbs = (opts.weightLbs!=null && opts.weightLbs!=='') ? Number(opts.weightLbs) : null;
  // Dimensions and equipment ("type of offload") are captured on every shipment in this prototype,
  // uniformly across all customers — per-customer requirements can be customized later.
  const dimLength = (opts.dimLength!=null && opts.dimLength!=='') ? Number(opts.dimLength) : null;
  const dimWidth = (opts.dimWidth!=null && opts.dimWidth!=='') ? Number(opts.dimWidth) : null;
  // Bill of lading — captured on every shipment, formatted to cover the fields a standard Uniform
  // Straight Bill of Lading requires (shipper/consignee address, carrier & SCAC, freight charge
  // terms, hazmat declaration with a DOT emergency contact) so the printed document holds up as
  // real shipping paperwork. A BOL number is ALWAYS generated below — regardless of direction or
  // whether transportation is included — because a carrier showing up without their own BOL still
  // needs one to legally move freight, and ACD is on the hook either way as the party generating
  // the paperwork of record.
  const bol = opts.bol || {};
  let bolNumber = (bol.bolNumber || '').trim() || null;
  let carrier = (bol.carrier || '').trim() || null;
  const scac = (bol.scac || '').trim().toUpperCase() || null;
  const driverName = (bol.driverName || '').trim() || null;
  const truckNumber = (bol.truckNumber || '').trim() || null;
  const poNumber = (bol.poNumber || '').trim() || null;
  const bolNotes = (bol.notes || '').trim() || null;
  const bolAddress = (bol.address || '').trim() || null;
  const jobName = (bol.jobName || '').trim() || null;
  const freightTerms = (bol.freightTerms || '').trim() || 'Prepaid';
  const billTo = (bol.billTo || '').trim() || null;
  const freightClass = (bol.freightClass || '').trim() || null;
  const hazmat = !!bol.hazmat;
  const hazmatPhone = hazmat ? ((bol.hazmatPhone || '').trim() || null) : null;
  if(!bolNumber) bolNumber = uid('BOL-');
  // Transportation add-on — only meaningful for customers with transportEnabled; charged once per
  // shipment, as a separate line from the offload/reload fee, when staff opt to include it.
  const transportation = !!opts.transportation;
  let transportFee = null;
  if(transportation){
    const custTransportDefault = direction === 'Inbound' ? c.transportInboundFee : c.transportOutboundFee;
    transportFee = (opts.transportFee!=null && opts.transportFee!=='' && !isNaN(opts.transportFee)) ? Number(opts.transportFee) : (custTransportDefault!=null ? custTransportDefault : 150);
    // When the storage company itself is providing the transportation, it IS the carrier of
    // record — so default the carrier to the company's own name whenever staff leave it blank,
    // instead of asking for info they don't have.
    if(!carrier) carrier = currentCompany().name;
  }
  const shipment = {
    id: uid('SHIP-'), companyId: state.currentCompanyId, warehouseId: state.currentWarehouseId,
    customerId, direction, status:'Open',
    weightLbs, equipment: opts.equipment || null, dimLength, dimWidth, sqft: calcSqft(dimLength, dimWidth), fee,
    // fullTrailer/feeManuallySet control whether addPalletToShipment keeps recomputing the fee as
    // more pallets are scanned in (see there) — only a Cross-Dock, non-full-trailer, non-manually-
    // priced shipment recalculates; everything else is locked in at creation like before.
    fullTrailer, feeManuallySet: feeManuallySet || usesEquipmentFee,
    bolNumber, carrier, scac, driverName, truckNumber, poNumber, bolNotes, bolAddress, jobName, freightTerms, billTo, freightClass, hazmat, hazmatPhone,
    transportation, transportFee,
    palletIds: [], createdDate: todayISO(), completedDate: null
  };
  state.shipments.push(shipment);
  const feeType = direction === 'Inbound' ? 'Offload' : 'Reload';
  // A Cross-Dock Reload leg with no manual override is $0 — already covered by the combined fee
  // charged at receiving — so skip the accessorial line entirely rather than clutter the invoice
  // with a $0.00 charge.
  if(fee > 0 || feeManuallySet){
    state.accessorials.push({
      id: uid('ACC-'), companyId: state.currentCompanyId, customerId, palletId: null, shipmentId: shipment.id,
      type: feeType, description: `${feeType} fee — Shipment ${shipment.id}`, amount: fee, date: todayISO(), invoiceId: null
    });
  }
  if(transportation && transportFee!=null){
    state.accessorials.push({
      id: uid('ACC-'), companyId: state.currentCompanyId, customerId, palletId: null, shipmentId: shipment.id,
      type: 'Transport', description: `Transportation fee (${direction}) — Shipment ${shipment.id}`, amount: transportFee, date: todayISO(), invoiceId: null
    });
  }
  return shipment;
}
function addPalletToShipment(shipmentId, palletId){
  const shipment = shipmentById(shipmentId);
  if(!shipment) return;
  if(!shipment.palletIds.includes(palletId)) shipment.palletIds.push(palletId);
  const p = palletById(palletId);
  if(p) p.shipmentId = shipment.id;
  // A shipment that isn't a full trailer and isn't manually priced bills per pallet actually in
  // it (three-tier: minimum -> per-pallet -> trailer cap) — recompute as each new pallet is
  // scanned in, and update the not-yet-invoiced accessorial to match so the invoice reflects the
  // final count. Cross-Dock's Outbound/Reload leg never has its own fee to begin with (it's $0,
  // no accessorial gets created for it — see shipmentFeeForCount and createShipment), so the
  // lookup below simply finds nothing there and this is a no-op.
  if(!shipment.fullTrailer && !shipment.feeManuallySet){
    const cust = customerById(shipment.customerId);
    const acc = companyAccessorials().find(a=>a.shipmentId===shipment.id && (a.type==='Offload'||a.type==='Reload') && a.invoiceId===null);
    if(cust && acc){
      const newFee = shipmentFeeForCount(cust, shipment.direction, false, shipment.palletIds.length);
      shipment.fee = newFee;
      acc.amount = newFee;
    }
  }
}
function completeShipment(id){
  const shipment = shipmentById(id);
  if(!shipment) return;
  shipment.status = 'Completed';
  shipment.completedDate = todayISO();
}

// Shared by single-pallet ship, the multi-pallet ship queue, and LPN ship-all.
// When shipmentId is given, the pallet is grouped into that outbound shipment (which carries its
// own single flat reload fee) instead of being charged the standard per-pallet load fee.
function shipPalletCore(p, shipmentId){
  if(p.status === 'shipped') return false;
  const from = palletLocationLabel(p);
  releasePalletLocation(p, p.warehouseId);
  p.status = 'shipped';
  p.shippedDate = todayISO();
  state.movements.push({ id: uid('MV-'), companyId: p.companyId, palletId:p.id, type:'Ship', ts:new Date().toISOString(), from: from||'—', to:'Outbound', user:'staff' });
  if(shipmentId){
    p.shipmentId = shipmentId;
    addPalletToShipment(shipmentId, p.id);
  } else {
    chargeAccessorial(p, 'Load');
  }
  return true;
}

/* ---------------------------- LPNs (consolidated shipping units) ---------------------------- */
function createLPN(customerId, palletIds){
  const lpn = { id: uid('LPN-'), companyId: state.currentCompanyId, customerId, palletIds: palletIds.slice(), status:'Open', createdDate: todayISO(), shippedDate:null };
  state.lpns.push(lpn);
  palletIds.forEach(pid=>{ const p = palletById(pid); if(p) p.lpnId = lpn.id; });
  return lpn;
}
function addPalletsToLPN(lpnId, palletIds){
  const lpn = lpnById(lpnId);
  if(!lpn) return;
  palletIds.forEach(pid=>{
    if(!lpn.palletIds.includes(pid)){
      lpn.palletIds.push(pid);
      const p = palletById(pid); if(p) p.lpnId = lpn.id;
    }
  });
}

function renderLPNs(){
  const lpns = companyLpns().slice().sort((a,b)=> b.createdDate.localeCompare(a.createdDate));
  return `
    <h1 class="page-title">LPNs</h1>
    <p class="page-sub">Consolidate multiple pallets onto one license plate number (LPN) so they can be shipped together with a single scan.</p>
    <p class="muted" style="font-size:12.5px;margin:-10px 0 14px;">Select pallets in <button class="link-btn" onclick="showView('inventory')">Inventory</button> and use "Assign to LPN" to create one.</p>
    <div class="panel">
      <div class="panel-body table-wrap">
        ${lpns.length ? `<table>
          <thead><tr><th>LPN</th><th>Customer</th><th>Pallets</th><th>Created</th><th>Status</th><th></th></tr></thead>
          <tbody>
          ${lpns.map(l=>`<tr class="row-click" onclick="openLPNModal('${l.id}')">
            <td class="mono">${l.id}</td>
            <td>${escapeHtml(customerById(l.customerId).name)}</td>
            <td>${l.palletIds.length}</td>
            <td class="muted">${fmtDate(l.createdDate)}</td>
            <td>${l.status==='Shipped' ? '<span class="badge gray"><span class="dot"></span>Shipped</span>' : '<span class="badge green"><span class="dot"></span>Open</span>'}</td>
            <td><span class="link-btn">View →</span></td>
          </tr>`).join('')}
          </tbody>
        </table>` : `<div class="empty-state"><div class="ic">🏷️</div>No LPNs yet — consolidate pallets from Inventory to create one.</div>`}
      </div>
    </div>
  `;
}

function openLPNModal(id){
  const lpn = lpnById(id);
  if(!lpn) return;
  const pallets = lpn.palletIds.map(pid=>palletById(pid)).filter(Boolean);
  showModal({
    title: `LPN ${lpn.id}`,

    body: `
      <div class="pallet-preview">
        <div class="pv-row"><span class="k">Customer</span><span>${escapeHtml(customerById(lpn.customerId).name)}</span></div>
        <div class="pv-row"><span class="k">Created</span><span>${fmtDate(lpn.createdDate)}</span></div>
        <div class="pv-row"><span class="k">Status</span><span>${lpn.status}</span></div>
        ${lpn.shippedDate ? `<div class="pv-row"><span class="k">Shipped</span><span>${fmtDate(lpn.shippedDate)}</span></div>` : ''}
      </div>
      <div class="table-wrap" style="margin-top:10px;">
        <table><thead><tr><th>Pallet</th><th>Description</th><th>Status</th></tr></thead><tbody>
          ${pallets.map(p=>`<tr><td class="mono">${p.id}</td><td>${escapeHtml(p.sku)}</td><td>${statusBadge(p.status)}</td></tr>`).join('')}
        </tbody></table>
      </div>
    `,
    onPrimary: ()=>{
      if(lpn.status!=='Open') return true;
      const ids = lpn.palletIds.filter(pid=>{ const p = palletById(pid); return p && p.status !== 'shipped'; });
      if(!ids.length){ toast('This LPN has already shipped in full.'); return true; }
      // Opens the shipment-confirmation modal (type of load required) in place of this one —
      // returning false here keeps this modal's own auto-close from wiping it out.

// Explains, in the shipment detail modal, how a shipment's offload/reload fee was priced —

// customers aren't covered by the fee schedule at all, so they get no annotation here — their fee
// is just whatever's on their customer record), and on whether it was a flat full-trailer rate, a
// manual override, or the tiered per-pallet formula (recalculates as pallets are scanned in).
function shipmentFeeAnnotation(shipment){
  const cust = customerById(shipment.customerId);
  const fs = feeScheduleFor(cust.companyId);
  if(!fs) return '';
  const isXD = cust.billingMethod === 'crossdock';
  if(!isXD && cust.billingMethod !== 'pallet') return '';
  if(isXD && shipment.direction === 'Outbound'){
    return ' <span class="muted">(free — already covered by the combined fee charged at receiving)</span>';
  }
  if(shipment.fullTrailer){
    return ` <span class="muted">(full trailer, flat rate${isXD ? ' — covers ship-out too' : ''})</span>`;
  }
  if(shipment.feeManuallySet){
    return ' <span class="muted">(manually set)</span>';
  }
  const perPallet = isXD ? fs.crossDockPerPallet : fs.unloadLoadPerPallet;
  const minimum = isXD ? fs.crossDockMinimum : fs.unloadLoadMinimum;
  const cap = isXD ? fs.crossDockPerTrailer : fs.unloadLoadPerTrailer;
  const capPallets = Math.ceil(cap/perPallet);
  const comboNote = isXD ? ' — covers ship-out too' : '';
  return ` <span class="muted">(per pallet, updates as more are added — ${fmtMoney(minimum)} minimum, capped past ${capPallets} pallets${comboNote})</span>`;
}
