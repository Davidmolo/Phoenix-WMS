# Phoenix WMS nginx vhost
# Domain left as placeholder — replace PHOENIX_WMS_DOMAIN then enable + certbot.
# Does NOT touch fuel-staging, fueloptimiser, trailhead, or retention.
#
# Local app ports (PM2):
#   web 127.0.0.1:3030
#   api 127.0.0.1:4020
#
# Enable when domain is ready:
#   1. sed -i 's/PHOENIX_WMS_DOMAIN/your.domain.com/g' /etc/nginx/sites-available/phoenix-wms
#   2. sudo ln -sfn /etc/nginx/sites-available/phoenix-wms /etc/nginx/sites-enabled/phoenix-wms
#   3. sudo certbot --nginx -d your.domain.com
#   4. sudo nginx -t && sudo systemctl reload nginx

upstream phoenix_wms_web {
    server 127.0.0.1:3030;
    keepalive 8;
}

upstream phoenix_wms_api {
    server 127.0.0.1:4020;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name PHOENIX_WMS_DOMAIN;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://phoenix_wms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://phoenix_wms_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
